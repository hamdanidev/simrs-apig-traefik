server:
  http_listen_port: 9080
clients:
  - url: http://192.168.18.120:3100/loki/api/v1/push
    timeout: 10s
    backoff_config:
      min_period: 1s
      max_period: 30s
      max_retries: 5
  # - url: http://22.22.22.128:3100/loki/api/v1/push
  #   timeout: 10s
  #   backoff_config:
  #     min_period: 1s
  #     max_period: 30s
  #     max_retries: 5

scrape_configs:
  - job_name: traefik-access
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: "container"
