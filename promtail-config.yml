server:
  http_listen_port: 9080
  
clients:
  - url: http://192.168.18.120:3100/loki/api/v1/push

scrape_configs:
  - job_name: traefik
    static_configs:
      - targets:
          - localhost
        labels:
          job: traefik-access
          __path__: /var/log/traefik/*.log # Membaca file log dari volume
    pipeline_stages:
      - json:
          expressions:
            status: StartTime
            method: RequestMethod
            path: RequestPath
            latency: Duration
      - labels:
          status:
          method: