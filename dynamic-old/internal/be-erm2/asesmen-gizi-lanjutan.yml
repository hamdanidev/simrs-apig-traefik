http:
  routers:
    erm_asesmen_gizi_lanjutan_create:
      rule: "PathPrefix(`/v1.0/erm/asesmen-gizi-lanjutan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_asesmen_gizi_lanjutan_update:
      rule: "PathPrefix(`/v1.0/erm/asesmen-gizi-lanjutan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_asesmen_gizi_lanjutan_getlist:
      rule: "PathPrefix(`/v1.0/erm/asesmen-gizi-lanjutan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_asesmen_gizi_lanjutan_get_by_id:
      rule: "PathPrefix(`/v1.0/erm/asesmen-gizi-lanjutan/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_asesmen_gizi_lanjutan_get_by_no_registrasi:
      rule: "PathPrefix(`/v1.0/erm/asesmen-gizi-lanjutan/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_asesmen_gizi_lanjutan_delete:
      rule: "PathPrefix(`/v1.0/erm/asesmen-gizi-lanjutan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
