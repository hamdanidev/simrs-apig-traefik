http:
  routers:
    erm_meso_create:
      rule: "PathPrefix(`/v1.0/erm/meso/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_meso_update:
      rule: "PathPrefix(`/v1.0/erm/meso/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
