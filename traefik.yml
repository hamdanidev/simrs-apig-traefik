api:
  dashboard: true
  insecure: true

entryPoints:
  traefik:
    address: ":8080"
  web:
    address: ":9080"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    directory: /etc/traefik/dynamic
    watch: true # <--- Kunci agar perubahan otomatis muncul di dashboard
    
# accessLog:
#   filePath: "/var/log/traefik/access.log" # Path di dalam container
#   format: json                          # Sangat disarankan JSON agar mudah diparsing ke ELK/Loki
#   bufferingSize: 100                    # Menahan log di memori sebelum ditulis (opsional, untuk performa)
#   filters:
#     statusCodes:
#       - "200-299"
#       - "400-599"                       # Log semua request kecuali mungkin yang tidak penting
#     retryAttempts: true
#     minDuration: "10ms"

metrics:
  prometheus:
    entryPoint: traefik # Menggunakan port 8080 (dashboard)
    addEntryPointsLabels: true
    addServicesLabels: true
  
experimental:
  plugins:
    jwt:
      moduleName: github.com/tpaulus/jwt-middleware
      version: v1.1.10