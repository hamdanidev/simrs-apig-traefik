http:
  routers:

    v1_cron-api_medication-request_GET:
      rule: "PathPrefix(`/v1.0/cron-api/medication-request`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-be-cron-api
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_cron-api_medication-request_pending_GET:
      rule: "PathPrefix(`/v1.0/cron-api/medication-request/pending`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-be-cron-api
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_cron-api_medication-request_status_PUT:
      rule: "PathPrefix(`/v1.0/cron-api/medication-request/status/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-be-cron-api
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-be-cron-api:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_BE_CRON_API_URL" }}' # IP Server Prod
