http:
  routers:

    v1_cron-api_encounter_GET:
      rule: "PathPrefix(`/v1.0/cron-api/encounter`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-be-cron-api
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_cron-api_encounter_pending_GET:
      rule: "PathPrefix(`/v1.0/cron-api/encounter/pending`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-be-cron-api
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_cron-api_encounter_status_PUT:
      rule: "PathPrefix(`/v1.0/cron-api/encounter/status/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-be-cron-api
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-be-cron-api:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_BE_CRON_API_URL" }}' # IP Server Prod
