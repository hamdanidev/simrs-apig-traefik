http:

  routers:
    v1_operasi_order-operasi_get-list-order-operasi_GET:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/get-list-order-operasi`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_operasi_order-operasi_get-list-tindakan-operasi_GET:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/get-list-tindakan-operasi`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_operasi_order-operasi_get-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/get-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_operasi_order-operasi_get-by-id-tindakan_GET:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/get-by-id-tindakan/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_operasi_order-operasi_get-by-noregistrasi_GET:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/get-by-noregistrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_operasi_order-operasi_send-to-kasir-by-nomor-order_POST:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/send-to-kasir-by-nomor-order/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_operasi_order-operasi_update-order-operasi_PUT:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/update-order-operasi/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_operasi_order-operasi_update-tindakan-operasi_PUT:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/update-tindakan-operasi/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_operasi_order-operasi_update-hasil_PUT:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/update-hasil/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
  services:
    service-operasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_OPERASI_URL" }}'
