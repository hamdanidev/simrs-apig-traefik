http:
  routers:

    v1_jadwal-periksa-radiologi_getall_GET:
      rule: "PathPrefix(`/v1.0/jadwal-periksa-radiologi/getall`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-radiologi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-radiologi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_RADIOLOGI_URL" }}'
