http:
  routers:

    v1_jadwal-periksa-radiologi_create_POST:
      rule: "PathPrefix(`/v1.0/jadwal-periksa-radiologi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-radiologi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_jadwal-periksa-radiologi_update_PUT:
      rule: "PathPrefix(`/v1.0/jadwal-periksa-radiologi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-radiologi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_jadwal-periksa-radiologi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/jadwal-periksa-radiologi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-radiologi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-radiologi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_RADIOLOGI_URL" }}'
