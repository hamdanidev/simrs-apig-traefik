http:
  routers:

    v1_instalasi_radiologi_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/instalasi/radiologi/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-radiologi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_instalasi_radiologi_update-no-rm_PUT:
      rule: "PathPrefix(`/v1.0/instalasi/radiologi/update-no-rm/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-radiologi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-radiologi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_RADIOLOGI_URL" }}'
