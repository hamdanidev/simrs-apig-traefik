http:
  routers:

    v1_laboratorium-items-lab-mi_getlist_GET:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-mi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-mi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-mi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-mi_create_POST:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-mi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-mi_update_PUT:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-mi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-mi_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-mi/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-mi_getall_GET:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-mi/getall`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-lab:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_LAB_URL" }}'
