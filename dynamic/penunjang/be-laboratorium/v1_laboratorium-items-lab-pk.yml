http:
  routers:

    v1_laboratorium-items-lab-pk_getlist_GET:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-pk/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-pk_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-pk/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-pk_create_POST:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-pk/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-pk_update_PUT:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-pk/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-pk_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-pk/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-pk_getall_GET:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-pk/getall`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-lab:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_LAB_URL" }}'
