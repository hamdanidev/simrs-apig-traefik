http:
  routers:

    v1_laboratorium-items-lab-pa_getlist_GET:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-pa/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-pa_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-pa/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-pa_create_POST:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-pa/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-pa_update_PUT:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-pa/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-pa_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-pa/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items-lab-pa_getall_GET:
      rule: "PathPrefix(`/v1.0/laboratorium-items-lab-pa/getall`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-lab:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_LAB_URL" }}'
