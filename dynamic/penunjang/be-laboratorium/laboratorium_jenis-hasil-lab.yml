http:
  routers:

    v1_laboratorium_jenis-hasil-lab_getall_GET:
      rule: "PathPrefix(`/v1.0/laboratorium/jenis-hasil-lab/getall`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium_jenis-hasil-lab_getlist_GET:
      rule: "PathPrefix(`/v1.0/laboratorium/jenis-hasil-lab/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium_jenis-hasil-lab_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/laboratorium/jenis-hasil-lab/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium_jenis-hasil-lab_create_POST:
      rule: "PathPrefix(`/v1.0/laboratorium/jenis-hasil-lab/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium_jenis-hasil-lab_update_PUT:
      rule: "PathPrefix(`/v1.0/laboratorium/jenis-hasil-lab/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium_jenis-hasil-lab_delete-by-kd_DELETE:
      rule: "PathPrefix(`/v1.0/laboratorium/jenis-hasil-lab/delete-by-kd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-lab:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_LAB_URL" }}'
