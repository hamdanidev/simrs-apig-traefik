http:
  routers:

    v1_laboratorium_sample-lab-mk_getlist_GET:
      rule: "PathPrefix(`/v1.0/laboratorium/sample-lab-mk/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium_sample-lab-mk_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/laboratorium/sample-lab-mk/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium_sample-lab-mk_create_POST:
      rule: "PathPrefix(`/v1.0/laboratorium/sample-lab-mk/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium_sample-lab-mk_update_PUT:
      rule: "PathPrefix(`/v1.0/laboratorium/sample-lab-mk/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium_sample-lab-mk_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/laboratorium/sample-lab-mk/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-lab:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_LAB_URL" }}'
