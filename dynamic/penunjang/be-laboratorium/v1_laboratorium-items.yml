http:
  routers:

    v1_laboratorium-items_getlist_GET:
      rule: "PathPrefix(`/v1.0/laboratorium-items/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/laboratorium-items/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items_create_POST:
      rule: "PathPrefix(`/v1.0/laboratorium-items/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items_update_PUT:
      rule: "PathPrefix(`/v1.0/laboratorium-items/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laboratorium-items_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/laboratorium-items/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-lab
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-lab:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_LAB_URL" }}'
