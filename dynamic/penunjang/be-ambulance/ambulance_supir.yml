http:
  routers:

    v1_ambulance_supir_getlist_GET:
      rule: "PathPrefix(`/v1.0/ambulance/supir/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ambulance_supir_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/ambulance/supir/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ambulance_supir_create_POST:
      rule: "PathPrefix(`/v1.0/ambulance/supir/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ambulance_supir_update_PUT:
      rule: "PathPrefix(`/v1.0/ambulance/supir/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ambulance_supir_delete-by-kd_DELETE:
      rule: "PathPrefix(`/v1.0/ambulance/supir/delete-by-kd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-ambulance:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_AMBULANCE_URL" }}'
