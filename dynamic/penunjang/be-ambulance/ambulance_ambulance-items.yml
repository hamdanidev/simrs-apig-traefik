http:
  routers:

    v1_ambulance_ambulance-items_getlist_GET:
      rule: "PathPrefix(`/v1.0/ambulance/ambulance-items/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ambulance_ambulance-items_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/ambulance/ambulance-items/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ambulance_ambulance-items_create_POST:
      rule: "PathPrefix(`/v1.0/ambulance/ambulance-items/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ambulance_ambulance-items_update_PUT:
      rule: "PathPrefix(`/v1.0/ambulance/ambulance-items/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ambulance_ambulance-items_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/ambulance/ambulance-items/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-ambulance:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_AMBULANCE_URL" }}'
