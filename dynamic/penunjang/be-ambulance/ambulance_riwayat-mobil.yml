http:
  routers:

    v1_ambulance_riwayat-mobil_getlist_GET:
      rule: "PathPrefix(`/v1.0/ambulance/riwayat-mobil/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ambulance_riwayat-mobil_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/ambulance/riwayat-mobil/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ambulance_riwayat-mobil_create_POST:
      rule: "PathPrefix(`/v1.0/ambulance/riwayat-mobil/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ambulance_riwayat-mobil_update_PUT:
      rule: "PathPrefix(`/v1.0/ambulance/riwayat-mobil/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ambulance_riwayat-mobil_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/ambulance/riwayat-mobil/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-ambulance
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-ambulance:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_AMBULANCE_URL" }}'
