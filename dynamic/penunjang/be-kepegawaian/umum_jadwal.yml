http:
  routers:

    v1_umum_jadwal_getlist_GET:
      rule: "PathPrefix(`/v1.0/umum/jadwal/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_umum_jadwal_getbyid_GET:
      rule: "PathPrefix(`/v1.0/umum/jadwal/getbyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
