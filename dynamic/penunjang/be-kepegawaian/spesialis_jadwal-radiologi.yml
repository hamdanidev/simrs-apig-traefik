http:
  routers:

    v1_spesialis_jadwal-radiologi_getlist_GET:
      rule: "PathPrefix(`/v1.0/spesialis/jadwal-radiologi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_jadwal-radiologi_getbyid_GET:
      rule: "PathPrefix(`/v1.0/spesialis/jadwal-radiologi/getbyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_jadwal-radiologi_create_POST:
