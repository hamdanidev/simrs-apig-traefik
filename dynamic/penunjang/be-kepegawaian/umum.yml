http:
  routers:

    v1_umum_create_POST:
      rule: "PathPrefix(`/v1.0/umum/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_umum_update_PUT:
      rule: "PathPrefix(`/v1.0/umum/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
