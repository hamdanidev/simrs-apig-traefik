http:
  routers:

    v1_petugas-medis-lainnya_pendidikan_get-list_GET:
      rule: "PathPrefix(`/v1.0/petugas-medis-lainnya/pendidikan/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_petugas-medis-lainnya_pendidikan_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/petugas-medis-lainnya/pendidikan/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_petugas-medis-lainnya_pendidikan_create_POST:
      rule: "PathPrefix(`/v1.0/petugas-medis-lainnya/pendidikan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_petugas-medis-lainnya_pendidikan_update_PUT:
      rule: "PathPrefix(`/v1.0/petugas-medis-lainnya/pendidikan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_petugas-medis-lainnya_pendidikan_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/petugas-medis-lainnya/pendidikan/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_petugas-medis-lainnya_pendidikan_get-by-kd-petugas-lainnya_GET:
      rule: "PathPrefix(`/v1.0/petugas-medis-lainnya/pendidikan/get-by-kd-petugas-lainnya/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
