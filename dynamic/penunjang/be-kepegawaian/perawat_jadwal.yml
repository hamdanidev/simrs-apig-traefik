http:
  routers:

    v1_perawat_jadwal_getlist_GET:
      rule: "PathPrefix(`/v1.0/perawat/jadwal/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_perawat_jadwal_getbyid_GET:
      rule: "PathPrefix(`/v1.0/perawat/jadwal/getbyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_perawat_jadwal_create_POST:
