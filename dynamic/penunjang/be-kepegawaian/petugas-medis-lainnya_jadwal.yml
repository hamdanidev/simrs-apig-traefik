http:
  routers:

    v1_petugas-medis-lainnya_jadwal_get-list_GET:
      rule: "PathPrefix(`/v1.0/petugas-medis-lainnya/jadwal/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_petugas-medis-lainnya_jadwal_get-by-kd-petugas-medis-lainnya_GET:
