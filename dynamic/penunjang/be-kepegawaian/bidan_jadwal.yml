http:
  routers:

    v1_bidan_jadwal_getlist_GET:
      rule: "PathPrefix(`/v1.0/bidan/jadwal/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_bidan_jadwal_getbyid_GET:
      rule: "PathPrefix(`/v1.0/bidan/jadwal/getbyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_bidan_jadwal_create_POST:
      rule: "PathPrefix(`/v1.0/bidan/jadwal/create/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_bidan_jadwal_update_PUT:
