    v1_gigi_jadwal_update-waktu-absen-datang_PUT:
      rule: "PathPrefix(`/v1.0/gigi/jadwal/update-waktu-absen-datang`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
