http:
  routers:

    v1_gigi_jadwal_getlist_GET:
      rule: "PathPrefix(`/v1.0/gigi/jadwal/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gigi_jadwal_create_POST:
      rule: "PathPrefix(`/v1.0/gigi/jadwal/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gigi_jadwal_update-keterangan_PUT:
      rule: "PathPrefix(`/v1.0/gigi/jadwal/update-keterangan`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gigi_jadwal_update_PUT:
      rule: "PathPrefix(`/v1.0/gigi/jadwal/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gigi_jadwal_deletebyid_DELETE:
      rule: "PathPrefix(`/v1.0/gigi/jadwal/deletebyid/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gigi_jadwal_absendatang_PUT:
      rule: "PathPrefix(`/v1.0/gigi/jadwal/absendatang`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_gigi_jadwal_absenpulang_PUT:
      rule: "PathPrefix(`/v1.0/gigi/jadwal/absenpulang`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_gigi_jadwal_getbykdgigi_GET:
      rule: "PathPrefix(`/v1.0/gigi/jadwal/getbykdgigi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gigi_jadwal_getbytanggal_GET:
      rule: "PathPrefix(`/v1.0/gigi/jadwal/getbytanggal/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gigi_jadwal_getjadwalbytahunbulan_GET:
      rule: "PathPrefix(`/v1.0/gigi/jadwal/getjadwalbytahunbulan/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gigi_jadwal_getjadwalbykdgigitanggaldanabsendatang_GET:
      rule: "PathPrefix(`/v1.0/gigi/jadwal/getjadwalbykdgigitanggaldanabsendatang/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
