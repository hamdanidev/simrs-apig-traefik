http:
  routers:

    v1_kepegawaian_nik-khusus_get-list_GET:
      rule: "PathPrefix(`/v1.0/kepegawaian/nik-khusus/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_kepegawaian_nik-khusus_create_POST:
      rule: "PathPrefix(`/v1.0/kepegawaian/nik-khusus/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kepegawaian_nik-khusus_delete_DELETE:
      rule: "PathPrefix(`/v1.0/kepegawaian/nik-khusus/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kepegawaian_polygon_get-list_GET:
      rule: "PathPrefix(`/v1.0/kepegawaian/polygon/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_kepegawaian_polygon_create_POST:
      rule: "PathPrefix(`/v1.0/kepegawaian/polygon/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kepegawaian_polygon_delete_DELETE:
      rule: "PathPrefix(`/v1.0/kepegawaian/polygon/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
