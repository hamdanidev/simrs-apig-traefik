http:
  routers:

    v1_perawat_pendidikan_getlist_GET:
      rule: "PathPrefix(`/v1.0/perawat/pendidikan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_perawat_pendidikan_getbyid_GET:
      rule: "PathPrefix(`/v1.0/perawat/pendidikan/getbyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_perawat_pendidikan_create_POST:
      rule: "PathPrefix(`/v1.0/perawat/pendidikan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_perawat_pendidikan_update_PUT:
      rule: "PathPrefix(`/v1.0/perawat/pendidikan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_perawat_pendidikan_deletebyid_DELETE:
      rule: "PathPrefix(`/v1.0/perawat/pendidikan/deletebyid/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_perawat_pendidikan_getbykdperawat_GET:
      rule: "PathPrefix(`/v1.0/perawat/pendidikan/getbykdperawat/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
