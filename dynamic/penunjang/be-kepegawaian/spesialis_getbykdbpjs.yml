http:
  routers:

    v1_spesialis_getbykdbpjs_GET:
      rule: "PathPrefix(`/v1.0/spesialis/getbykdbpjs/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
