http:
  routers:

    v1_master-mjkn_referensi-jadwal-dokter_sync-all_GET:
      rule: "PathPrefix(`/v1.0/master-mjkn/referensi-jadwal-dokter/sync-all`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master-mjkn_referensi-jadwal-dokter_sync_GET:
      rule: "PathPrefix(`/v1.0/master-mjkn/referensi-jadwal-dokter/sync`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master-mjkn_referensi-jadwal-dokter_sync_POST:
      rule: "PathPrefix(`/v1.0/master-mjkn/referensi-jadwal-dokter/sync`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
