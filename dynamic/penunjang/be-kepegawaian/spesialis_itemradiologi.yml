http:
  routers:

    v1_spesialis_itemradiologi_getlist_GET:
      rule: "PathPrefix(`/v1.0/spesialis/itemradiologi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_itemradiologi_getbykdspesialis_GET:
      rule: "PathPrefix(`/v1.0/spesialis/itemradiologi/getbykdspesialis/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_itemradiologi_getspesialisbykditem_GET:
      rule: "PathPrefix(`/v1.0/spesialis/itemradiologi/getspesialisbykditem/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_itemradiologi_getspesialisbykodemodalitas_GET:
      rule: "PathPrefix(`/v1.0/spesialis/itemradiologi/getspesialisbykodemodalitas/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_itemradiologi_create_POST:
      rule: "PathPrefix(`/v1.0/spesialis/itemradiologi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_itemradiologi_deletebyid_DELETE:
      rule: "PathPrefix(`/v1.0/spesialis/itemradiologi/deletebyid/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
