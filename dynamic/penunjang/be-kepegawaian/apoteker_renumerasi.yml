http:
  routers:

    v1_apoteker_renumerasi_getlist_GET:
      rule: "PathPrefix(`/v1.0/apoteker/renumerasi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_apoteker_renumerasi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/apoteker/renumerasi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_apoteker_renumerasi_get-by-kd-apoteker_GET:
      rule: "PathPrefix(`/v1.0/apoteker/renumerasi/get-by-kd-apoteker/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_apoteker_renumerasi_create_POST:
      rule: "PathPrefix(`/v1.0/apoteker/renumerasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_apoteker_renumerasi_update_PUT:
      rule: "PathPrefix(`/v1.0/apoteker/renumerasi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_apoteker_renumerasi_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/apoteker/renumerasi/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
