http:
  routers:

    v1_gigi_unitlayanan_getlist_GET:
      rule: "PathPrefix(`/v1.0/gigi/unitlayanan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gigi_unitlayanan_create_POST:
      rule: "PathPrefix(`/v1.0/gigi/unitlayanan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gigi_unitlayanan_deletebyid_DELETE:
      rule: "PathPrefix(`/v1.0/gigi/unitlayanan/deletebyid/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gigi_unitlayanan_getbykdgigi_GET:
      rule: "PathPrefix(`/v1.0/gigi/unitlayanan/getbykdgigi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
