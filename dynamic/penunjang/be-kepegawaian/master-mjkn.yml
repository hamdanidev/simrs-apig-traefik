http:
  routers:
    be_kepegawaian_master_mjkn_get_list:
      rule: "PathPrefix(`/v1.0/master-mjkn/jadwal/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    be_kepegawaian_master_mjkn_ref_jadwal_dokter_sync_all:
      rule: "PathPrefix(`/v1.0/master-mjkn/referensi-jadwal-dokter/sync-all`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    be_kepegawaian_master_mjkn_ref_jadwal_dokter_sync:
      rule: "PathPrefix(`/v1.0/master-mjkn/referensi-jadwal-dokter/sync`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    be_kepegawaian_master_mjkn_jadwal_hfis_sync:
      rule: "PathPrefix(`/v1.0/master-mjkn/jadwal-hfis/sync`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    be_kepegawaian_master_mjkn_jadwal_hfis_sync_all:
      rule: "PathPrefix(`/v1.0/master-mjkn/jadwal-hfis/sync-all`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    be_kepegawaian_master_mjkn_jadwal_hfis_mismatch_poli:
      rule: "PathPrefix(`/v1.0/master-mjkn/jadwal-hfis/mismatch-poli`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    be_kepegawaian_master_mjkn_jadwal_update_kuota_request:
      rule: "PathPrefix(`/v1.0/master-mjkn/jadwal/update-kuota-request`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    be_kepegawaian_master_mjkn_jadwal_update_status:
      rule: "PathPrefix(`/v1.0/master-mjkn/jadwal/update-status`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    be_kepegawaian_master_mjkn_jadwal_update:
      rule: "PathPrefix(`/v1.0/master-mjkn/jadwal/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
