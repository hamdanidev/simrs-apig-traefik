http:
  routers:

    v1_spesialis_pendidikan_getlist_GET:
      rule: "PathPrefix(`/v1.0/spesialis/pendidikan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_pendidikan_getbyid_GET:
      rule: "PathPrefix(`/v1.0/spesialis/pendidikan/getbyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_pendidikan_create_POST:
      rule: "PathPrefix(`/v1.0/spesialis/pendidikan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_pendidikan_update_PUT:
      rule: "PathPrefix(`/v1.0/spesialis/pendidikan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_pendidikan_deletebyid_DELETE:
      rule: "PathPrefix(`/v1.0/spesialis/pendidikan/deletebyid/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_pendidikan_getbykdspesialis_GET:
      rule: "PathPrefix(`/v1.0/spesialis/pendidikan/getbykdspesialis/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
