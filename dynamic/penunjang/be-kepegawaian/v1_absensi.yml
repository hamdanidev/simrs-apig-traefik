http:
  routers:

    v1_absensi_getabsensibyidjadwal_GET:
      rule: "PathPrefix(`/v1.0/absensi/getabsensibyidjadwal/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_absensi_getpegawaibynik_GET:
      rule: "PathPrefix(`/v1.0/absensi/getpegawaibynik/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_absensi_getjadwalbytanggalnik_GET:
      rule: "PathPrefix(`/v1.0/absensi/getjadwalbytanggalnik/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_absensi_polygon_GET:
      rule: "PathPrefix(`/v1.0/absensi/polygon`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_absensi_rekap_GET:
      rule: "PathPrefix(`/v1.0/absensi/rekap`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
