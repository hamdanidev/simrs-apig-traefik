http:
  routers:

    v1_spesialis_unitlayanan_getlist_GET:
      rule: "PathPrefix(`/v1.0/spesialis/unitlayanan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_unitlayanan_create_POST:
      rule: "PathPrefix(`/v1.0/spesialis/unitlayanan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_unitlayanan_deletebyid_DELETE:
      rule: "PathPrefix(`/v1.0/spesialis/unitlayanan/deletebyid/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_unitlayanan_getbykdspesialis_GET:
      rule: "PathPrefix(`/v1.0/spesialis/unitlayanan/getbykdspesialis/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_unitlayanan_getspesialisbykdlayanan_GET:
      rule: "PathPrefix(`/v1.0/spesialis/unitlayanan/getspesialisbykdlayanan/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_unitlayanan_getspesialisbykdunitbpjs_GET:
      rule: "PathPrefix(`/v1.0/spesialis/unitlayanan/getspesialisbykdunitbpjs/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
