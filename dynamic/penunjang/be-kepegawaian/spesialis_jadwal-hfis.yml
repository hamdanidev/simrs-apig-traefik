http:
  routers:

    v1_spesialis_jadwal-hfis_getlist_GET:
      rule: "PathPrefix(`/v1.0/spesialis/jadwal-hfis/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spesialis_jadwal-hfis_create_POST:
