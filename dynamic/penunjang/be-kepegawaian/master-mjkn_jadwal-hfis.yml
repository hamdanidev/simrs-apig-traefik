http:
  routers:

    v1_master-mjkn_jadwal-hfis_sync_GET:
      rule: "PathPrefix(`/v1.0/master-mjkn/jadwal-hfis/sync`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master-mjkn_jadwal-hfis_sync-all_GET:
      rule: "PathPrefix(`/v1.0/master-mjkn/jadwal-hfis/sync-all`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master-mjkn_jadwal-hfis_mismatch-poli_GET:
      rule: "PathPrefix(`/v1.0/master-mjkn/jadwal-hfis/mismatch-poli`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kepegawaian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kepegawaian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KEPEGAWAIAN_URL" }}'
