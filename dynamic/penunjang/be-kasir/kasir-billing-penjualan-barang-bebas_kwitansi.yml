http:
  routers:

    v1_kasir-billing-penjualan-barang-bebas_kwitansi_create_POST:
      rule: "PathPrefix(`/v1.0/kasir-billing-penjualan-barang-bebas/kwitansi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kasir-billing-penjualan-barang-bebas_kwitansi_getlist-kwitansi_GET:
      rule: "PathPrefix(`/v1.0/kasir-billing-penjualan-barang-bebas/kwitansi/getlist-kwitansi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kasir-billing-penjualan-barang-bebas_kwitansi_getlist-kwitansi-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/kasir-billing-penjualan-barang-bebas/kwitansi/getlist-kwitansi-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kasir-billing-penjualan-barang-bebas_kwitansi_update-bukti-bayar_PUT:
      rule: "PathPrefix(`/v1.0/kasir-billing-penjualan-barang-bebas/kwitansi/update-bukti-bayar/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kasir-billing-penjualan-barang-bebas_kwitansi_update-tgl-kwitansi_PUT:
      rule: "PathPrefix(`/v1.0/kasir-billing-penjualan-barang-bebas/kwitansi/update-tgl-kwitansi`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kasir:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KASIR_URL" }}' # IP Server Prod
