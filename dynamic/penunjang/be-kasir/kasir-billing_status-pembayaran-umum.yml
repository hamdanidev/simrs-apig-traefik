http:
  routers:

    v1_kasir-billing_status-pembayaran-umum_GET:
      rule: "PathPrefix(`/v1.0/kasir-billing/status-pembayaran-umum`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kasir:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KASIR_URL" }}' # IP Server Prod
