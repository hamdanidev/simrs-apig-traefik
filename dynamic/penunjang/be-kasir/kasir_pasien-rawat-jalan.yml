http:
  routers:

    v1_kasir_pasien-rawat-jalan_getlist_GET:
      rule: "PathPrefix(`/v1.0/kasir/pasien-rawat-jalan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kasir_pasien-rawat-jalan_getlist_selesai-layanan_GET:
      rule: "PathPrefix(`/v1.0/kasir/pasien-rawat-jalan/getlist/selesai-layanan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kasir_pasien-rawat-jalan_getlist_by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/kasir/pasien-rawat-jalan/getlist/by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kasir_pasien-rawat-jalan_update_status_PUT:
      rule: "PathPrefix(`/v1.0/kasir/pasien-rawat-jalan/update/status/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kasir:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KASIR_URL" }}' # IP Server Prod
