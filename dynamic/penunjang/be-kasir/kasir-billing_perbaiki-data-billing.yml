http:
  routers:

    v1_kasir-billing_perbaiki-data-billing_DELETE:
      rule: "PathPrefix(`/v1.0/kasir-billing/perbaiki-data-billing/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kasir:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KASIR_URL" }}' # IP Server Prod
