http:
  routers:

    v1_kasir-billing-penjualan-barang-bebas_item_getlist-item-by-no-kwitansi_GET:
      rule: "PathPrefix(`/v1.0/kasir-billing-penjualan-barang-bebas/item/getlist-item-by-no-kwitansi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kasir-billing-penjualan-barang-bebas_item_item_GET:
      rule: "PathPrefix(`/v1.0/kasir-billing-penjualan-barang-bebas/item/item/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kasir-billing-penjualan-barang-bebas_item_update-no-kwitansi_PUT:
      rule: "PathPrefix(`/v1.0/kasir-billing-penjualan-barang-bebas/item/update-no-kwitansi`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kasir:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KASIR_URL" }}' # IP Server Prod
