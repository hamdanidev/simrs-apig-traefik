http:
  routers:

    v1_kasir-billing_update-sub-billing-item_PUT:
      rule: "PathPrefix(`/v1.0/kasir-billing/update-sub-billing-item`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kasir
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-kasir:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_KASIR_URL" }}' # IP Server Prod
