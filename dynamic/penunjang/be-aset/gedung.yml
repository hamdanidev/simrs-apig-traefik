http:
  routers:

    v1_gedung_create_POST:
      rule: "PathPrefix(`/v1.0/gedung/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gedung_update_PUT:
      rule: "PathPrefix(`/v1.0/gedung/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-aset:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ASET_URL" }}' # IP Server Prod
