http:
  routers:

    v1_kamar_bed_getlist_GET:
      rule: "PathPrefix(`/v1.0/kamar/bed/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kamar_bed_getlistbykdkamar_GET:
      rule: "PathPrefix(`/v1.0/kamar/bed/getlistbykdkamar/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kamar_bed_create_POST:
      rule: "PathPrefix(`/v1.0/kamar/bed/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kamar_bed_update_PUT:
      rule: "PathPrefix(`/v1.0/kamar/bed/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kamar_bed_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/kamar/bed/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-aset:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ASET_URL" }}' # IP Server Prod
