http:
  routers:

    v1_inventaris_getlist_GET:
      rule: "PathPrefix(`/v1.0/inventaris/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_inventaris_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/inventaris/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_inventaris_generate-kode_GET:
      rule: "PathPrefix(`/v1.0/inventaris/generate-kode/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_inventaris_create_POST:
      rule: "PathPrefix(`/v1.0/inventaris/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_inventaris_update_PUT:
      rule: "PathPrefix(`/v1.0/inventaris/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_inventaris_update-terinventaris_PUT:
      rule: "PathPrefix(`/v1.0/inventaris/update-terinventaris`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_inventaris_delete_DELETE:
      rule: "PathPrefix(`/v1.0/inventaris/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-aset:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ASET_URL" }}' # IP Server Prod
