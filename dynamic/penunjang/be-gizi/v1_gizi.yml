http:
  routers:

    v1_gizi_proses-makanan_getlist_GET:
      rule: "PathPrefix(`/v1.0/gizi/proses-makanan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-gizi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gizi_proses-makanan_get-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/gizi/proses-makanan/get-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-gizi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gizi_proses-makanan_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/gizi/proses-makanan/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-gizi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gizi_proses-makanan_update-status-diterima_PUT:
      rule: "PathPrefix(`/v1.0/gizi/proses-makanan/update-status-diterima`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-gizi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gizi_proses-makanan_update-status-selesai_PUT:
      rule: "PathPrefix(`/v1.0/gizi/proses-makanan/update-status-selesai`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-gizi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gizi_proses-makanan_update-ceklis_PUT:
      rule: "PathPrefix(`/v1.0/gizi/proses-makanan/update-ceklis`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-gizi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gizi_proses-makanan_update-ceklis-alat-makan_PUT:
      rule: "PathPrefix(`/v1.0/gizi/proses-makanan/update-ceklis-alat-makan`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-gizi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gizi_proses-makanan_update-status-pengembalian-alat_PUT:
      rule: "PathPrefix(`/v1.0/gizi/proses-makanan/update-status-pengembalian-alat`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-gizi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-gizi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_GIZI_URL" }}'
