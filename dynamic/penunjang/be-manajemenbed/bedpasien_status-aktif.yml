http:
  routers:

    v1_bedpasien_status-aktif_PUT:
      rule: "PathPrefix(`/v1.0/bedpasien/status-aktif/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-bed:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_BED_URL" }}' # IP Server Prod
