http:
  routers:

    v1_bedpasien_deletebyid_DELETE:
      rule: "PathPrefix(`/v1.0/bedpasien/deletebyid/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-bed:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_BED_URL" }}' # IP Server Prod
