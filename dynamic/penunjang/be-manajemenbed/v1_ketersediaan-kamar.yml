http:
  routers:

    v1_ketersediaan-kamar_getlist_GET:
      rule: "PathPrefix(`/v1.0/ketersediaan-kamar/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-basic-auth"

  services:
    service-bed:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_BED_URL" }}' # IP Server Prod
