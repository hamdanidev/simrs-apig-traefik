http:
  routers:

    v1_bedpasien_riwayat_getlistbyidbedpasien_GET:
      rule: "PathPrefix(`/v1.0/bedpasien/riwayat/getlistbyidbedpasien/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_bedpasien_riwayat_create_POST:
      rule: "PathPrefix(`/v1.0/bedpasien/riwayat/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-bed:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_BED_URL" }}' # IP Server Prod
