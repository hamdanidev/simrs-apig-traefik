http:
  routers:
    bed_pasien_1:
      rule: "PathPrefix(`/v1.0/bedpasien/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    bed_pasien_2:
      rule: "PathPrefix(`/v1.0/bedpasien/getbyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    bed_pasien_3:
      rule: "PathPrefix(`/v1.0/bedpasien/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    bed_pasien_4:
      rule: "PathPrefix(`/v1.0/bedpasien/status/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    bed_pasien_5:
      rule: "PathPrefix(`/v1.0/bedpasien/deletebyid/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    laporan_bed_1:
      rule: "PathPrefix(`/v1.0/manajemen-bed/monitoring-bed-rawat-inap`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        # - "simrs-basic-auth"
        - "simrs-auth"

    riwayat_bed_pasien_1:
      rule: "PathPrefix(`/v1.0/bedpasien/riwayat/getlistbyidbedpasien/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    riwayat_bed_pasien_2:
      rule: "PathPrefix(`/v1.0/bedpasien/riwayat/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    bed_ketersediaan_kamar_1:
      rule: "PathPrefix(`/v1.0/ketersediaan-kamar/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-basic-auth"
  services:
    service-bed:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_BED_URL" }}' # IP Server Prod
