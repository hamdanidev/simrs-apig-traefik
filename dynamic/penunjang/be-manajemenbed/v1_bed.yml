http:
  routers:

    v1_bed_getdatabed_GET:
      rule: "PathPrefix(`/v1.0/bed/getdatabed`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_bed_getdatabed-updated_GET:
      rule: "PathPrefix(`/v1.0/bed/getdatabed-updated`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-bed
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-bed:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_BED_URL" }}' # IP Server Prod
