# ============================================================
# FILE INI BERISI ROUTE YANG BELUM ADA DI TRAEFIK SETUP SAAT INI
# Dibuat berdasarkan perbandingan dengan APISIX config sebelumnya
#
# Services yang DITAMBAHKAN:
#   1. cssd          → 22.22.22.59:9107  (server internal)
#   2. diklat        → 22.22.22.59:9086  (server internal)
#   3. forensik      → 22.22.22.59:9085  (server internal)
#   4. gas-medis     → 22.22.22.59:9108  (server internal)
#   5. inacbg        → 22.22.22.23:9082  (server interop)
#   6. interop-biometrik → (perlu konfirmasi IP/port, placeholder 22.22.22.23:XXXX)
#   7. log-monitoring → 22.22.22.57:9104 (server core)
#   8. manajemen-bed (routes tambahan) → 192.168.18.154:8087 (service sudah ada di penunjang)
#   9. mcu           → 22.22.22.59:9103  (server internal)
#  10. operasi (routes tambahan) → 192.168.18.154:8099 (service sudah ada di penunjang)
#  11. remun-hitung  → 22.22.22.59:9150  (server internal)
#  12. remunerasi    → 22.22.22.59:9089  (server internal)
#  13. sarpras       → 22.22.22.59:9111  (server internal)
#  14. sirs          → 22.22.22.23:9101  (server interop)
#  15. transfusi-darah → 22.22.22.59:9081 (server internal)
#
# CATATAN:
# - manajemen-bed & operasi sudah punya service di penunjang tapi belum ada routes
# - interop-biometrik tidak ada di .env APISIX, perlu konfirmasi IP/port
# ============================================================

http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Requested-With"
          - "X-Rs-Code"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        # Tambahkan baris di bawah ini untuk memastikan header Auth diizinkan
        addVaryHeader: true
  routers:
    # ==================== CSSD ====================
    cssd_cleaning_1:
      rule: "PathPrefix(`/v1.0/cssd/cleaning/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

