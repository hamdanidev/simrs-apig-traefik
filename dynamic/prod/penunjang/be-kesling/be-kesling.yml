http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Requested-With"
          - "X-Rs-Code"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        # Tambahkan baris di bawah ini untuk memastikan header Auth diizinkan
        addVaryHeader: true

  routers:
    order_kesling_1:
      rule: "PathPrefix(`/v1.0/kesling/order-kesling/get-list-order-kesling`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kesling
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    order_kesling_2:
      rule: "PathPrefix(`/v1.0/kesling/order-kesling/get-list-order-kesling-multi-level`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kesling
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    order_kesling_3:
      rule: "PathPrefix(`/v1.0/kesling/order-kesling/get-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kesling
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    order_kesling_4:
      rule: "PathPrefix(`/v1.0/kesling/order-kesling/create-order-kesling`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kesling
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    order_kesling_5:
      rule: "PathPrefix(`/v1.0/kesling/order-kesling/update-order-kesling/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kesling
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    order_kesling_6:
      rule: "PathPrefix(`/v1.0/kesling/order-kesling/delete-order-kesling/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-kesling
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-kesling:
      loadBalancer:
        servers:
          - url: "http://22.22.22.61:9109"
