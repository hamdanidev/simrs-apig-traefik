http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Requested-With"
          - "X-Rs-Code"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        # Tambahkan baris di bawah ini untuk memastikan header Auth diizinkan
        addVaryHeader: true
  routers:
    notifikasi_1:
      rule: "PathPrefix(`/v1.0/websocket/notifikasi-log/get-by-kd-user/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-notifikasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    notifikasi_2:
      rule: "PathPrefix(`/v1.0/websocket/notifikasi-log/update-status`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-notifikasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
  services:
    service-notifikasi:
      loadBalancer:
        servers:
          - url: "http://22.22.22.61:9099"
