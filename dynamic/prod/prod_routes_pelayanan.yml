http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
        - "GET"
        - "POST"
        - "PUT"
        - "DELETE"
        - "OPTIONS"
        accessControlAllowHeaders:
        - "Authorization"
        - "Content-Type"
        - "X-Requested-With"
        - "X-Rs-Code"
        accessControlAllowOriginList:
        - "*"
        accessControlMaxAge: 100
        # Tambahkan baris di bawah ini untuk memastikan header Auth diizinkan
        addVaryHeader: true
  routers:
    admlayanan_1:
      rule: "PathPrefix(`/v1.0/admlayanan/rawatjalan/create`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
      - web
      middlewares:
      - "simrs-cors"
