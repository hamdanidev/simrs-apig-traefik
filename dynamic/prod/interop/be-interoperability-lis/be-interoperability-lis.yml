http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Requested-With"
          - "X-Rs-Code"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        # Tambahkan baris di bawah ini untuk memastikan header Auth diizinkan
        addVaryHeader: true
  routers:
    interop_lis_1:
      rule: "PathPrefix(`/v1.0/lis/demographics/get-list-demographics`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    interop_lis_2:
      rule: "PathPrefix(`/v1.0/lis/ordered-items/get-list-ordered-items`) && (Method(`GET`) || Method(`OPTIONS`))"
