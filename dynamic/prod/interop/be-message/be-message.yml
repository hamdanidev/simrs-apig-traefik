http:
 
  routers:
    mesage_1:
      rule: "PathPrefix(`/v1.0/message/upload`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-message
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    mesage_2:
      rule: "PathPrefix(`/v1.0/message/send-message`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-message
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    mesage_3:
      rule: "PathPrefix(`/v1.0/message/send-image`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-message
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    mesage_4:
      rule: "PathPrefix(`/v1.0/message/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-message
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-message:
      loadBalancer:
        servers:
          - url: "http://22.22.22.23:9113"
