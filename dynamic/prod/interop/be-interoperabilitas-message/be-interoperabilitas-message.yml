      service: service-interop-message
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    interop_message_8:
      rule: "PathPrefix(`/v1.0/sender-wa/send-video`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-interop-message
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    interop_message_9:
      rule: "PathPrefix(`/v1.0/sender-wa/send-location`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-interop-message
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
  services:
    service-interop-message:
      loadBalancer:
        servers:
          - url: "${PROD_SERVICE_INTEROP_MESSAGE_URL}"
