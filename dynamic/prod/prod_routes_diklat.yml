# ============================================================
# DIKLAT ROUTES
# Service: service-diklat → 192.168.18.152:9086
#
# Diklat memiliki 700+ individual endpoint. File ini menggunakan
# broad PathPrefix per prefix top-level agar lebih manageable.
# Jika ada konflik routing dengan service lain (terutama /v1.0/master/
# karena master service juga pakai prefix ini), gunakan file
# dev_routes_diklat_granular.yml yang berisi route per endpoint.
# ============================================================

http:
  routers:
    diklat-bagian:
      rule: "PathPrefix(`/v1.0/bagian/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-kaji-etik:
      rule: "PathPrefix(`/v1.0/kaji-etik/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-komite-etik:
      rule: "PathPrefix(`/v1.0/komite-etik/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-magang:
      rule: "PathPrefix(`/v1.0/magang/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-narasumber-orientasi:
      rule: "PathPrefix(`/v1.0/narasumber-orientasi/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-pelatihan:
      rule: "PathPrefix(`/v1.0/pelatihan/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-penelitian:
      rule: "PathPrefix(`/v1.0/penelitian/`)"
      service: service-diklat
      entryPoints:
