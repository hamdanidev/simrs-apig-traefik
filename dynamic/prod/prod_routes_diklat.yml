    diklat-master-petugas-ruangan:
      rule: "PathPrefix(`/v1.0/master/petugas-ruangan/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-route:
      rule: "PathPrefix(`/v1.0/diklat/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: "http://22.22.22.:9086"
