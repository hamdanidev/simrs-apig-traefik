      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-peserta-diklat:
      rule: "PathPrefix(`/v1.0/peserta-diklat/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-petugas-kaji-etik:
      rule: "PathPrefix(`/v1.0/petugas-kaji-etik/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-petugas-pre-survey:
      rule: "PathPrefix(`/v1.0/petugas-pre-survey/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-pkl:
      rule: "PathPrefix(`/v1.0/pkl/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-ppd:
      rule: "PathPrefix(`/v1.0/ppd/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-ppds:
      rule: "PathPrefix(`/v1.0/ppds/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-pre-survey:
      rule: "PathPrefix(`/v1.0/pre-survey/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-referensi-petugas:
      rule: "PathPrefix(`/v1.0/referensi-petugas/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-rekap-diklat:
      rule: "PathPrefix(`/v1.0/rekap-diklat/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-sewa-aula:
      rule: "PathPrefix(`/v1.0/sewa-aula/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-studi-banding:
      rule: "PathPrefix(`/v1.0/studi-banding/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-universitas:
      rule: "PathPrefix(`/v1.0/universitas/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    # Sub-path diklat yang share prefix /v1.0/diklat/ dan /v1.0/master/
    # CATATAN: /v1.0/master/ juga dipakai oleh service-master di core.
    # Routes ini lebih spesifik, harus ditempatkan SEBELUM route master yang lebih broad
    diklat-master-bagian:
      rule: "PathPrefix(`/v1.0/master/bagian`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-master-stase:
      rule: "PathPrefix(`/v1.0/master/stase/`)"
      service: service-diklat
      entryPoints:
