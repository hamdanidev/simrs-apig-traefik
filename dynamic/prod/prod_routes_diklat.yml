      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-master-universitas:
      rule: "PathPrefix(`/v1.0/master/pelatihan/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-master-peserta-pendidikan:
      rule: "PathPrefix(`/v1.0/master/peserta-pendidikan/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-master-pembelajaran:
      rule: "PathPrefix(`/v1.0/master/bagian-pembelajaran`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-master-jaspel-diklat:
      rule: "PathPrefix(`/v1.0/master/jaspel-diklat/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    diklat-master-petugas-bagian:
      rule: "PathPrefix(`/v1.0/master/petugas-bagian/`)"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
