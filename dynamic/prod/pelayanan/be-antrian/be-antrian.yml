http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Requested-With"
          - "X-Rs-Code"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        # Tambahkan baris di bawah ini untuk memastikan header Auth diizinkan
        addVaryHeader: true
  routers:
    farmasi_1:
      rule: "PathPrefix(`/v1.0/farmasi/getbytglantrian/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
