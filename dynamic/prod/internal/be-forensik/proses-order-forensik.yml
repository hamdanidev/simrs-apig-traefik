http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Requested-With"
          - "X-Rs-Code"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        addVaryHeader: true
  routers:
    forensik_order_internal_1:
      rule: "PathPrefix(`/v1.0/forensik/proses-order-forensik-internal/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-forensik
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    forensik_order_internal_2:
      rule: "PathPrefix(`/v1.0/forensik/proses-order-forensik-internal/getlist-order-forensik-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-forensik
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    forensik_order_internal_3:
      rule: "PathPrefix(`/v1.0/forensik/proses-order-forensik-internal/getlist-tindakan-order-forensik-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-forensik
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    forensik_order_internal_4:
      rule: "PathPrefix(`/v1.0/forensik/proses-order-forensik-internal/update-status-order-diterima`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-forensik
