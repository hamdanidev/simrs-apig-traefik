http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Requested-With"
          - "X-Rs-Code"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        addVaryHeader: true
  routers:
    internal_remun_hitung_1:
      rule: "PathPrefix(`/v1.0/remun/proses-remunerasi-bpjs`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-remun-hitung
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
  services:
    service-remun-hitung:
      loadBalancer:
        servers:
          - url: "http://22.22.22.59:9150"
