http:

  routers:
    internal_sterilisasi_1:
      rule: "PathPrefix(`/v1.0/cssd/sterilisasi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
    internal_sterilisasi_2:
      rule: "PathPrefix(`/v1.0/cssd/sterilisasi/get-by-id-sterilisasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
    internal_sterilisasi_3:
      rule: "PathPrefix(`/v1.0/cssd/sterilisasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
    internal_sterilisasi_4:
      rule: "PathPrefix(`/v1.0/cssd/sterilisasi/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
  services:
    service-cssd:
      loadBalancer:
        servers:
          - url: "${SERVICE_CSSD_URL}"
