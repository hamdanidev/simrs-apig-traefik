http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Requested-With"
          - "X-Rs-Code"
          - "Req-Id"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        addVaryHeader: true
    simrs-auth:
      plugin:
        jwt:
          Secret: '{{ env "JWT_SCREET" }}'
          AuthorizationHeader: "Authorization"
          HeaderPrefix: ""
          PayloadFields:
            - "token" # token
            - "nama_lengkap" # nama
            - "username" # username
