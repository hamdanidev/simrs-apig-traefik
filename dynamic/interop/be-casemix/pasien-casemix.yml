http:
  routers:

    v1_pasien-casemix_create_POST:
      rule: "PathPrefix(`/v1.0/pasien-casemix/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-casemix_update_PUT:
      rule: "PathPrefix(`/v1.0/pasien-casemix/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-casemix_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pasien-casemix/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-casemix:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CASEMIX_URL" }}'
