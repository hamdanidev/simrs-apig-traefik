http:
  routers:

    v1_pasien-casemix_get-all-pasien-casemix_GET:
      rule: "PathPrefix(`/v1.0/pasien-casemix/get-all-pasien-casemix`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-casemix:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CASEMIX_URL" }}'
