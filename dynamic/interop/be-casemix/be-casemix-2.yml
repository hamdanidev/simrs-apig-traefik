http:
  routers:
    casemix_merge_document:
      rule: "PathPrefix(`/v1.0/merge/document`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-casemix-2
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"


    casemix_merge_document_batch:
      rule: "PathPrefix(`/v1.0/merge/document-batch`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-casemix-2
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-casemix-2:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CASEMIX_URL_2" }}'
