http:
  routers:
    v1_merge_document_POST:
      rule: "PathPrefix(`/v1.0/merge/document`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-casemix-2
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"


    v1_merge_document-batch_POST:
      rule: "PathPrefix(`/v1.0/merge/document-batch`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-casemix-2
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"


    v1_bundling_request_POST:
      rule: "PathPrefix(`/v1.0/bundling/request`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-casemix-2
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_bundling_check_GET:
      rule: "PathPrefix(`/v1.0/bundling/check`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-casemix-2
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_bundling_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bundling/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-casemix-2
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_bundling_proses_POST:
      rule: "PathPrefix(`/v1.0/bundling/proses/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-casemix-2
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_bundling_zip_getlist_GET:
      rule: "PathPrefix(`/v1.0/bundling/zip/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-casemix-2
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
  services:
    service-casemix-2:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CASEMIX_URL_2" }}'
