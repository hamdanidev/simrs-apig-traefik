http:
  routers:

    v1_merge-file_berkas-digital_POST:
      rule: "PathPrefix(`/v1.0/merge-file/berkas-digital`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-casemix:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CASEMIX_URL" }}'
