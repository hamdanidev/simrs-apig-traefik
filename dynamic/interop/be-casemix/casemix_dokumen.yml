http:
  routers:

    v1_casemix_dokumen_create_POST:
      rule: "PathPrefix(`/v1.0/casemix/dokumen/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_casemix_dokumen_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/casemix/dokumen/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_casemix_dokumen_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/casemix/dokumen/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        #- "simrs-auth"

    v1_casemix_dokumen_delete_DELETE:
      rule: "PathPrefix(`/v1.0/casemix/dokumen/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        #- "simrs-auth"

  services:
    service-casemix:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CASEMIX_URL" }}'
