http:
  routers:

    v1_data-umbal_delete_DELETE:
      rule: "PathPrefix(`/v1.0/data-umbal/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-casemix:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CASEMIX_URL" }}'
