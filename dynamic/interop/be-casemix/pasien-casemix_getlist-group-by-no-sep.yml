http:
  routers:

    v1_pasien-casemix_getlist-group-by-no-sep_GET:
      rule: "PathPrefix(`/v1.0/pasien-casemix/getlist-group-by-no-sep`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-casemix:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CASEMIX_URL" }}'
