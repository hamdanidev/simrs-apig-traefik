http:
  routers:

    v1_generate-txt_pasien-jamkesda-dari-casemix_POST:
      rule: "PathPrefix(`/v1.0/generate-txt/pasien-jamkesda-dari-casemix`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_generate-txt_pasien-jamkesda-dari-casemix-encrypted_POST:
      rule: "PathPrefix(`/v1.0/generate-txt/pasien-jamkesda-dari-casemix-encrypted`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_generate-txt_get-pasien-jamkesda_GET:
      rule: "PathPrefix(`/v1.0/generate-txt/get-pasien-jamkesda/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-casemix:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CASEMIX_URL" }}'
