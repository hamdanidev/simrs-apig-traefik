http:
  routers:

    update_no_peserta_bpjs_by_nik:
      rule: "Path(`/v1.0/pasien-casemix/update-no-peserta-bpjs-by-nik`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-casemix:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CASEMIX_URL" }}'
