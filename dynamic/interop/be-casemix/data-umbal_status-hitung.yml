http:
  routers:

    v1_data-umbal_status-hitung_PUT:
      rule: "PathPrefix(`/v1.0/data-umbal/status-hitung`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-casemix:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CASEMIX_URL" }}'
