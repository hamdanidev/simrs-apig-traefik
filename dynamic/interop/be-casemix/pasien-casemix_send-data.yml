http:
  routers:

    v1_pasien-casemix_send-data_POST:
      rule: "PathPrefix(`/v1.0/pasien-casemix/send-data`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-casemix:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CASEMIX_URL" }}'
