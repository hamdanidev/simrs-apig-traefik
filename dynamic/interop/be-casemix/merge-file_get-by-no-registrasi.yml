http:
  routers:

    v1_merge-file_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/merge-file/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-casemix
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-casemix:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CASEMIX_URL" }}'
