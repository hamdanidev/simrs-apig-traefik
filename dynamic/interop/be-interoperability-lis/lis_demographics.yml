http:
  routers:

    v1_lis_demographics_get-list-demographics_GET:
      rule: "PathPrefix(`/v1.0/lis/demographics/get-list-demographics`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lis_demographics_get-by-patient-id-mr_GET:
      rule: "PathPrefix(`/v1.0/lis/demographics/get-by-patient-id-mr/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lis_demographics_create-demographics_POST:
      rule: "PathPrefix(`/v1.0/lis/demographics/create-demographics`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lis_demographics_delete-demographics_DELETE:
      rule: "PathPrefix(`/v1.0/lis/demographics/delete-demographics/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lis_demographics_update-demographics_PUT:
      rule: "PathPrefix(`/v1.0/lis/demographics/update-demographics/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-lis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_LIS_URL" }}'
