http:
  routers:

    v1_lis_lab-results_get-list-lab-results_GET:
      rule: "PathPrefix(`/v1.0/lis/lab-results/get-list-lab-results`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lis_lab-results_get-by-lis-reg-no-lis-test-id_GET:
      rule: "PathPrefix(`/v1.0/lis/lab-results/get-by-lis-reg-no-lis-test-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lis_lab-results_create-lab-results_POST:
      rule: "PathPrefix(`/v1.0/lis/lab-results/create-lab-results`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lis_lab-results_delete-lab-results_DELETE:
      rule: "PathPrefix(`/v1.0/lis/lab-results/delete-lab-results/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lis_lab-results_update-lab-results_PUT:
      rule: "PathPrefix(`/v1.0/lis/lab-results/update-lab-results/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lis_lab-results_update-lab-results2_PUT:
      rule: "PathPrefix(`/v1.0/lis/lab-results/update-lab-results2/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-lis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_LIS_URL" }}'
