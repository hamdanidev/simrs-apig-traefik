http:
  routers:

    v1_lis_ordered-items_get-list-ordered-items_GET:
      rule: "PathPrefix(`/v1.0/lis/ordered-items/get-list-ordered-items`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lis_ordered-items_get-by-order-number-and-item-id_GET:
      rule: "PathPrefix(`/v1.0/lis/ordered-items/get-by-order-number-and-item-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lis_ordered-items_create-ordered-items_POST:
      rule: "PathPrefix(`/v1.0/lis/ordered-items/create-ordered-items`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lis_ordered-items_delete-ordered-items_DELETE:
      rule: "PathPrefix(`/v1.0/lis/ordered-items/delete-ordered-items/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lis_ordered-items_update-ordered-items_PUT:
      rule: "PathPrefix(`/v1.0/lis/ordered-items/update-ordered-items/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-lis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-lis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_LIS_URL" }}'
