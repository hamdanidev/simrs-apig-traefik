http:
  routers:

    v1_vclaim_peserta_no-kartu-bpjs_POST:
      rule: "PathPrefix(`/v1.0/vclaim/peserta/no-kartu-bpjs`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-bpjs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_vclaim_peserta_nik_POST:
      rule: "PathPrefix(`/v1.0/vclaim/peserta/nik`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-bpjs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-bpjs:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_BPJS_URL" }}'
