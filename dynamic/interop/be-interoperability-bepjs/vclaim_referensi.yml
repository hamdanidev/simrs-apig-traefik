http:
  routers:

    v1_vclaim_referensi_diagnosa_POST:
      rule: "PathPrefix(`/v1.0/vclaim/referensi/diagnosa`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-bpjs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

