http:
  routers:

    v1_jkn_getbynoreservasi_POST:
      rule: "PathPrefix(`/v1.0/jkn/getbynoreservasi/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-bpjs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-bpjs:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_BPJS_URL" }}'
