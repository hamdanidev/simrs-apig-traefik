http:
  routers:

    v1_vclaim_monitoring_data-kunjungan_POST:
      rule: "PathPrefix(`/v1.0/vclaim/monitoring/data-kunjungan`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-bpjs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_vclaim_monitoring_data-histori-layananan-peserta_POST:
      rule: "PathPrefix(`/v1.0/vclaim/monitoring/data-histori-layananan-peserta`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-bpjs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-bpjs:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_BPJS_URL" }}'
