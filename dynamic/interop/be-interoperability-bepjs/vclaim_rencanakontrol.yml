http:
  routers:

    v1_vclaim_rencanakontrol_insert-rencana-kontrol_POST:
      rule: "PathPrefix(`/v1.0/vclaim/rencanakontrol/insert-rencana-kontrol`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-bpjs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_vclaim_rencanakontrol_update-rencana-kontrol_POST:
