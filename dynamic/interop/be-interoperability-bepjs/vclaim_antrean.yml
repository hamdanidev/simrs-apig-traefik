http:
  routers:

    v1_vclaim_antrean_pendaftaran_kode-booking_POST:
      rule: "PathPrefix(`/v1.0/vclaim/antrean/pendaftaran/kode-booking`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-bpjs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-bpjs:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_BPJS_URL" }}'
