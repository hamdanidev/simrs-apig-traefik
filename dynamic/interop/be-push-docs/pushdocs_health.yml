http:
  routers:

    v1_pushdocs_health_GET:
      rule: "PathPrefix(`/v1.0/pushdocs/health`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-be-push-docs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-be-push-docs:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_BE_PUSH_DOCS_URL" }}'
