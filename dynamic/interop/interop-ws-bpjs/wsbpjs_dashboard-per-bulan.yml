http:
  routers:

    v1_wsbpjs_dashboard-per-bulan_POST:
      rule: "PathPrefix(`/v1.0/wsbpjs/dashboard-per-bulan`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-ws-bpjs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-ws-bpjs:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_WS_BPJS_URL" }}'
