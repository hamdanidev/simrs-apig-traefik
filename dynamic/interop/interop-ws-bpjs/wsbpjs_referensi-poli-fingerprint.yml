http:
  routers:

    v1_wsbpjs_referensi-poli-fingerprint_POST:
      rule: "PathPrefix(`/v1.0/wsbpjs/referensi-poli-fingerprint`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-ws-bpjs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-ws-bpjs:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_WS_BPJS_URL" }}'
