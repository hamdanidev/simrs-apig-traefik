http:

  routers:
    v1_pacs_order_get-list-order_GET:
      rule: "PathPrefix(`/v1.0/pacs/order/get-list-order`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pacs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pacs_report_get-list-report_GET:
      rule: "PathPrefix(`/v1.0/pacs/report/get-list-report`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pacs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pacs_order_get-by-accession-num_GET:
      rule: "PathPrefix(`/v1.0/pacs/order/get-by-accession-num/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pacs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pacs_report_get-by-accession-num_GET:
      rule: "PathPrefix(`/v1.0/pacs/report/get-by-accession-num/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pacs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pacs_order_create-order_POST:
      rule: "PathPrefix(`/v1.0/pacs/order/create-order`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pacs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pacs_report_create-report_POST:
      rule: "PathPrefix(`/v1.0/pacs/report/create-report`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pacs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pacs_order_delete-order_DELETE:
      rule: "PathPrefix(`/v1.0/pacs/order/delete-order/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-pacs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pacs_report_delete-report_DELETE:
      rule: "PathPrefix(`/v1.0/pacs/report/delete-report/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-pacs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pacs_get-by-patient-id_GET:
      rule: "PathPrefix(`/v1.0/pacs/get-by-patient-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pacs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pacs_update-patient-id_PUT:
      rule: "PathPrefix(`/v1.0/pacs/update-patient-id/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-pacs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
  services:
    service-pacs:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_PACS_URL" }}'
