http:
  routers:

    v1_sirs-online_laporan-icd-10_get-list_GET:
      rule: "PathPrefix(`/v1.0/sirs-online/laporan-icd-10/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sirs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sirs-online_laporan-icd-10_rawat-inap_get-list_GET:
      rule: "PathPrefix(`/v1.0/sirs-online/laporan-icd-10/rawat-inap/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sirs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sirs-online_laporan-icd-10_rawat-jalan_get-list_GET:
      rule: "PathPrefix(`/v1.0/sirs-online/laporan-icd-10/rawat-jalan/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sirs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-sirs:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SIRS_URL" }}'
