http:
  routers:

    v1_sirs-online_erm_laporan-igd-sirs_rl33_GET:
      rule: "PathPrefix(`/v1.0/sirs-online/erm/laporan-igd-sirs/rl33`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sirs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sirs-online_erm_laporan-ranap-sirs_rl32_GET:
      rule: "PathPrefix(`/v1.0/sirs-online/erm/laporan-ranap-sirs/rl32`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sirs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sirs-online_erm_laporan-kebidanan_rl36_GET:
      rule: "PathPrefix(`/v1.0/sirs-online/erm/laporan-kebidanan/rl36`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sirs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sirs-online_erm_laporan-bayi_rl37_GET:
      rule: "PathPrefix(`/v1.0/sirs-online/erm/laporan-bayi/rl37`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sirs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sirs-online_erm_laporan-pelayanan-khusus_rl314_GET:
      rule: "PathPrefix(`/v1.0/sirs-online/erm/laporan-pelayanan-khusus/rl314`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sirs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sirs-online_erm_laporan-ranap-sirs_rl32_total_GET:
      rule: "PathPrefix(`/v1.0/sirs-online/erm/laporan-ranap-sirs/rl32/total`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sirs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-sirs:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SIRS_URL" }}'
