http:
  routers:

    v1_sirs-online_pendaftaran_kunjungan_GET:
      rule: "PathPrefix(`/v1.0/sirs-online/pendaftaran/kunjungan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sirs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sirs-online_pendaftaran_sep_laporan-rl310_GET:
      rule: "PathPrefix(`/v1.0/sirs-online/pendaftaran/sep/laporan-rl310`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sirs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-sirs:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SIRS_URL" }}'
