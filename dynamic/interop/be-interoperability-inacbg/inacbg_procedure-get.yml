http:
  routers:

    v2_inacbg_procedure-get_POST:
      rule: "PathPrefix(`/v2.0/inacbg/procedure-get`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-inacbgv2
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-inacbgv2:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_INACBGV2_URL" }}'
