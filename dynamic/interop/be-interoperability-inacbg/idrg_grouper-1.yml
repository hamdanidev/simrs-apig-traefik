http:
  routers:

    v2_idrg_grouper-1_POST:
      rule: "PathPrefix(`/v2.0/idrg/grouper-1`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-inacbgv2
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-inacbgv2:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_INACBGV2_URL" }}'
