http:
  routers:

    v1_rs-online_tempat-tidur_GET:
      rule: "PathPrefix(`/v1.0/rs-online/tempat-tidur`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-be-interop-rs-online
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rs-online_tempat-tidur_POST:
      rule: "PathPrefix(`/v1.0/rs-online/tempat-tidur`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-be-interop-rs-online
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rs-online_tempat-tidur_PUT:
      rule: "PathPrefix(`/v1.0/rs-online/tempat-tidur`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-be-interop-rs-online
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rs-online_tempat-tidur_DELETE:
      rule: "PathPrefix(`/v1.0/rs-online/tempat-tidur`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-be-interop-rs-online
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-be-interop-rs-online:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_BE_INTEROP_RS_ONLINE_URL" }}'
