http:
  routers:

    v1_message_send-image_POST:
      rule: "PathPrefix(`/v1.0/message/send-image`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-message
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-message:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MESSAGE_URL" }}'
