http:
  routers:

    v1_satu-sehat_patient_get-list_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/patient/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_patient_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/patient/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_patient_update_PUT:
      rule: "PathPrefix(`/v1.0/satu-sehat/patient/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_patient_get-list-by-nik-ibu_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/patient/get-list-by-nik-ibu`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_patient_get-by-id-by-nik-ibu_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/patient/get-by-id-by-nik-ibu/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_patient_update-by-nik-ibu_PUT:
      rule: "PathPrefix(`/v1.0/satu-sehat/patient/update-by-nik-ibu`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_patient_create_POST:
      rule: "PathPrefix(`/v1.0/satu-sehat/patient/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-satu-sehat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_URL" }}'
