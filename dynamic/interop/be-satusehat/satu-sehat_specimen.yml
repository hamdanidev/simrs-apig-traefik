http:
  routers:

    v1_satu-sehat_specimen_get-list_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/specimen/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_specimen_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/specimen/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_specimen_update_PUT:
      rule: "PathPrefix(`/v1.0/satu-sehat/specimen/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_specimen_create_POST:
      rule: "PathPrefix(`/v1.0/satu-sehat/specimen/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_specimen_delete_DELETE:
      rule: "PathPrefix(`/v1.0/satu-sehat/specimen/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-satu-sehat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_URL" }}'
