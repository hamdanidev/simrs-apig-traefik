http:
  routers:

    v1_satu-sehat_medication-ingredient_get-list_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/medication-ingredient/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_medication-ingredient_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/medication-ingredient/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_medication-ingredient_update_PUT:
      rule: "PathPrefix(`/v1.0/satu-sehat/medication-ingredient/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_medication-ingredient_create_POST:
      rule: "PathPrefix(`/v1.0/satu-sehat/medication-ingredient/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_medication-ingredient_delete_DELETE:
      rule: "PathPrefix(`/v1.0/satu-sehat/medication-ingredient/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-satu-sehat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_URL" }}'
