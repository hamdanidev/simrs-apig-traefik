http:
  routers:

    v1_satu-sehat_slot_get-list_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/slot/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_slot_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/slot/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_slot_update_PUT:
      rule: "PathPrefix(`/v1.0/satu-sehat/slot/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_slot_create_POST:
      rule: "PathPrefix(`/v1.0/satu-sehat/slot/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-satu-sehat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_URL" }}'
