http:
  routers:

    v1_satu-sehat_related-person_get-list_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/related-person/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_related-person_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/related-person/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_related-person_update_PUT:
      rule: "PathPrefix(`/v1.0/satu-sehat/related-person/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_related-person_create_POST:
      rule: "PathPrefix(`/v1.0/satu-sehat/related-person/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-satu-sehat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_URL" }}'
