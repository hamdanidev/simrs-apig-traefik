http:
  routers:

    v1_satu-sehat_appointment_getlist_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/appointment/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_appointment_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/appointment/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_appointment_update_PUT:
      rule: "PathPrefix(`/v1.0/satu-sehat/appointment/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_appointment_get-by-id-interop_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/appointment/get-by-id-interop/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_appointment_create_POST:
      rule: "PathPrefix(`/v1.0/satu-sehat/appointment/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-satu-sehat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_URL" }}'
