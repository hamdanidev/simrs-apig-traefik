http:
  routers:

    v1_satu-sehat_organization_getlist_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/organization/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_organization_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/organization/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_organization_update_PUT:
      rule: "PathPrefix(`/v1.0/satu-sehat/organization/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_organization_update-khusus_PUT:
      rule: "PathPrefix(`/v1.0/satu-sehat/organization/update-khusus`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_organization_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/satu-sehat/organization/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_satu-sehat_organization_create_POST:
      rule: "PathPrefix(`/v1.0/satu-sehat/organization/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-satu-sehat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_URL" }}'
