http:
  routers:

    v1_episode-of-care_create_POST:
      rule: "PathPrefix(`/v1.0/episode-of-care/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_episode-of-care_search-by-id_POST:
      rule: "PathPrefix(`/v1.0/episode-of-care/search-by-id`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_episode-of-care_update_POST:
      rule: "PathPrefix(`/v1.0/episode-of-care/update`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-satu-sehat-interop:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_INTEROP_URL" }}'
