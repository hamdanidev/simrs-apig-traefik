http:
  routers:

    v1_medication-dispense_create_POST:
      rule: "PathPrefix(`/v1.0/medication-dispense/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_medication-dispense_search-by-subject_POST:
      rule: "PathPrefix(`/v1.0/medication-dispense/search-by-subject`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_medication-dispense_search-by-subject-encounter_POST:
      rule: "PathPrefix(`/v1.0/medication-dispense/search-by-subject-encounter`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_medication-dispense_search-by-subject-prescription_POST:
      rule: "PathPrefix(`/v1.0/medication-dispense/search-by-subject-prescription`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_medication-dispense_search-by-id_POST:
      rule: "PathPrefix(`/v1.0/medication-dispense/search-by-id`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_medication-dispense_update_POST:
      rule: "PathPrefix(`/v1.0/medication-dispense/update`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-satu-sehat-interop:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_INTEROP_URL" }}'
