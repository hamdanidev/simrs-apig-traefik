http:
  routers:

    v1_service-request_create-lab-non-rujukan-eksternal_POST:
      rule: "PathPrefix(`/v1.0/service-request/create-lab-non-rujukan-eksternal`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_service-request_create-rujukan-kontrol-internal_POST:
      rule: "PathPrefix(`/v1.0/service-request/create-rujukan-kontrol-internal`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_service-request_create-rujukan-radiologi-eksternal_POST:
      rule: "PathPrefix(`/v1.0/service-request/create-rujukan-radiologi-eksternal`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_service-request_search-by-subject_POST:
      rule: "PathPrefix(`/v1.0/service-request/search-by-subject`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_service-request_search-by-subject-encounter_POST:
      rule: "PathPrefix(`/v1.0/service-request/search-by-subject-encounter`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_service-request_search-by-encounter_POST:
      rule: "PathPrefix(`/v1.0/service-request/search-by-encounter`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_service-request_search-by-id_POST:
      rule: "PathPrefix(`/v1.0/service-request/search-by-id`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_service-request_update_POST:
      rule: "PathPrefix(`/v1.0/service-request/update`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-satu-sehat-interop:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_INTEROP_URL" }}'
