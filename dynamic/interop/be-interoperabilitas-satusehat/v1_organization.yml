http:
  routers:

    v1_organization_create_POST:
      rule: "PathPrefix(`/v1.0/organization/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_organization_update_POST:
      rule: "PathPrefix(`/v1.0/organization/update`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_organization_search-by-id_POST:
      rule: "PathPrefix(`/v1.0/organization/search-by-id`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_organization_search-by-name_POST:
      rule: "PathPrefix(`/v1.0/organization/search-by-name`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_organization_search-by-partof_POST:
      rule: "PathPrefix(`/v1.0/organization/search-by-partof`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    # duplicat_v1_organization_search-by-partof_POST:
    #   rule: "PathPrefix(`/v1.0/organization/search-by-partof`) && (Method(`POST`) || Method(`OPTIONS`))"
    #   service: service-satu-sehat-interop
    #   entryPoints:
    #     - web
    #   middlewares:
    #     - "simrs-cors"
    #     - "simrs-auth"

  services:
    service-satu-sehat-interop:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_INTEROP_URL" }}'
