http:
  routers:

    v1_procedure_create_POST:
      rule: "PathPrefix(`/v1.0/procedure/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_procedure_search-by-subject_POST:
      rule: "PathPrefix(`/v1.0/procedure/search-by-subject`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_procedure_search-by-subject-encounter_POST:
      rule: "PathPrefix(`/v1.0/procedure/search-by-subject-encounter`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_procedure_search-by-encounter_POST:
      rule: "PathPrefix(`/v1.0/procedure/search-by-encounter`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_procedure_search-by-id_POST:
      rule: "PathPrefix(`/v1.0/procedure/search-by-id`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_procedure_update_POST:
      rule: "PathPrefix(`/v1.0/procedure/update`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-satu-sehat-interop:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_INTEROP_URL" }}'
