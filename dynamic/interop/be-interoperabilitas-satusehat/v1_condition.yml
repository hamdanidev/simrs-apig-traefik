http:
  routers:

    v1_condition_create-diagnosis_POST:
      rule: "PathPrefix(`/v1.0/condition/create-diagnosis`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_condition_create-meninggalkan-faskes_POST:
      rule: "PathPrefix(`/v1.0/condition/create-meninggalkan-faskes`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_condition_search-by-subject_POST:
      rule: "PathPrefix(`/v1.0/condition/search-by-subject`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_condition_search-by-subject-encounter_POST:
      rule: "PathPrefix(`/v1.0/condition/search-by-subject-encounter`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_condition_search-by-encounter_POST:
      rule: "PathPrefix(`/v1.0/condition/search-by-encounter`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_condition_search-by-id_POST:
      rule: "PathPrefix(`/v1.0/condition/search-by-id`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_condition_update_POST:
      rule: "PathPrefix(`/v1.0/condition/update`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-satu-sehat-interop:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_INTEROP_URL" }}'
