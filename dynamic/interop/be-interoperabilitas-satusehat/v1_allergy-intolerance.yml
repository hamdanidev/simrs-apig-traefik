http:
  routers:

    v1_allergy-intolerance_create_POST:
      rule: "PathPrefix(`/v1.0/allergy-intolerance/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_allergy-intolerance_search-by-subject_POST:
      rule: "PathPrefix(`/v1.0/allergy-intolerance/search-by-subject`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_allergy-intolerance_search-by-id_POST:
      rule: "PathPrefix(`/v1.0/allergy-intolerance/search-by-id`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_allergy-intolerance_update_POST:
      rule: "PathPrefix(`/v1.0/allergy-intolerance/update`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-satu-sehat-interop:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_INTEROP_URL" }}'
