http:
  routers:

    v1_care-plan_create_POST:
      rule: "PathPrefix(`/v1.0/care-plan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_care-plan_search-by-id_POST:
      rule: "PathPrefix(`/v1.0/care-plan/search-by-id`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_care-plan_update_POST:
      rule: "PathPrefix(`/v1.0/care-plan/update`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-satu-sehat-interop
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-satu-sehat-interop:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SATU_SEHAT_INTEROP_URL" }}'
