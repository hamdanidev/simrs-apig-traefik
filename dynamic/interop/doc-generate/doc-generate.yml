http:

  routers:
    doc_generate:
      rule: "PathPrefix(`/v1.0/doc/generate-pdf`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-doc-generate
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"


  services:
    service-doc-generate:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DOC_GENERATE_URL" }}'
