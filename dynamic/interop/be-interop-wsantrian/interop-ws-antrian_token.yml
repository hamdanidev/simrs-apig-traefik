http:
  routers:

    v1_interop-ws-antrian_token_GET:
      rule: "PathPrefix(`/v1.0/interop-ws-antrian/token`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-ws-antrian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_WS_ANTRIAN_URL" }}'
