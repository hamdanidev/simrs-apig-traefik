http:
  routers:

    v1_interop-wsantrian_history-tambah-antrian_get-list_GET:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/history-tambah-antrian/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_history-tambah-antrian_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/history-tambah-antrian/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_history-tambah-antrian_create_POST:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/history-tambah-antrian/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_history-tambah-antrian_send_POST:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/history-tambah-antrian/send/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_history-tambah-antrian_update_PUT:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/history-tambah-antrian/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_history-tambah-antrian_delete_DELETE:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/history-tambah-antrian/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-ws-antrian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_WS_ANTRIAN_URL" }}'
