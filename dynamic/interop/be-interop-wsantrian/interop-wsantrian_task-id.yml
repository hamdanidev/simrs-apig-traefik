http:
  routers:

    v1_interop-wsantrian_task-id_get-list_GET:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/task-id/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_task-id_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/task-id/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_task-id_create_POST:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/task-id/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_task-id_update_PUT:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/task-id/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_task-id_delete_DELETE:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/task-id/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_task-id_send_POST:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/task-id/send/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_task-id_update-by-booking-taskid_PUT:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/task-id/update-by-booking-taskid/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_task-id_capaian-mjkn-harian-parshing-waktu_GET:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/task-id/capaian-mjkn-harian-parshing-waktu`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_task-id_capaian-mjkn_GET:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/task-id/capaian-mjkn`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_task-id_capaian-mjkn-harian_GET:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/task-id/capaian-mjkn-harian`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_interop-wsantrian_task-id_update-parsing-waktu_POST:
      rule: "PathPrefix(`/v1.0/interop-wsantrian/task-id/update-parsing-waktu`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-ws-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-ws-antrian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_WS_ANTRIAN_URL" }}'
