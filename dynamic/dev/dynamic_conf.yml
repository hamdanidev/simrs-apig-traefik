http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Requested-With"
          - "X-Rs-Code"
          - "Req-Id"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        addVaryHeader: true
    simrs-auth:
      plugin:
        jwt:
          Secret: "5abdc4fe9a6229eb589fcb3d35f6fe3844e3ed8f33ef88b3328c23962534252c"
          AuthorizationHeader: "Authorization"
          HeaderPrefix: ""