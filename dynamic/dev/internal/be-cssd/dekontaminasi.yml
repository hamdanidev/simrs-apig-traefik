http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Requested-With"
          - "X-Rs-Code"
          - "Req-Id"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        addVaryHeader: true
  routers:
    internal_dekontaminasi_1:
      rule: "PathPrefix(`/v1.0/cssd/dekontaminasi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
    internal_dekontaminasi_2:
      rule: "PathPrefix(`/v1.0/cssd/dekontaminasi/get-by-id-dekontaminasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
    internal_dekontaminasi_3:
      rule: "PathPrefix(`/v1.0/cssd/dekontaminasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
    internal_dekontaminasi_4:
      rule: "PathPrefix(`/v1.0/cssd/dekontaminasi/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
  services:
    service-cssd:
      loadBalancer:
        servers:
          - url: "http://192.168.18.152:9107"
