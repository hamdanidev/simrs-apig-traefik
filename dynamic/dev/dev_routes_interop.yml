http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Requested-With"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        # Tambahkan baris di bawah ini untuk memastikan header Auth diizinkan
        addVaryHeader: true
  routers:
    antrean-rs-bpjs_1:
      rule: "PathPrefix(`/v1.0/vclaim/antrean/pendaftaran/kode-booking`) && (Method(`POST`) || Method(`OPTIONS`))"
