http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Requested-With"
          - "X-Rs-Code"
          - "Req-Id"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        # Tambahkan baris di bawah ini untuk memastikan header Auth diizinkan
        addVaryHeader: true
  routers:
    interop_wsbpjs_1:
      rule: "PathPrefix(`/v1.0/wsbpjs/referensi-jadwal-dokter`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-ws-bpjs
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    interop_wsbpjs_2:
