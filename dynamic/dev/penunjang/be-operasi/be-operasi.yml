http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Requested-With"
          - "X-Rs-Code"
          - "Req-Id"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        # Tambahkan baris di bawah ini untuk memastikan header Auth diizinkan
        addVaryHeader: true
  routers:
    operasi_1:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/get-list-order-operasi`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    operasi_2:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/get-list-tindakan-operasi`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    operasi_3:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/get-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    operasi_4:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/get-by-id-tindakan/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    operasi_5:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/get-by-noregistrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    operasi_6:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/send-to-kasir-by-nomor-order/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    operasi_7:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/update-order-operasi/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    operasi_8:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/update-tindakan-operasi/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    operasi_9:
      rule: "PathPrefix(`/v1.0/operasi/order-operasi/update-hasil/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-operasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
  services:
    service-operasi:
      loadBalancer:
        servers:
          - url: "http://192.168.18.154:8099"
