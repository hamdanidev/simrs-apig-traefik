http:
  middlewares:
    simrs-cors:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
          - "X-Requested-With"
          - "X-Rs-Code"
          - "Req-Id"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        # Tambahkan baris di bawah ini untuk memastikan header Auth diizinkan
        addVaryHeader: true
  routers:
    bed_1:
      rule: "PathPrefix(`/v1.0/kamar/bed/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aset
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    bed_2:
      rule: "PathPrefix(`/v1.0/kamar/bed/getlistbykdkamar/`) && (Method(`GET`) || Method(`OPTIONS`))"
