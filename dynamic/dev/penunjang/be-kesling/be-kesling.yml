http:
  routers:
    order_kesling_1:
      rule: "PathPrefix(`/v1.0/kesling/order-kesling/get-list-order-kesling`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kesling
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    order_kesling_2:
      rule: "PathPrefix(`/v1.0/kesling/order-kesling/get-list-order-kesling-multi-level`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kesling
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    order_kesling_3:
      rule: "PathPrefix(`/v1.0/kesling/order-kesling/get-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-kesling
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    order_kesling_4:
      rule: "PathPrefix(`/v1.0/kesling/order-kesling/create-order-kesling`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-kesling
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    order_kesling_5:
      rule: "PathPrefix(`/v1.0/kesling/order-kesling/update-order-kesling/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-kesling
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    order_kesling_6:
      rule: "PathPrefix(`/v1.0/kesling/order-kesling/delete-order-kesling/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-kesling
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-kesling:
      loadBalancer:
        servers:
          - url: "http://192.168.18.154:9109"
