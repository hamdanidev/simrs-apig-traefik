http:

  routers:
    v1_remun_proses-remunerasi-bpjs_POST:
      rule: "PathPrefix(`/v1.0/remun/proses-remunerasi-bpjs`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-remun-hitung
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
  services:
    service-remun-hitung:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REMUN_HITUNG_URL" }}'
