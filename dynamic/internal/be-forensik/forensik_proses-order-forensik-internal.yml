http:
  routers:

    v1_forensik_proses-order-forensik-internal_getlist_GET:
      rule: "PathPrefix(`/v1.0/forensik/proses-order-forensik-internal/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-forensik
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_forensik_proses-order-forensik-internal_getlist-order-forensik-by-no-registrasi_GET:
