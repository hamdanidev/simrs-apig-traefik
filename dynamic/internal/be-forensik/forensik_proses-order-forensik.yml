http:
  routers:

    v1_forensik_proses-order-forensik_getlist_GET:
      rule: "PathPrefix(`/v1.0/forensik/proses-order-forensik/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-forensik
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_forensik_proses-order-forensik_getlist-order-forensik-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/forensik/proses-order-forensik/getlist-order-forensik-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-forensik
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_forensik_proses-order-forensik_getlist-tindakan-order-forensik-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/forensik/proses-order-forensik/getlist-tindakan-order-forensik-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-forensik
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_forensik_proses-order-forensik_update-status-order-diterima_PUT:
      rule: "PathPrefix(`/v1.0/forensik/proses-order-forensik/update-status-order-diterima`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-forensik
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_forensik_proses-order-forensik_update-status-order-selesai_PUT:
      rule: "PathPrefix(`/v1.0/forensik/proses-order-forensik/update-status-order-selesai`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-forensik
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_forensik_proses-order-forensik_update-order-items-forensik_PUT:
      rule: "PathPrefix(`/v1.0/forensik/proses-order-forensik/update-order-items-forensik`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-forensik
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_forensik_proses-order-forensik_create-tindakan-order-forensik_POST:
      rule: "PathPrefix(`/v1.0/forensik/proses-order-forensik/create-tindakan-order-forensik`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-forensik
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_forensik_proses-order-forensik_delete-tindakan-order-forensik_DELETE:
      rule: "PathPrefix(`/v1.0/forensik/proses-order-forensik/delete-tindakan-order-forensik/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-forensik
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_forensik_proses-order-forensik_get-item-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/forensik/proses-order-forensik/get-item-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-forensik
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-forensik:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FORENSIK_URL" }}'
