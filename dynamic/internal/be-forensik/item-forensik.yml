http:

  routers:
    v1_forensik_item-forensik_getlist_GET:
      rule: "PathPrefix(`/v1.0/forensik/item-forensik/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-forensik
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-forensik:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FORENSIK_URL" }}'
