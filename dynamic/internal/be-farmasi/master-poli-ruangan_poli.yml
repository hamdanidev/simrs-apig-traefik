http:
  routers:

    v1_master-poli-ruangan_poli_getall_GET:
      rule: "PathPrefix(`/v1.0/master-poli-ruangan/poli/getall`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master-poli-ruangan_poli_getlist_GET:
      rule: "PathPrefix(`/v1.0/master-poli-ruangan/poli/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master-poli-ruangan_poli_getbykd_GET:
      rule: "PathPrefix(`/v1.0/master-poli-ruangan/poli/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master-poli-ruangan_poli_create_POST:
      rule: "PathPrefix(`/v1.0/master-poli-ruangan/poli/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master-poli-ruangan_poli_update_PUT:
      rule: "PathPrefix(`/v1.0/master-poli-ruangan/poli/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master-poli-ruangan_poli_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/master-poli-ruangan/poli/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-farmasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FARMASI_URL" }}'
          # - url: '{{ env "SERVICE_FARMASI_URL_2" }}'
