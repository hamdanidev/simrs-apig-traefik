http:
  routers:

    v1_farmasi_data-awal_get-list-data-awal-barang-farmasi_GET:
      rule: "PathPrefix(`/v1.0/farmasi/data-awal/get-list-data-awal-barang-farmasi`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_data-awal_get-list-data-awal-unit-farmasi_GET:
      rule: "PathPrefix(`/v1.0/farmasi/data-awal/get-list-data-awal-unit-farmasi`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
