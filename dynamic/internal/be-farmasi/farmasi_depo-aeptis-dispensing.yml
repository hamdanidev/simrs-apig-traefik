http:
  routers:

    v1_farmasi_depo-aeptis-dispensing_get-list_GET:
      rule: "PathPrefix(`/v1.0/farmasi/depo-aeptis-dispensing/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_depo-aeptis-dispensing_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/farmasi/depo-aeptis-dispensing/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_depo-aeptis-dispensing_create_POST:
      rule: "PathPrefix(`/v1.0/farmasi/depo-aeptis-dispensing/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_depo-aeptis-dispensing_update_PUT:
      rule: "PathPrefix(`/v1.0/farmasi/depo-aeptis-dispensing/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_depo-aeptis-dispensing_delete_DELETE:
      rule: "PathPrefix(`/v1.0/farmasi/depo-aeptis-dispensing/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-farmasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FARMASI_URL" }}'
          # - url: '{{ env "SERVICE_FARMASI_URL_2" }}'
