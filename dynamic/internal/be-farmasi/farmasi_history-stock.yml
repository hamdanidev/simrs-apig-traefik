http:
  routers:

    v1_farmasi_history-stock_getlist_GET:
      rule: "PathPrefix(`/v1.0/farmasi/history-stock/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_history-stock_getbyid_GET:
      rule: "PathPrefix(`/v1.0/farmasi/history-stock/getbyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_history-stock_create_POST:
      rule: "PathPrefix(`/v1.0/farmasi/history-stock/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_history-stock_update_PUT:
      rule: "PathPrefix(`/v1.0/farmasi/history-stock/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_history-stock_delete_DELETE:
      rule: "PathPrefix(`/v1.0/farmasi/history-stock/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_history-stock_getlist-laporan_GET:
      rule: "PathPrefix(`/v1.0/farmasi/history-stock/getlist-laporan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_history-stock_getlist-laporan-depan_GET:
      rule: "PathPrefix(`/v1.0/farmasi/history-stock/getlist-laporan-depan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-farmasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FARMASI_URL" }}'
          # - url: '{{ env "SERVICE_FARMASI_URL_2" }}'
