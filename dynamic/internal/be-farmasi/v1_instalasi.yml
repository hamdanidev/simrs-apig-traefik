http:
  routers:

    v1_instalasi_farmasi_laporan-pengadaan-obat_GET:
      rule: "PathPrefix(`/v1.0/instalasi/farmasi/laporan-pengadaan-obat`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_instalasi_farmasi_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/instalasi/farmasi/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_instalasi_farmasi_update-no-rm_PUT:
      rule: "PathPrefix(`/v1.0/instalasi/farmasi/update-no-rm/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_instalasi_farmasi_update-status_PUT:
      rule: "PathPrefix(`/v1.0/instalasi/farmasi/update-status/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_instalasi_farmasi_update-status-konsinyasi_PUT:
      rule: "PathPrefix(`/v1.0/instalasi/farmasi/update-status-konsinyasi/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_instalasi_farmasi_get-antivenom_lampung-in_GET:
      rule: "PathPrefix(`/v1.0/instalasi/farmasi/get-antivenom/lampung-in`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-farmasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FARMASI_URL" }}'
          # - url: '{{ env "SERVICE_FARMASI_URL_2" }}'
