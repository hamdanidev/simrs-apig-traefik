http:
  routers:

    v1_unit-farmasi_get-list-with-pelayanan_GET:
      rule: "PathPrefix(`/v1.0/unit-farmasi/get-list-with-pelayanan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-farmasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FARMASI_URL" }}'
          # - url: '{{ env "SERVICE_FARMASI_URL_2" }}'
