http:
  routers:

    v1_farmasi_order-amhp_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/farmasi/order-amhp/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

