http:
  routers:

    v1_farmasi_depo-hemodialisa_get-list_GET:
      rule: "PathPrefix(`/v1.0/farmasi/depo-hemodialisa/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_depo-hemodialisa_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/farmasi/depo-hemodialisa/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_depo-hemodialisa_create_POST:
      rule: "PathPrefix(`/v1.0/farmasi/depo-hemodialisa/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_depo-hemodialisa_update_PUT:
      rule: "PathPrefix(`/v1.0/farmasi/depo-hemodialisa/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_depo-hemodialisa_delete_DELETE:
      rule: "PathPrefix(`/v1.0/farmasi/depo-hemodialisa/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-farmasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FARMASI_URL" }}'
          # - url: '{{ env "SERVICE_FARMASI_URL_2" }}'
