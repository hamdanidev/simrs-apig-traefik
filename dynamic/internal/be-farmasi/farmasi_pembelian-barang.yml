http:
  routers:

    v1_farmasi_pembelian-barang_get-list-pembelian-barang-farmasi_GET:
      rule: "PathPrefix(`/v1.0/farmasi/pembelian-barang/get-list-pembelian-barang-farmasi`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pembelian-barang_get-list-pembelian-barang_GET:
      rule: "PathPrefix(`/v1.0/farmasi/pembelian-barang/get-list-pembelian-barang`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pembelian-barang_get-list-pembelian-barang-with-farmasi_GET:
      rule: "PathPrefix(`/v1.0/farmasi/pembelian-barang/get-list-pembelian-barang-with-farmasi`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pembelian-barang_create-pembelian-barang-farmasi_POST:
      rule: "PathPrefix(`/v1.0/farmasi/pembelian-barang/create-pembelian-barang-farmasi`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pembelian-barang_create-pembelian-barang_POST:
      rule: "PathPrefix(`/v1.0/farmasi/pembelian-barang/create-pembelian-barang`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pembelian-barang_update-pembelian-barang-farmasi_PUT:
      rule: "PathPrefix(`/v1.0/farmasi/pembelian-barang/update-pembelian-barang-farmasi/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pembelian-barang_update-pembelian-barang_PUT:
      rule: "PathPrefix(`/v1.0/farmasi/pembelian-barang/update-pembelian-barang/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pembelian-barang_delete-pembelian-barang-farmasi_DELETE:
      rule: "PathPrefix(`/v1.0/farmasi/pembelian-barang/delete-pembelian-barang-farmasi/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pembelian-barang_delete-pembelian-barang_DELETE:
      rule: "PathPrefix(`/v1.0/farmasi/pembelian-barang/delete-pembelian-barang/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pembelian-barang_update-pembelian-barang-farmasi-mix_PUT:
      rule: "PathPrefix(`/v1.0/farmasi/pembelian-barang/update-pembelian-barang-farmasi-mix/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-farmasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FARMASI_URL" }}'
          # - url: '{{ env "SERVICE_FARMASI_URL_2" }}'
