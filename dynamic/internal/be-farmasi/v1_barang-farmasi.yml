http:
  routers:

    v1_barang-farmasi_getlist_GET:
      rule: "PathPrefix(`/v1.0/barang-farmasi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_barang-farmasi_getbykd_GET:
      rule: "PathPrefix(`/v1.0/barang-farmasi/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_barang-farmasi_create_POST:
      rule: "PathPrefix(`/v1.0/barang-farmasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_barang-farmasi_update_PUT:
      rule: "PathPrefix(`/v1.0/barang-farmasi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_barang-farmasi_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/barang-farmasi/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_barang-farmasi_getlist-gol-obat_GET:
      rule: "PathPrefix(`/v1.0/barang-farmasi/getlist-gol-obat`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_barang-farmasi_update-hpp_PUT:
      rule: "PathPrefix(`/v1.0/barang-farmasi/update-hpp/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_barang-farmasi_getlist-hpp-selanjutnya_GET:
      rule: "PathPrefix(`/v1.0/barang-farmasi/getlist-hpp-selanjutnya`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-farmasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FARMASI_URL" }}'
          # - url: '{{ env "SERVICE_FARMASI_URL_2" }}'
