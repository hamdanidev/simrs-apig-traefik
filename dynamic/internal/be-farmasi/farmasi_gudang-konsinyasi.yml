http:
  routers:

    stok-gudang.konsinyasi_1:
      rule: "PathPrefix(`/v1.0/farmasi/gudang-konsinyasi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    stok-gudang.konsinyasi_2:
      rule: "PathPrefix(`/v1.0/farmasi/gudang-konsinyasi/get-list-ready-stock`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    stok-gudang.konsinyasi_3:
      rule: "PathPrefix(`/v1.0/farmasi/gudang-konsinyasi/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    stok-gudang.konsinyasi_4:
      rule: "PathPrefix(`/v1.0/farmasi/gudang-konsinyasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    stok-gudang.konsinyasi_5:
      rule: "PathPrefix(`/v1.0/farmasi/gudang-konsinyasi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    stok-gudang.konsinyasi_6:
      rule: "PathPrefix(`/v1.0/farmasi/gudang-konsinyasi/update-stock/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    stok-gudang.konsinyasi_7:
      rule: "PathPrefix(`/v1.0/farmasi/gudang-konsinyasi/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    stok-gudang.konsinyasi_8:
      rule: "PathPrefix(`/v1.0/farmasi/gudang-konsinyasi/update-with-induk/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-farmasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FARMASI_URL" }}'
          # - url: '{{ env "SERVICE_FARMASI_URL_2" }}'
