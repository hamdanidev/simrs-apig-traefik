http:
  routers:

    v1_farmasi_pengeluaran-barang_get-list-pengeluaran-barang-farmasi_GET:
      rule: "PathPrefix(`/v1.0/farmasi/pengeluaran-barang/get-list-pengeluaran-barang-farmasi`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pengeluaran-barang_get-list-pengeluaran-barang_GET:
      rule: "PathPrefix(`/v1.0/farmasi/pengeluaran-barang/get-list-pengeluaran-barang`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pengeluaran-barang_create-pengeluaran-barang-farmasi_POST:
      rule: "PathPrefix(`/v1.0/farmasi/pengeluaran-barang/create-pengeluaran-barang-farmasi`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pengeluaran-barang_create-pengeluaran-barang_POST:
      rule: "PathPrefix(`/v1.0/farmasi/pengeluaran-barang/create-pengeluaran-barang`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pengeluaran-barang_update-pengeluaran-barang-farmasi_PUT:
      rule: "PathPrefix(`/v1.0/farmasi/pengeluaran-barang/update-pengeluaran-barang-farmasi/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pengeluaran-barang_update-pengeluaran-barang_PUT:
      rule: "PathPrefix(`/v1.0/farmasi/pengeluaran-barang/update-pengeluaran-barang/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pengeluaran-barang_delete-pengeluaran-barang-farmasi_DELETE:
      rule: "PathPrefix(`/v1.0/farmasi/pengeluaran-barang/delete-pengeluaran-barang-farmasi/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_pengeluaran-barang_delete-pengeluaran-barang_DELETE:
      rule: "PathPrefix(`/v1.0/farmasi/pengeluaran-barang/delete-pengeluaran-barang/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-farmasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FARMASI_URL" }}'
          # - url: '{{ env "SERVICE_FARMASI_URL_2" }}'
