http:
  routers:

    v1_farmasi_penerimaan-konsinyasi_get-list-penerimaan-konsinyasi_GET:
      rule: "PathPrefix(`/v1.0/farmasi/penerimaan-konsinyasi/get-list-penerimaan-konsinyasi`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_penerimaan-konsinyasi_get-list-penerimaan-barang-konsinyasi_GET:
      rule: "PathPrefix(`/v1.0/farmasi/penerimaan-konsinyasi/get-list-penerimaan-barang-konsinyasi`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_penerimaan-konsinyasi_create-penerimaan-konsinyasi_POST:
      rule: "PathPrefix(`/v1.0/farmasi/penerimaan-konsinyasi/create-penerimaan-konsinyasi`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_penerimaan-konsinyasi_create-penerimaan-barang-konsinyasi_POST:
      rule: "PathPrefix(`/v1.0/farmasi/penerimaan-konsinyasi/create-penerimaan-barang-konsinyasi`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_penerimaan-konsinyasi_update-penerimaan-konsinyasi_PUT:
      rule: "PathPrefix(`/v1.0/farmasi/penerimaan-konsinyasi/update-penerimaan-konsinyasi/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_penerimaan-konsinyasi_update-penerimaan-barang-konsinyasi_PUT:
      rule: "PathPrefix(`/v1.0/farmasi/penerimaan-konsinyasi/update-penerimaan-barang-konsinyasi/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_penerimaan-konsinyasi_delete-penerimaan-konsinyasi_DELETE:
      rule: "PathPrefix(`/v1.0/farmasi/penerimaan-konsinyasi/delete-penerimaan-konsinyasi/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_penerimaan-konsinyasi_delete-penerimaan-barang-konsinyasi_DELETE:
      rule: "PathPrefix(`/v1.0/farmasi/penerimaan-konsinyasi/delete-penerimaan-barang-konsinyasi/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-farmasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FARMASI_URL" }}'
          # - url: '{{ env "SERVICE_FARMASI_URL_2" }}'
