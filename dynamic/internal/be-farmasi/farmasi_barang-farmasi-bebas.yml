http:
  routers:

    v1_farmasi_barang-farmasi-bebas_get-list_GET:
      rule: "PathPrefix(`/v1.0/farmasi/barang-farmasi-bebas/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_barang-farmasi-bebas_create_POST:
      rule: "PathPrefix(`/v1.0/farmasi/barang-farmasi-bebas/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_barang-farmasi-bebas_update_PUT:
      rule: "PathPrefix(`/v1.0/farmasi/barang-farmasi-bebas/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_farmasi_barang-farmasi-bebas_delete_DELETE:
      rule: "PathPrefix(`/v1.0/farmasi/barang-farmasi-bebas/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-farmasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FARMASI_URL" }}'
          # - url: '{{ env "SERVICE_FARMASI_URL_2" }}'
