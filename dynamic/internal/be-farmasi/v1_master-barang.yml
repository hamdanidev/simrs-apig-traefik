http:
  routers:

    v1_master-barang_getall_GET:
      rule: "PathPrefix(`/v1.0/master-barang/getall`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master-barang_getlist_GET:
      rule: "PathPrefix(`/v1.0/master-barang/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master-barang_getbykd_GET:
      rule: "PathPrefix(`/v1.0/master-barang/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master-barang_create_POST:
      rule: "PathPrefix(`/v1.0/master-barang/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master-barang_update_PUT:
      rule: "PathPrefix(`/v1.0/master-barang/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master-barang_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/master-barang/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-farmasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-farmasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_FARMASI_URL" }}'
          # - url: '{{ env "SERVICE_FARMASI_URL_2" }}'
