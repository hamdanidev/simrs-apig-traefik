http:
  routers:

    v1_bagian_mini-cex_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/mini-cex/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_mini-cex_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/mini-cex/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_mini-cex_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/mini-cex/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_mini-cex_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/mini-cex/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_mini-cex_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/mini-cex/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
