http:
  routers:

    v1_komite-etik_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/komite-etik/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_komite-etik_getlist_GET:
      rule: "PathPrefix(`/v1.0/komite-etik/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_komite-etik_create_POST:
      rule: "PathPrefix(`/v1.0/komite-etik/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_komite-etik_update_PUT:
      rule: "PathPrefix(`/v1.0/komite-etik/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_komite-etik_delete_DELETE:
      rule: "PathPrefix(`/v1.0/komite-etik/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
