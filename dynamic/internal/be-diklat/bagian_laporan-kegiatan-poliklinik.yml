http:
  routers:

    v1_bagian_laporan-kegiatan-poliklinik_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/laporan-kegiatan-poliklinik/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_laporan-kegiatan-poliklinik_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/laporan-kegiatan-poliklinik/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_laporan-kegiatan-poliklinik_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/laporan-kegiatan-poliklinik/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_laporan-kegiatan-poliklinik_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/laporan-kegiatan-poliklinik/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_laporan-kegiatan-poliklinik_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/laporan-kegiatan-poliklinik/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
