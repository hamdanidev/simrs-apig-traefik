http:
  routers:

    v1_bagian_post-test_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/post-test/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_post-test_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/post-test/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_post-test_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/post-test/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_post-test_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/post-test/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_post-test_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/post-test/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
