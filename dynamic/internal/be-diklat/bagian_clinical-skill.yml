http:
  routers:

    v1_bagian_clinical-skill_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/clinical-skill/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_clinical-skill_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/clinical-skill/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_clinical-skill_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/clinical-skill/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_clinical-skill_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/clinical-skill/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_clinical-skill_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/clinical-skill/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
