http:
  routers:

    v1_ppds_ppds_getlist_GET:
      rule: "PathPrefix(`/v1.0/ppds/ppds/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_ppds_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/ppds/ppds/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_ppds_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/ppds/ppds/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_ppds_create_POST:
      rule: "PathPrefix(`/v1.0/ppds/ppds/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_ppds_update_PUT:
      rule: "PathPrefix(`/v1.0/ppds/ppds/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_ppds_delete_DELETE:
      rule: "PathPrefix(`/v1.0/ppds/ppds/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_ppds_update-kirim-kasir_PUT:
      rule: "PathPrefix(`/v1.0/ppds/ppds/update-kirim-kasir`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
