http:
  routers:

    v1_pkl_pkl_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pkl/pkl/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_pkl_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pkl/pkl/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_pkl_create_POST:
      rule: "PathPrefix(`/v1.0/pkl/pkl/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_pkl_update_PUT:
      rule: "PathPrefix(`/v1.0/pkl/pkl/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_pkl_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pkl/pkl/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_pkl_update-kirim-kasir_PUT:
      rule: "PathPrefix(`/v1.0/pkl/pkl/update-kirim-kasir`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_pkl_update-status-bayar_PUT:
      rule: "PathPrefix(`/v1.0/pkl/pkl/update-status-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_pkl_update-bukti-bayar_PUT:
      rule: "PathPrefix(`/v1.0/pkl/pkl/update-bukti-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
