http:
  routers:

    v1_peserta-diklat_create_POST:
      rule: "PathPrefix(`/v1.0/peserta-diklat/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_peserta-diklat_update_PUT:
      rule: "PathPrefix(`/v1.0/peserta-diklat/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    # duplicat_v1_peserta-diklat_update_PUT:
    #   rule: "PathPrefix(`/v1.0/peserta-diklat/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
    #   service: service-diklat
    #   entryPoints:
    #     - web
    #   middlewares:
    #     - "simrs-cors"

    v1_peserta-diklat_delete_DELETE:
      rule: "PathPrefix(`/v1.0/peserta-diklat/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
