http:
  routers:

    v1_master_pembelajaran-ujian_getlist_GET:
      rule: "PathPrefix(`/v1.0/master/pembelajaran-ujian/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_pembelajaran-ujian_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/master/pembelajaran-ujian/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_pembelajaran-ujian_create_POST:
      rule: "PathPrefix(`/v1.0/master/pembelajaran-ujian/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_pembelajaran-ujian_update_PUT:
      rule: "PathPrefix(`/v1.0/master/pembelajaran-ujian/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_pembelajaran-ujian_delete_DELETE:
      rule: "PathPrefix(`/v1.0/master/pembelajaran-ujian/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
