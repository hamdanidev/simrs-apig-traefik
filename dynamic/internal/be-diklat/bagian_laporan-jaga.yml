http:
  routers:

    v1_bagian_laporan-jaga_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/laporan-jaga/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_laporan-jaga_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/laporan-jaga/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_laporan-jaga_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/laporan-jaga/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_laporan-jaga_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/laporan-jaga/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_laporan-jaga_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/laporan-jaga/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
