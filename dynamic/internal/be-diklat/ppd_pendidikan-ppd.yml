http:
  routers:

    v1_ppd_pendidikan-ppd_getlist_GET:
      rule: "PathPrefix(`/v1.0/ppd/pendidikan-ppd/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_pendidikan-ppd_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/ppd/pendidikan-ppd/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_pendidikan-ppd_create_POST:
      rule: "PathPrefix(`/v1.0/ppd/pendidikan-ppd/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_pendidikan-ppd_update_PUT:
      rule: "PathPrefix(`/v1.0/ppd/pendidikan-ppd/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_pendidikan-ppd_delete_DELETE:
      rule: "PathPrefix(`/v1.0/ppd/pendidikan-ppd/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
