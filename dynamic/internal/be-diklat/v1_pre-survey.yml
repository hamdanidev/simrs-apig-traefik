http:
  routers:

    v1_pre-survey_getlist_GET:
      rule: "PathPrefix(`/v1.0/pre-survey/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pre-survey_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pre-survey/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pre-survey_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pre-survey/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pre-survey_get-by-nomor-surat_GET:
      rule: "PathPrefix(`/v1.0/pre-survey/get-by-nomor-surat/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pre-survey_create_POST:
      rule: "PathPrefix(`/v1.0/pre-survey/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pre-survey_update_PUT:
      rule: "PathPrefix(`/v1.0/pre-survey/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pre-survey_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pre-survey/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pre-survey_update-kirim-kasir_PUT:
      rule: "PathPrefix(`/v1.0/pre-survey/update-kirim-kasir`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pre-survey_update-status-bayar_PUT:
      rule: "PathPrefix(`/v1.0/pre-survey/update-status-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pre-survey_cek-backdate_GET:
      rule: "PathPrefix(`/v1.0/pre-survey/cek-backdate/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pre-survey_update-bukti-bayar_PUT:
      rule: "PathPrefix(`/v1.0/pre-survey/update-bukti-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
