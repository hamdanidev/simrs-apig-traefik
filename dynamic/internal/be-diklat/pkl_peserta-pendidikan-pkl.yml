http:
  routers:

    v1_pkl_peserta-pendidikan-pkl_get-by-no-ktp_GET:
      rule: "PathPrefix(`/v1.0/pkl/peserta-pendidikan-pkl/get-by-no-ktp/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_peserta-pendidikan-pkl_get-by-nim_GET:
      rule: "PathPrefix(`/v1.0/pkl/peserta-pendidikan-pkl/get-by-nim/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_peserta-pendidikan-pkl_get-by-nama-tanggal-lahir_GET:
      rule: "PathPrefix(`/v1.0/pkl/peserta-pendidikan-pkl/get-by-nama-tanggal-lahir/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_peserta-pendidikan-pkl_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pkl/peserta-pendidikan-pkl/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_peserta-pendidikan-pkl_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pkl/peserta-pendidikan-pkl/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_peserta-pendidikan-pkl_create_POST:
      rule: "PathPrefix(`/v1.0/pkl/peserta-pendidikan-pkl/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_peserta-pendidikan-pkl_update_PUT:
      rule: "PathPrefix(`/v1.0/pkl/peserta-pendidikan-pkl/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_peserta-pendidikan-pkl_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pkl/peserta-pendidikan-pkl/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pkl_peserta-pendidikan-pkl_update-master_PUT:
      rule: "PathPrefix(`/v1.0/pkl/peserta-pendidikan-pkl/update-master`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
