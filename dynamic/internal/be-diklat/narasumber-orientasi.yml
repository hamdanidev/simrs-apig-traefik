http:
  routers:

    v1_narasumber-orientasi_create_POST:
      rule: "PathPrefix(`/v1.0/narasumber-orientasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_narasumber-orientasi_update_PUT:
      rule: "PathPrefix(`/v1.0/narasumber-orientasi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_narasumber-orientasi_delete_DELETE:
      rule: "PathPrefix(`/v1.0/narasumber-orientasi/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
