    v1_ppds_peserta-pendidikan-ppds_delete_DELETE:
      rule: "PathPrefix(`/v1.0/ppds/peserta-pendidikan-ppds/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_peserta-pendidikan-ppds_update-master_PUT:
      rule: "PathPrefix(`/v1.0/ppds/peserta-pendidikan-ppds/update-master`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_peserta-pendidikan-ppds_get-by-id-referensi_GET:
      rule: "PathPrefix(`/v1.0/ppds/peserta-pendidikan-ppds/get-by-id-referensi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
