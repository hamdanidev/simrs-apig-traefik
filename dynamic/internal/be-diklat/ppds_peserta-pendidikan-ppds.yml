    v1_ppds_peserta-pendidikan-ppds_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/ppds/peserta-pendidikan-ppds/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_peserta-pendidikan-ppds_create_POST:
      rule: "PathPrefix(`/v1.0/ppds/peserta-pendidikan-ppds/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_peserta-pendidikan-ppds_update_PUT:
      rule: "PathPrefix(`/v1.0/ppds/peserta-pendidikan-ppds/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
