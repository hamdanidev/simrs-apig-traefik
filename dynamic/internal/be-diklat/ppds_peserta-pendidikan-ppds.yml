http:
  routers:

    v1_ppds_peserta-pendidikan-ppds_get-by-no-ktp_GET:
      rule: "PathPrefix(`/v1.0/ppds/peserta-pendidikan-ppds/get-by-no-ktp/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_peserta-pendidikan-ppds_get-by-nim_GET:
      rule: "PathPrefix(`/v1.0/ppds/peserta-pendidikan-ppds/get-by-nim/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_peserta-pendidikan-ppds_get-by-nama-tanggal-lahir_GET:
      rule: "PathPrefix(`/v1.0/ppds/peserta-pendidikan-ppds/get-by-nama-tanggal-lahir/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_peserta-pendidikan-ppds_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/ppds/peserta-pendidikan-ppds/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
