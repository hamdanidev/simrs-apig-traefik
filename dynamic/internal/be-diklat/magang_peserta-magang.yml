http:
  routers:

    v1_magang_peserta-magang_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/magang/peserta-magang/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_peserta-magang_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/magang/peserta-magang/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_peserta-magang_create_POST:
      rule: "PathPrefix(`/v1.0/magang/peserta-magang/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_peserta-magang_update_PUT:
      rule: "PathPrefix(`/v1.0/magang/peserta-magang/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_peserta-magang_delete_DELETE:
      rule: "PathPrefix(`/v1.0/magang/peserta-magang/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
