http:
  routers:

    v1_magang_petugas-magang_getlist_GET:
      rule: "PathPrefix(`/v1.0/magang/petugas-magang/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_petugas-magang_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/magang/petugas-magang/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_petugas-magang_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/magang/petugas-magang/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_petugas-magang_get-by-id-kegiatan-magang_GET:
      rule: "PathPrefix(`/v1.0/magang/petugas-magang/get-by-id-kegiatan-magang/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_petugas-magang_create_POST:
      rule: "PathPrefix(`/v1.0/magang/petugas-magang/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_petugas-magang_update_PUT:
      rule: "PathPrefix(`/v1.0/magang/petugas-magang/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_petugas-magang_delete_DELETE:
      rule: "PathPrefix(`/v1.0/magang/petugas-magang/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
