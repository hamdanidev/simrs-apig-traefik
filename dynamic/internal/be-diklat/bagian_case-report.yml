http:
  routers:

    v1_bagian_case-report_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/case-report/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_case-report_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/case-report/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_case-report_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/case-report/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_case-report_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/case-report/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_case-report_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/case-report/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
