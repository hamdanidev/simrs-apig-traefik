http:
  routers:

    v1_ppd_bagian-ppd_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/ppd/bagian-ppd/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_bagian-ppd_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/ppd/bagian-ppd/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_bagian-ppd_create_POST:
      rule: "PathPrefix(`/v1.0/ppd/bagian-ppd/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_bagian-ppd_update_PUT:
      rule: "PathPrefix(`/v1.0/ppd/bagian-ppd/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_bagian-ppd_update-kirim-kasir_PUT:
      rule: "PathPrefix(`/v1.0/ppd/bagian-ppd/update-kirim-kasir`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_bagian-ppd_update-status-bayar_PUT:
      rule: "PathPrefix(`/v1.0/ppd/bagian-ppd/update-status-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_bagian-ppd_delete_DELETE:
      rule: "PathPrefix(`/v1.0/ppd/bagian-ppd/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_bagian-ppd_getlist-bagian-ppd_GET:
      rule: "PathPrefix(`/v1.0/ppd/bagian-ppd/getlist-bagian-ppd`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_bagian-ppd_detail-input-ujian_GET:
      rule: "PathPrefix(`/v1.0/ppd/bagian-ppd/detail-input-ujian/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_bagian-ppd_update-bukti-bayar_PUT:
      rule: "PathPrefix(`/v1.0/ppd/bagian-ppd/update-bukti-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    # duplicat_v1_ppd_bagian-ppd_update-bukti-bayar_PUT:
    #   rule: "PathPrefix(`/v1.0/ppd/bagian-ppd/update-bukti-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
    #   service: service-diklat
    #   entryPoints:
