    v1_ppd_bagian-ppd_update-status-claim_PUT:
      rule: "PathPrefix(`/v1.0/ppd/bagian-ppd/update-status-claim`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
