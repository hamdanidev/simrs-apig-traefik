http:
  routers:

    v1_diklat_pre-terap_getlist_GET:
      rule: "PathPrefix(`/v1.0/diklat/pre-terap/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_pre-terap_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/diklat/pre-terap/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_pre-terap_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/diklat/pre-terap/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_pre-terap_get-by-nomor-surat_GET:
      rule: "PathPrefix(`/v1.0/diklat/pre-terap/get-by-nomor-surat/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_pre-terap_create_POST:
      rule: "PathPrefix(`/v1.0/diklat/pre-terap/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_pre-terap_update_PUT:
      rule: "PathPrefix(`/v1.0/diklat/pre-terap/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_pre-terap_delete_DELETE:
      rule: "PathPrefix(`/v1.0/diklat/pre-terap/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_pre-terap_update-kirim-kasir_PUT:
      rule: "PathPrefix(`/v1.0/diklat/pre-terap/update-kirim-kasir`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_pre-terap_update-status-bayar_PUT:
      rule: "PathPrefix(`/v1.0/diklat/pre-terap/update-status-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_pre-terap_cek-backdate_GET:
      rule: "PathPrefix(`/v1.0/diklat/pre-terap/cek-backdate/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_pre-terap_update-bukti-bayar_PUT:
      rule: "PathPrefix(`/v1.0/diklat/pre-terap/update-bukti-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
