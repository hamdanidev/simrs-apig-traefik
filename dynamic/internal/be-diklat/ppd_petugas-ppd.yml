http:
  routers:

    v1_ppd_petugas-ppd_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/ppd/petugas-ppd/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_petugas-ppd_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/ppd/petugas-ppd/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_petugas-ppd_get-by-id-bagian-ppd_GET:
      rule: "PathPrefix(`/v1.0/ppd/petugas-ppd/get-by-id-bagian-ppd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_petugas-ppd_create_POST:
      rule: "PathPrefix(`/v1.0/ppd/petugas-ppd/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_petugas-ppd_update_PUT:
      rule: "PathPrefix(`/v1.0/ppd/petugas-ppd/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_petugas-ppd_delete_DELETE:
      rule: "PathPrefix(`/v1.0/ppd/petugas-ppd/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
