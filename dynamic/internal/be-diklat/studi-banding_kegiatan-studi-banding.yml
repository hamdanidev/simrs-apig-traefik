http:
  routers:

    v1_studi-banding_kegiatan-studi-banding_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/studi-banding/kegiatan-studi-banding/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_studi-banding_kegiatan-studi-banding_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/studi-banding/kegiatan-studi-banding/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_studi-banding_kegiatan-studi-banding_create_POST:
      rule: "PathPrefix(`/v1.0/studi-banding/kegiatan-studi-banding/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_studi-banding_kegiatan-studi-banding_update_PUT:
      rule: "PathPrefix(`/v1.0/studi-banding/kegiatan-studi-banding/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_studi-banding_kegiatan-studi-banding_delete_DELETE:
      rule: "PathPrefix(`/v1.0/studi-banding/kegiatan-studi-banding/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_studi-banding_kegiatan-studi-banding_update-kirim-kasir_PUT:
      rule: "PathPrefix(`/v1.0/studi-banding/kegiatan-studi-banding/update-kirim-kasir`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_studi-banding_kegiatan-studi-banding_update-status-bayar_PUT:
      rule: "PathPrefix(`/v1.0/studi-banding/kegiatan-studi-banding/update-status-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_studi-banding_kegiatan-studi-banding_update-bukti-bayar_PUT:
      rule: "PathPrefix(`/v1.0/studi-banding/kegiatan-studi-banding/update-bukti-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_studi-banding_kegiatan-studi-banding_getlist-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/studi-banding/kegiatan-studi-banding/getlist-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
