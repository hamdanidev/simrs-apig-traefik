http:
  routers:

    v1_peserta-diklat_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/peserta-diklat/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
