http:
  routers:

    v1_bagian_osce_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/osce/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_osce_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/osce/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_osce_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/osce/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_osce_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/osce/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_osce_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/osce/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
