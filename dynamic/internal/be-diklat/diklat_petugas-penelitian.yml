http:
  routers:

    v1_diklat_petugas-penelitian_getlist_GET:
      rule: "PathPrefix(`/v1.0/diklat/petugas-penelitian/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-penelitian_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/diklat/petugas-penelitian/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-penelitian_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/diklat/petugas-penelitian/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-penelitian_get-by-id-penelitian_GET:
      rule: "PathPrefix(`/v1.0/diklat/petugas-penelitian/get-by-id-penelitian/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-penelitian_create_POST:
      rule: "PathPrefix(`/v1.0/diklat/petugas-penelitian/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-penelitian_update_PUT:
      rule: "PathPrefix(`/v1.0/diklat/petugas-penelitian/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-penelitian_delete_DELETE:
      rule: "PathPrefix(`/v1.0/diklat/petugas-penelitian/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
