http:
  routers:

    v1_bagian_bed-side-theaching_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/bed-side-theaching/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_bed-side-theaching_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/bed-side-theaching/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_bed-side-theaching_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/bed-side-theaching/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_bed-side-theaching_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/bed-side-theaching/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_bed-side-theaching_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/bed-side-theaching/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
