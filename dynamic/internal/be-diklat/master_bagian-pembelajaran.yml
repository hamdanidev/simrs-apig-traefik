http:
  routers:

    v1_master_bagian-pembelajaran_getlist_GET:
      rule: "PathPrefix(`/v1.0/master/bagian-pembelajaran/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_bagian-pembelajaran_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/master/bagian-pembelajaran/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_bagian-pembelajaran_create_POST:
      rule: "PathPrefix(`/v1.0/master/bagian-pembelajaran/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_bagian-pembelajaran_update_PUT:
      rule: "PathPrefix(`/v1.0/master/bagian-pembelajaran/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_bagian-pembelajaran_delete_DELETE:
      rule: "PathPrefix(`/v1.0/master/bagian-pembelajaran/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
