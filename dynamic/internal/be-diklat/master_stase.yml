http:
  routers:

    v1_master_stase_getlist_GET:
      rule: "PathPrefix(`/v1.0/master/stase/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_stase_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/master/stase/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_stase_create_POST:
      rule: "PathPrefix(`/v1.0/master/stase/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_stase_update_PUT:
      rule: "PathPrefix(`/v1.0/master/stase/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_stase_delete_DELETE:
      rule: "PathPrefix(`/v1.0/master/stase/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
