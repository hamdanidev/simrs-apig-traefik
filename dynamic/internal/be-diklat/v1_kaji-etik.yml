http:
  routers:

    v1_kaji-etik_getlist_GET:
      rule: "PathPrefix(`/v1.0/kaji-etik/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_kaji-etik_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/kaji-etik/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_kaji-etik_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/kaji-etik/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_kaji-etik_get-by-nomor-surat_GET:
      rule: "PathPrefix(`/v1.0/kaji-etik/get-by-nomor-surat/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_kaji-etik_create_POST:
      rule: "PathPrefix(`/v1.0/kaji-etik/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_kaji-etik_update_PUT:
      rule: "PathPrefix(`/v1.0/kaji-etik/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_kaji-etik_delete_DELETE:
      rule: "PathPrefix(`/v1.0/kaji-etik/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_kaji-etik_update-kirim-kasir_PUT:
      rule: "PathPrefix(`/v1.0/kaji-etik/update-kirim-kasir`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_kaji-etik_update-status-bayar_PUT:
      rule: "PathPrefix(`/v1.0/kaji-etik/update-status-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_kaji-etik_cek-backdate_GET:
      rule: "PathPrefix(`/v1.0/kaji-etik/cek-backdate/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_kaji-etik_update-bukti-bayar_PUT:
      rule: "PathPrefix(`/v1.0/kaji-etik/update-bukti-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
