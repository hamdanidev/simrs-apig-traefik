http:
  routers:

    v1_bagian_cbd_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/cbd/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_cbd_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/cbd/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_cbd_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/cbd/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_cbd_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/cbd/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_cbd_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/cbd/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
