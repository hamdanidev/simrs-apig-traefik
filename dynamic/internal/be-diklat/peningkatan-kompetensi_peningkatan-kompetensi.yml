http:
  routers:

    v1_peningkatan-kompetensi_peningkatan-kompetensi_getlist_GET:
      rule: "PathPrefix(`/v1.0/peningkatan-kompetensi/peningkatan-kompetensi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_peningkatan-kompetensi_peningkatan-kompetensi_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/peningkatan-kompetensi/peningkatan-kompetensi/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_peningkatan-kompetensi_peningkatan-kompetensi_create_POST:
      rule: "PathPrefix(`/v1.0/peningkatan-kompetensi/peningkatan-kompetensi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_peningkatan-kompetensi_peningkatan-kompetensi_update_PUT:
      rule: "PathPrefix(`/v1.0/peningkatan-kompetensi/peningkatan-kompetensi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_peningkatan-kompetensi_peningkatan-kompetensi_delete_DELETE:
      rule: "PathPrefix(`/v1.0/peningkatan-kompetensi/peningkatan-kompetensi/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
