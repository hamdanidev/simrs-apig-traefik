http:
  routers:

    v1_diklat_kaji-proposal_getlist_GET:
      rule: "PathPrefix(`/v1.0/diklat/kaji-proposal/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_kaji-proposal_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/diklat/kaji-proposal/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_kaji-proposal_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/diklat/kaji-proposal/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_kaji-proposal_get-by-nomor-surat_GET:
      rule: "PathPrefix(`/v1.0/diklat/kaji-proposal/get-by-nomor-surat/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_kaji-proposal_create_POST:
      rule: "PathPrefix(`/v1.0/diklat/kaji-proposal/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_kaji-proposal_update_PUT:
      rule: "PathPrefix(`/v1.0/diklat/kaji-proposal/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_kaji-proposal_delete_DELETE:
      rule: "PathPrefix(`/v1.0/diklat/kaji-proposal/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_kaji-proposal_update-kirim-kasir_PUT:
      rule: "PathPrefix(`/v1.0/diklat/kaji-proposal/update-kirim-kasir`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_kaji-proposal_update-status-bayar_PUT:
      rule: "PathPrefix(`/v1.0/diklat/kaji-proposal/update-status-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_kaji-proposal_cek-backdate_GET:
      rule: "PathPrefix(`/v1.0/diklat/kaji-proposal/cek-backdate/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_kaji-proposal_update-bukti-bayar_PUT:
      rule: "PathPrefix(`/v1.0/diklat/kaji-proposal/update-bukti-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
