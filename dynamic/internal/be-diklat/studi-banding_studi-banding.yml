http:
  routers:

    v1_studi-banding_studi-banding_getlist_GET:
      rule: "PathPrefix(`/v1.0/studi-banding/studi-banding/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_studi-banding_studi-banding_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/studi-banding/studi-banding/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_studi-banding_studi-banding_create_POST:
      rule: "PathPrefix(`/v1.0/studi-banding/studi-banding/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_studi-banding_studi-banding_update_PUT:
      rule: "PathPrefix(`/v1.0/studi-banding/studi-banding/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_studi-banding_studi-banding_delete_DELETE:
      rule: "PathPrefix(`/v1.0/studi-banding/studi-banding/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
