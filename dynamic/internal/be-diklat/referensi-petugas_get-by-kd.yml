http:
  routers:

    v1_referensi-petugas_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/referensi-petugas/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
