http:
  routers:

    v1_bagian_tugas-akhir_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/tugas-akhir/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_tugas-akhir_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/tugas-akhir/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_tugas-akhir_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/tugas-akhir/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_tugas-akhir_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/tugas-akhir/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_tugas-akhir_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/tugas-akhir/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
