http:
  routers:

    v1_master_petugas-ruangan_getlist_GET:
      rule: "PathPrefix(`/v1.0/master/petugas-ruangan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_petugas-ruangan_getlist-by-kd-ruangan_GET:
      rule: "PathPrefix(`/v1.0/master/petugas-ruangan/getlist-by-kd-ruangan/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_petugas-ruangan_create_POST:
      rule: "PathPrefix(`/v1.0/master/petugas-ruangan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_petugas-ruangan_update_PUT:
      rule: "PathPrefix(`/v1.0/master/petugas-ruangan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_petugas-ruangan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/master/petugas-ruangan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_petugas-ruangan_perseptor_getlist_GET:
      rule: "PathPrefix(`/v1.0/master/petugas-ruangan/perseptor/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_petugas-ruangan_perseptor_getlist-by-kd-ruangan_GET:
      rule: "PathPrefix(`/v1.0/master/petugas-ruangan/perseptor/getlist-by-kd-ruangan/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_petugas-ruangan_perseptor_create_POST:
      rule: "PathPrefix(`/v1.0/master/petugas-ruangan/perseptor/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_petugas-ruangan_perseptor_update_PUT:
      rule: "PathPrefix(`/v1.0/master/petugas-ruangan/perseptor/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_petugas-ruangan_perseptor_delete_DELETE:
      rule: "PathPrefix(`/v1.0/master/petugas-ruangan/perseptor/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
