http:
  routers:

    v1_referensi-petugas_create_POST:
      rule: "PathPrefix(`/v1.0/referensi-petugas/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_referensi-petugas_update_PUT:
      rule: "PathPrefix(`/v1.0/referensi-petugas/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_referensi-petugas_delete_DELETE:
      rule: "PathPrefix(`/v1.0/referensi-petugas/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
