http:
  routers:

    v1_ppd_ppd_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/ppd/ppd/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_ppd_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/ppd/ppd/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_ppd_create_POST:
      rule: "PathPrefix(`/v1.0/ppd/ppd/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_ppd_getlist_GET:
      rule: "PathPrefix(`/v1.0/ppd/ppd/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_ppd_update_PUT:
      rule: "PathPrefix(`/v1.0/ppd/ppd/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_ppd_delete_DELETE:
      rule: "PathPrefix(`/v1.0/ppd/ppd/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_ppd_update-kirim-kasir_PUT:
      rule: "PathPrefix(`/v1.0/ppd/ppd/update-kirim-kasir`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
