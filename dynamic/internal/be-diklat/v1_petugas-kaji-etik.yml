http:
  routers:

    v1_petugas-kaji-etik_getlist_GET:
      rule: "PathPrefix(`/v1.0/petugas-kaji-etik/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_petugas-kaji-etik_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/petugas-kaji-etik/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_petugas-kaji-etik_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/petugas-kaji-etik/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_petugas-kaji-etik_get-by-id-kaji-etik_GET:
      rule: "PathPrefix(`/v1.0/petugas-kaji-etik/get-by-id-kaji-etik/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_petugas-kaji-etik_create_POST:
      rule: "PathPrefix(`/v1.0/petugas-kaji-etik/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_petugas-kaji-etik_update_PUT:
      rule: "PathPrefix(`/v1.0/petugas-kaji-etik/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_petugas-kaji-etik_delete_DELETE:
      rule: "PathPrefix(`/v1.0/petugas-kaji-etik/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
