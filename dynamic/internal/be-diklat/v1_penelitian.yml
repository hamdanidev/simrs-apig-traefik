http:
  routers:

    v1_penelitian_getlist_GET:
      rule: "PathPrefix(`/v1.0/penelitian/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_penelitian_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/penelitian/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_penelitian_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/penelitian/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_penelitian_get-by-nomor-surat_GET:
      rule: "PathPrefix(`/v1.0/penelitian/get-by-nomor-surat/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_penelitian_create_POST:
      rule: "PathPrefix(`/v1.0/penelitian/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_penelitian_update_PUT:
      rule: "PathPrefix(`/v1.0/penelitian/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_penelitian_delete_DELETE:
      rule: "PathPrefix(`/v1.0/penelitian/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_penelitian_update-kirim-kasir_PUT:
      rule: "PathPrefix(`/v1.0/penelitian/update-kirim-kasir`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_penelitian_update-status-bayar_PUT:
      rule: "PathPrefix(`/v1.0/penelitian/update-status-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_penelitian_cek-backdate_GET:
      rule: "PathPrefix(`/v1.0/penelitian/cek-backdate/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_penelitian_update-bukti-bayar_PUT:
      rule: "PathPrefix(`/v1.0/penelitian/update-bukti-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
