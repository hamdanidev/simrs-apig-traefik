http:
  routers:

    v1_bagian_ronde_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/ronde/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_ronde_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/ronde/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_ronde_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/ronde/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_ronde_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/ronde/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_ronde_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/ronde/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
