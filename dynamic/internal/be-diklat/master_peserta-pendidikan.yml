http:
  routers:

    v1_master_peserta-pendidikan_get-by-no-ktp_GET:
      rule: "PathPrefix(`/v1.0/master/peserta-pendidikan/get-by-no-ktp/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_peserta-pendidikan_get-by-nim_GET:
      rule: "PathPrefix(`/v1.0/master/peserta-pendidikan/get-by-nim/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_peserta-pendidikan_get-by-nama-tanggal-lahir_GET:
      rule: "PathPrefix(`/v1.0/master/peserta-pendidikan/get-by-nama-tanggal-lahir/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_peserta-pendidikan_create_POST:
      rule: "PathPrefix(`/v1.0/master/peserta-pendidikan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_peserta-pendidikan_update-master_PUT:
      rule: "PathPrefix(`/v1.0/master/peserta-pendidikan/update-master`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
