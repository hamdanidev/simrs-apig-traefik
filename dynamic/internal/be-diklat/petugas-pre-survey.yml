http:
  routers:

    v1_petugas-pre-survey_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/petugas-pre-survey/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_petugas-pre-survey_create_POST:
      rule: "PathPrefix(`/v1.0/petugas-pre-survey/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_petugas-pre-survey_update_PUT:
      rule: "PathPrefix(`/v1.0/petugas-pre-survey/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_petugas-pre-survey_delete_DELETE:
      rule: "PathPrefix(`/v1.0/petugas-pre-survey/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
