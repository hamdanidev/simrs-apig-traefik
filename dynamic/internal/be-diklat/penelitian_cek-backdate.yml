http:
  routers:

    v1_penelitian_cek-backdate_GET:
      rule: "PathPrefix(`/v1.0/penelitian/cek-backdate/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
