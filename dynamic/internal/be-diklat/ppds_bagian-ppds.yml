      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_bagian-ppds_getlist_GET:
      rule: "PathPrefix(`/v1.0/ppds/bagian-ppds/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
