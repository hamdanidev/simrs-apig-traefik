http:
  routers:

    v1_ppds_bagian-ppds_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/ppds/bagian-ppds/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_bagian-ppds_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/ppds/bagian-ppds/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_bagian-ppds_create_POST:
      rule: "PathPrefix(`/v1.0/ppds/bagian-ppds/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_bagian-ppds_update_PUT:
