http:
  routers:

    v1_pelatihan_petugas-pelatihan_getlist_GET:
      rule: "PathPrefix(`/v1.0/pelatihan/petugas-pelatihan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pelatihan_petugas-pelatihan_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pelatihan/petugas-pelatihan/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pelatihan_petugas-pelatihan_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pelatihan/petugas-pelatihan/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pelatihan_petugas-pelatihan_get-by-id-kegiatan-pelatihan_GET:
      rule: "PathPrefix(`/v1.0/pelatihan/petugas-pelatihan/get-by-id-kegiatan-pelatihan/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pelatihan_petugas-pelatihan_create_POST:
      rule: "PathPrefix(`/v1.0/pelatihan/petugas-pelatihan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pelatihan_petugas-pelatihan_update_PUT:
      rule: "PathPrefix(`/v1.0/pelatihan/petugas-pelatihan/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_pelatihan_petugas-pelatihan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pelatihan/petugas-pelatihan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
