http:
  routers:

    v1_diklat_petugas-kaji-proposal_getlist_GET:
      rule: "PathPrefix(`/v1.0/diklat/petugas-kaji-proposal/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-kaji-proposal_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/diklat/petugas-kaji-proposal/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-kaji-proposal_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/diklat/petugas-kaji-proposal/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-kaji-proposal_get-by-id-kaji-proposal_GET:
      rule: "PathPrefix(`/v1.0/diklat/petugas-kaji-proposal/get-by-id-kaji-proposal/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-kaji-proposal_create_POST:
      rule: "PathPrefix(`/v1.0/diklat/petugas-kaji-proposal/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-kaji-proposal_update_PUT:
      rule: "PathPrefix(`/v1.0/diklat/petugas-kaji-proposal/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-kaji-proposal_delete_DELETE:
      rule: "PathPrefix(`/v1.0/diklat/petugas-kaji-proposal/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
