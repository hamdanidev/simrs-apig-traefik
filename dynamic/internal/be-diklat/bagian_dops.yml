http:
  routers:

    v1_bagian_dops_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/dops/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_dops_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/dops/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_dops_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/dops/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_dops_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/dops/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_dops_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/dops/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
