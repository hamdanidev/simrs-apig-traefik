http:
  routers:

    v1_ppds_pendidikan-ppds_getlist_GET:
      rule: "PathPrefix(`/v1.0/ppds/pendidikan-ppds/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_pendidikan-ppds_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/ppds/pendidikan-ppds/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_pendidikan-ppds_create_POST:
      rule: "PathPrefix(`/v1.0/ppds/pendidikan-ppds/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_pendidikan-ppds_update_PUT:
      rule: "PathPrefix(`/v1.0/ppds/pendidikan-ppds/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_pendidikan-ppds_delete_DELETE:
      rule: "PathPrefix(`/v1.0/ppds/pendidikan-ppds/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
