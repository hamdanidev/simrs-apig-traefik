http:
  routers:

    v1_diklat_petugas-pre-terap_getlist_GET:
      rule: "PathPrefix(`/v1.0/diklat/petugas-pre-terap/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-pre-terap_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/diklat/petugas-pre-terap/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-pre-terap_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/diklat/petugas-pre-terap/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-pre-terap_get-by-id-pre-terap_GET:
      rule: "PathPrefix(`/v1.0/diklat/petugas-pre-terap/get-by-id-pre-terap/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-pre-terap_create_POST:
      rule: "PathPrefix(`/v1.0/diklat/petugas-pre-terap/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-pre-terap_update_PUT:
      rule: "PathPrefix(`/v1.0/diklat/petugas-pre-terap/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_petugas-pre-terap_delete_DELETE:
      rule: "PathPrefix(`/v1.0/diklat/petugas-pre-terap/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
