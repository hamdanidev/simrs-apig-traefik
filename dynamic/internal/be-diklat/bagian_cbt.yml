http:
  routers:

    v1_bagian_cbt_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/cbt/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_cbt_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/cbt/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_cbt_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/cbt/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_cbt_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/cbt/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_cbt_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/cbt/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
