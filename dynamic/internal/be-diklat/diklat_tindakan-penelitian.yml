http:
  routers:

    v1_diklat_tindakan-penelitian_getlist_GET:
      rule: "PathPrefix(`/v1.0/diklat/tindakan-penelitian/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_tindakan-penelitian_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/diklat/tindakan-penelitian/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_tindakan-penelitian_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/diklat/tindakan-penelitian/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_tindakan-penelitian_create_POST:
      rule: "PathPrefix(`/v1.0/diklat/tindakan-penelitian/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_tindakan-penelitian_update_PUT:
      rule: "PathPrefix(`/v1.0/diklat/tindakan-penelitian/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_tindakan-penelitian_delete_DELETE:
      rule: "PathPrefix(`/v1.0/diklat/tindakan-penelitian/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_diklat_tindakan-penelitian_update-kirim-kasir_PUT:
      rule: "PathPrefix(`/v1.0/diklat/tindakan-penelitian/update-kirim-kasir`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
