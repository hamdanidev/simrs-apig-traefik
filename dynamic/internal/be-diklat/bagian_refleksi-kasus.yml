http:
  routers:

    v1_bagian_refleksi-kasus_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/refleksi-kasus/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_refleksi-kasus_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/refleksi-kasus/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_refleksi-kasus_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/refleksi-kasus/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_refleksi-kasus_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/refleksi-kasus/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_refleksi-kasus_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/refleksi-kasus/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
