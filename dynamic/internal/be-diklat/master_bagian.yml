http:
  routers:

    v1_master_bagian_getlist_GET:
      rule: "PathPrefix(`/v1.0/master/bagian/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_bagian_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/master/bagian/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_bagian_create_POST:
      rule: "PathPrefix(`/v1.0/master/bagian/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_bagian_update_PUT:
      rule: "PathPrefix(`/v1.0/master/bagian/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_master_bagian_delete_DELETE:
      rule: "PathPrefix(`/v1.0/master/bagian/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
