http:
  routers:

    v1_ppds_petugas-orientasi-ppds_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/ppds/petugas-orientasi-ppds/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_petugas-orientasi-ppds_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/ppds/petugas-orientasi-ppds/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_petugas-orientasi-ppds_get-by-id-orientasi-ppds_GET:
      rule: "PathPrefix(`/v1.0/ppds/petugas-orientasi-ppds/get-by-id-orientasi-ppds/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_petugas-orientasi-ppds_create_POST:
      rule: "PathPrefix(`/v1.0/ppds/petugas-orientasi-ppds/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_petugas-orientasi-ppds_update_PUT:
      rule: "PathPrefix(`/v1.0/ppds/petugas-orientasi-ppds/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppds_petugas-orientasi-ppds_delete_DELETE:
      rule: "PathPrefix(`/v1.0/ppds/petugas-orientasi-ppds/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
