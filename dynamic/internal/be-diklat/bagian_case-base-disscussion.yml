http:
  routers:

    v1_bagian_case-base-disscussion_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/bagian/case-base-disscussion/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_case-base-disscussion_getlist_GET:
      rule: "PathPrefix(`/v1.0/bagian/case-base-disscussion/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_case-base-disscussion_create_POST:
      rule: "PathPrefix(`/v1.0/bagian/case-base-disscussion/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_case-base-disscussion_update_PUT:
      rule: "PathPrefix(`/v1.0/bagian/case-base-disscussion/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_bagian_case-base-disscussion_delete_DELETE:
      rule: "PathPrefix(`/v1.0/bagian/case-base-disscussion/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
