http:
  routers:

    v1_ppd_laporan-ujian-ppd_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/ppd/laporan-ujian-ppd/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    # duplicat_v1_ppd_laporan-ujian-ppd_get-by-id_GET:
    #   rule: "PathPrefix(`/v1.0/ppd/laporan-ujian-ppd/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
    #   service: service-diklat
    #   entryPoints:
    #     - web
    #   middlewares:
    #     - "simrs-cors"

    v1_ppd_laporan-ujian-ppd_get-by-id-bagian-ppd_GET:
      rule: "PathPrefix(`/v1.0/ppd/laporan-ujian-ppd/get-by-id-bagian-ppd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_laporan-ujian-ppd_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/ppd/laporan-ujian-ppd/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_laporan-ujian-ppd_create_POST:
      rule: "PathPrefix(`/v1.0/ppd/laporan-ujian-ppd/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_laporan-ujian-ppd_update_PUT:
      rule: "PathPrefix(`/v1.0/ppd/laporan-ujian-ppd/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_ppd_laporan-ujian-ppd_update-status-bayar_PUT:
      rule: "PathPrefix(`/v1.0/ppd/laporan-ujian-ppd/update-status-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
