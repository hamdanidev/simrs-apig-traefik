http:
  routers:

    v1_magang_kegiatan-magang_getlist-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/magang/kegiatan-magang/getlist-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_kegiatan-magang_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/magang/kegiatan-magang/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_kegiatan-magang_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/magang/kegiatan-magang/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_kegiatan-magang_create_POST:
      rule: "PathPrefix(`/v1.0/magang/kegiatan-magang/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_kegiatan-magang_update_PUT:
      rule: "PathPrefix(`/v1.0/magang/kegiatan-magang/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_kegiatan-magang_delete_DELETE:
      rule: "PathPrefix(`/v1.0/magang/kegiatan-magang/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_kegiatan-magang_update-kirim-kasir_PUT:
      rule: "PathPrefix(`/v1.0/magang/kegiatan-magang/update-kirim-kasir`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_kegiatan-magang_update-status-bayar_PUT:
      rule: "PathPrefix(`/v1.0/magang/kegiatan-magang/update-status-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

    v1_magang_kegiatan-magang_update-bukti-bayar_PUT:
      rule: "PathPrefix(`/v1.0/magang/kegiatan-magang/update-bukti-bayar`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-diklat
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"

  services:
    service-diklat:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_DIKLAT_URL" }}'
