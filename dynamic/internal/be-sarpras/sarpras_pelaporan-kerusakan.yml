http:
  routers:

    v1_sarpras_pelaporan-kerusakan_create_POST:
      rule: "PathPrefix(`/v1.0/sarpras/pelaporan-kerusakan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-sarpras
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sarpras_pelaporan-kerusakan_kirim-keluhan_POST:
      rule: "PathPrefix(`/v1.0/sarpras/pelaporan-kerusakan/kirim-keluhan/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-sarpras
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sarpras_pelaporan-kerusakan_get-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/sarpras/pelaporan-kerusakan/get-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sarpras
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sarpras_pelaporan-kerusakan_get-riwayat-order_GET:
      rule: "PathPrefix(`/v1.0/sarpras/pelaporan-kerusakan/get-riwayat-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sarpras
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sarpras_pelaporan-kerusakan_getlist_GET:
      rule: "PathPrefix(`/v1.0/sarpras/pelaporan-kerusakan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sarpras
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sarpras_pelaporan-kerusakan_update_PUT:
      rule: "PathPrefix(`/v1.0/sarpras/pelaporan-kerusakan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-sarpras
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sarpras_pelaporan-kerusakan_verifikasi_PUT:
      rule: "PathPrefix(`/v1.0/sarpras/pelaporan-kerusakan/verifikasi`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-sarpras
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sarpras_pelaporan-kerusakan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/sarpras/pelaporan-kerusakan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-sarpras
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-sarpras:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SARPRAS_URL" }}'
