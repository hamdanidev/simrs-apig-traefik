http:
  routers:

    v1_sarpras_proses-pelaporan-kerusakan_keluhan-diterima_PUT:
      rule: "PathPrefix(`/v1.0/sarpras/proses-pelaporan-kerusakan/keluhan-diterima`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-sarpras
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sarpras_proses-pelaporan-kerusakan_update-inspeksi_PUT:
      rule: "PathPrefix(`/v1.0/sarpras/proses-pelaporan-kerusakan/update-inspeksi`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-sarpras
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sarpras_proses-pelaporan-kerusakan_update-penanganan_PUT:
      rule: "PathPrefix(`/v1.0/sarpras/proses-pelaporan-kerusakan/update-penanganan`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-sarpras
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sarpras_proses-pelaporan-kerusakan_update-selesai_PUT:
      rule: "PathPrefix(`/v1.0/sarpras/proses-pelaporan-kerusakan/update-selesai`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-sarpras
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sarpras_proses-pelaporan-kerusakan_getlist_GET:
      rule: "PathPrefix(`/v1.0/sarpras/proses-pelaporan-kerusakan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sarpras
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_sarpras_proses-pelaporan-kerusakan_get-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/sarpras/proses-pelaporan-kerusakan/get-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-sarpras
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-sarpras:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_SARPRAS_URL" }}'
