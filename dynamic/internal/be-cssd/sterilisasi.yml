http:

  routers:
    v1_cssd_sterilisasi_get-list_GET:
      rule: "PathPrefix(`/v1.0/cssd/sterilisasi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_cssd_sterilisasi_get-by-id-sterilisasi_GET:
      rule: "PathPrefix(`/v1.0/cssd/sterilisasi/get-by-id-sterilisasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_cssd_sterilisasi_create_POST:
      rule: "PathPrefix(`/v1.0/cssd/sterilisasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_cssd_sterilisasi_update_PUT:
      rule: "PathPrefix(`/v1.0/cssd/sterilisasi/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
  services:
    service-cssd:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CSSD_URL" }}'
