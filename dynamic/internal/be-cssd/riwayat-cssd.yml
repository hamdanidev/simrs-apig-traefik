http:

  routers:
    v1_cssd_riwayat-cssd_get-list_GET:
      rule: "PathPrefix(`/v1.0/cssd/riwayat-cssd/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_cssd_riwayat-cssd_create_POST:
      rule: "PathPrefix(`/v1.0/cssd/riwayat-cssd/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_cssd_riwayat-cssd_update_PUT:
      rule: "PathPrefix(`/v1.0/cssd/riwayat-cssd/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
  services:
    service-cssd:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CSSD_URL" }}'
