http:
  routers:

    v1_cssd_order-peminjaman_get-list-order-peminjaman_GET:
      rule: "PathPrefix(`/v1.0/cssd/order-peminjaman/get-list-order-peminjaman`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_cssd_order-peminjaman_get-list-set-peminjaman_GET:
