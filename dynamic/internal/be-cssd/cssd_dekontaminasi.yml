http:
  routers:

    v1_cssd_dekontaminasi_get-list_GET:
      rule: "PathPrefix(`/v1.0/cssd/dekontaminasi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_cssd_dekontaminasi_get-by-id-dekontaminasi_GET:
      rule: "PathPrefix(`/v1.0/cssd/dekontaminasi/get-by-id-dekontaminasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_cssd_dekontaminasi_create_POST:
      rule: "PathPrefix(`/v1.0/cssd/dekontaminasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_cssd_dekontaminasi_update_PUT:
      rule: "PathPrefix(`/v1.0/cssd/dekontaminasi/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-cssd
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-cssd:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_CSSD_URL" }}'
