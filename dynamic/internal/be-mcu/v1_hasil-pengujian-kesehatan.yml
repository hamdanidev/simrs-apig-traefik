http:
  routers:

    v1_hasil-pengujian-kesehatan_get-list_GET:
      rule: "PathPrefix(`/v1.0/hasil-pengujian-kesehatan/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_hasil-pengujian-kesehatan_create_POST:
      rule: "PathPrefix(`/v1.0/hasil-pengujian-kesehatan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_hasil-pengujian-kesehatan_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/hasil-pengujian-kesehatan/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_hasil-pengujian-kesehatan_update_PUT:
      rule: "PathPrefix(`/v1.0/hasil-pengujian-kesehatan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_hasil-pengujian-kesehatan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/hasil-pengujian-kesehatan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-mcu:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MCU_URL" }}'
