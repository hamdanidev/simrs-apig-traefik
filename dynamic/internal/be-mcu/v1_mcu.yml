http:
  routers:

    v1_mcu_order-mcu_get-list_GET:
      rule: "PathPrefix(`/v1.0/mcu/order-mcu/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_mcu_order-mcu_get-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/mcu/order-mcu/get-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_mcu_order-mcu_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/mcu/order-mcu/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_mcu_order-mcu_update-diterima_PUT:
      rule: "PathPrefix(`/v1.0/mcu/order-mcu/update-diterima`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_mcu_order-mcu_update-selesai_PUT:
      rule: "PathPrefix(`/v1.0/mcu/order-mcu/update-selesai`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_mcu_order-mcu_update-hasil-pemeriksaan_PUT:
      rule: "PathPrefix(`/v1.0/mcu/order-mcu/update-hasil-pemeriksaan`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_mcu_order-mcu_update-kesimpulan_PUT:
      rule: "PathPrefix(`/v1.0/mcu/order-mcu/update-kesimpulan`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_mcu_order-mcu_send-antrian-selesai_POST:
      rule: "PathPrefix(`/v1.0/mcu/order-mcu/send-antrian-selesai/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-mcu:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MCU_URL" }}'
