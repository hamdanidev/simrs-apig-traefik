http:
  routers:

    v1_surat-keterangan-sehat_get-list_GET:
      rule: "PathPrefix(`/v1.0/surat-keterangan-sehat/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_surat-keterangan-sehat_create_POST:
      rule: "PathPrefix(`/v1.0/surat-keterangan-sehat/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_surat-keterangan-sehat_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/surat-keterangan-sehat/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_surat-keterangan-sehat_update_PUT:
      rule: "PathPrefix(`/v1.0/surat-keterangan-sehat/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_surat-keterangan-sehat_delete_DELETE:
      rule: "PathPrefix(`/v1.0/surat-keterangan-sehat/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-mcu
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-mcu:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MCU_URL" }}'
