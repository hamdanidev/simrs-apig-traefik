http:
  routers:

    v1_assessmentJatuhDewasa_getList_GET:
      rule: "PathPrefix(`/v1.0/assessmentJatuhDewasa/getList`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentJatuhDewasa_create_POST:
      rule: "PathPrefix(`/v1.0/assessmentJatuhDewasa/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentJatuhDewasa_update_PUT:
      rule: "PathPrefix(`/v1.0/assessmentJatuhDewasa/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentJatuhDewasa_delete_GET:
      rule: "PathPrefix(`/v1.0/assessmentJatuhDewasa/delete/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
