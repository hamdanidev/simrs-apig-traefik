http:
  routers:

    v1_rmpasien_assessmentAwalRehabilitasiMedis_getlist_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/assessmentAwalRehabilitasiMedis/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_assessmentAwalRehabilitasiMedis_create_POST:
      rule: "PathPrefix(`/v1.0/rmpasien/assessmentAwalRehabilitasiMedis/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_assessmentAwalRehabilitasiMedis_update_PUT:
      rule: "PathPrefix(`/v1.0/rmpasien/assessmentAwalRehabilitasiMedis/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_assessmentAwalRehabilitasiMedis_delete_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/assessmentAwalRehabilitasiMedis/delete/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
