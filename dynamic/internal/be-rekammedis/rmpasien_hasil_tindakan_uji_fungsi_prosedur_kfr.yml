http:
  routers:

    v1_rmpasien_hasil_tindakan_uji_fungsi_prosedur_kfr_getlist_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/hasil_tindakan_uji_fungsi_prosedur_kfr/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_hasil_tindakan_uji_fungsi_prosedur_kfr_create_POST:
      rule: "PathPrefix(`/v1.0/rmpasien/hasil_tindakan_uji_fungsi_prosedur_kfr/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_hasil_tindakan_uji_fungsi_prosedur_kfr_update_PUT:
      rule: "PathPrefix(`/v1.0/rmpasien/hasil_tindakan_uji_fungsi_prosedur_kfr/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_hasil_tindakan_uji_fungsi_prosedur_kfr_deletebyid_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/hasil_tindakan_uji_fungsi_prosedur_kfr/deletebyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
