http:
  routers:

    v1_rmpasien_create-pasien-baru_POST:
      rule: "PathPrefix(`/v1.0/rmpasien/create-pasien-baru`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
