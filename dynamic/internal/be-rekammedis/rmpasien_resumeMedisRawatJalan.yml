http:
  routers:

    v1_rmpasien_resumeMedisRawatJalan_getlist_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/resumeMedisRawatJalan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_resumeMedisRawatJalan_create_POST:
      rule: "PathPrefix(`/v1.0/rmpasien/resumeMedisRawatJalan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_resumeMedisRawatJalan_update_PUT:
      rule: "PathPrefix(`/v1.0/rmpasien/resumeMedisRawatJalan/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_resumeMedisRawatJalan_deletebyid_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/resumeMedisRawatJalan/deletebyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
