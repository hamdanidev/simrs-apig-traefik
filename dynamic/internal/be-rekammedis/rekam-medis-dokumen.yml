http:
  routers:
    v1_rekam-medis_dokumen_create_POST:
      rule: "PathPrefix(`/v1.0/rekam-medis/dokumen/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_rekam-medis_dokumen_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/rekam-medis/dokumen/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_rekam-medis_dokumen_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/rekam-medis/dokumen/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_rekam-medis_dokumen_delete_DELETE:
      rule: "PathPrefix(`/v1.0/rekam-medis/dokumen/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
