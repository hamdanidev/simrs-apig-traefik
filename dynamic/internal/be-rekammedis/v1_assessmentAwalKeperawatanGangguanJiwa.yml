http:
  routers:

    v1_assessmentAwalKeperawatanGangguanJiwa_getlist_GET:
      rule: "PathPrefix(`/v1.0/assessmentAwalKeperawatanGangguanJiwa/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentAwalKeperawatanGangguanJiwa_create_POST:
      rule: "PathPrefix(`/v1.0/assessmentAwalKeperawatanGangguanJiwa/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentAwalKeperawatanGangguanJiwa_update_PUT:
      rule: "PathPrefix(`/v1.0/assessmentAwalKeperawatanGangguanJiwa/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentAwalKeperawatanGangguanJiwa_delete_GET:
      rule: "PathPrefix(`/v1.0/assessmentAwalKeperawatanGangguanJiwa/delete/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
