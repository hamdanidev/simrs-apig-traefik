http:
  routers:

    v1_riwayat-rm_get-by-no-rm-dan-no-bpjs_GET:
      rule: "PathPrefix(`/v1.0/riwayat-rm/get-by-no-rm-dan-no-bpjs/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
