http:
  routers:

    v1_rmpasien_daftar_pemeriksaan_penunjang_getlist_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/daftar_pemeriksaan_penunjang/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_daftar_pemeriksaan_penunjang_create_POST:
      rule: "PathPrefix(`/v1.0/rmpasien/daftar_pemeriksaan_penunjang/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_daftar_pemeriksaan_penunjang_update_PUT:
      rule: "PathPrefix(`/v1.0/rmpasien/daftar_pemeriksaan_penunjang/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_daftar_pemeriksaan_penunjang_deletebyid_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/daftar_pemeriksaan_penunjang/deletebyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
