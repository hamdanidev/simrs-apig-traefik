http:
  routers:

    v1_assessmentAwalKeperawatanAnak_getlist_GET:
      rule: "PathPrefix(`/v1.0/assessmentAwalKeperawatanAnak/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentAwalKeperawatanAnak_create_POST:
      rule: "PathPrefix(`/v1.0/assessmentAwalKeperawatanAnak/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentAwalKeperawatanAnak_update_PUT:
      rule: "PathPrefix(`/v1.0/assessmentAwalKeperawatanAnak/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentAwalKeperawatanAnak_delete_GET:
      rule: "PathPrefix(`/v1.0/assessmentAwalKeperawatanAnak/delete/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
