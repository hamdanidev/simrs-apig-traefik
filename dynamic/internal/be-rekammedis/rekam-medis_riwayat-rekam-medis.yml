http:
  routers:

    v1_rekam-medis_riwayat-rekam-medis_getlist_GET:
      rule: "PathPrefix(`/v1.0/rekam-medis/riwayat-rekam-medis/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rekam-medis_riwayat-rekam-medis_create_POST:
      rule: "PathPrefix(`/v1.0/rekam-medis/riwayat-rekam-medis/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rekam-medis_riwayat-rekam-medis_update_PUT:
      rule: "PathPrefix(`/v1.0/rekam-medis/riwayat-rekam-medis/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rekam-medis_riwayat-rekam-medis_delete_DELETE:
      rule: "PathPrefix(`/v1.0/rekam-medis/riwayat-rekam-medis/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rekam-medis_riwayat-rekam-medis_get-by-no-rekam-medis_GET:
      rule: "PathPrefix(`/v1.0/rekam-medis/riwayat-rekam-medis/get-by-no-rekam-medis/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
