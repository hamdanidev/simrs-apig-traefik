http:
  routers:

    v1_rmpasien_radiologi_getlist_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/radiologi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_radiologi_create_POST:
      rule: "PathPrefix(`/v1.0/rmpasien/radiologi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_radiologi_update_PUT:
      rule: "PathPrefix(`/v1.0/rmpasien/radiologi/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_radiologi_deletebyid_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/radiologi/deletebyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
