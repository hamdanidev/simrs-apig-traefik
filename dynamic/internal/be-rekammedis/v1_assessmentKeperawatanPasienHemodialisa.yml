http:
  routers:

    v1_assessmentKeperawatanPasienHemodialisa_getList_GET:
      rule: "PathPrefix(`/v1.0/assessmentKeperawatanPasienHemodialisa/getList`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentKeperawatanPasienHemodialisa_create_POST:
      rule: "PathPrefix(`/v1.0/assessmentKeperawatanPasienHemodialisa/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentKeperawatanPasienHemodialisa_update_PUT:
      rule: "PathPrefix(`/v1.0/assessmentKeperawatanPasienHemodialisa/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentKeperawatanPasienHemodialisa_delete_GET:
      rule: "PathPrefix(`/v1.0/assessmentKeperawatanPasienHemodialisa/delete/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
