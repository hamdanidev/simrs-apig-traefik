http:
  routers:

    v1_rmpasien_laporan_operasi_getlist_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/laporan_operasi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_laporan_operasi_create_POST:
      rule: "PathPrefix(`/v1.0/rmpasien/laporan_operasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_laporan_operasi_update_PUT:
      rule: "PathPrefix(`/v1.0/rmpasien/laporan_operasi/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_laporan_operasi_deletebyid_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/laporan_operasi/deletebyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
