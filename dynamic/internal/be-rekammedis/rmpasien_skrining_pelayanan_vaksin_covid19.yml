http:
  routers:

    v1_rmpasien_skrining_pelayanan_vaksin_covid19_getlist_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/skrining_pelayanan_vaksin_covid19/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_skrining_pelayanan_vaksin_covid19_create_POST:
      rule: "PathPrefix(`/v1.0/rmpasien/skrining_pelayanan_vaksin_covid19/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_skrining_pelayanan_vaksin_covid19_update_PUT:
      rule: "PathPrefix(`/v1.0/rmpasien/skrining_pelayanan_vaksin_covid19/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_skrining_pelayanan_vaksin_covid19_deletebyid_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/skrining_pelayanan_vaksin_covid19/deletebyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
