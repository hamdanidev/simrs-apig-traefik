http:
  routers:

    v1_assessmentAwalKeperawatan_create_POST:
      rule: "PathPrefix(`/v1.0/assessmentAwalKeperawatan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentAwalKeperawatan_update_PUT:
      rule: "PathPrefix(`/v1.0/assessmentAwalKeperawatan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentAwalKeperawatan_delete_GET:
      rule: "PathPrefix(`/v1.0/assessmentAwalKeperawatan/delete/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
