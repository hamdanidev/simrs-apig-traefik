http:
  routers:

    v1_rmpasien_surat_masuk_rumah_sakit_getlist_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/surat_masuk_rumah_sakit/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_surat_masuk_rumah_sakit_create_POST:
      rule: "PathPrefix(`/v1.0/rmpasien/surat_masuk_rumah_sakit/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_surat_masuk_rumah_sakit_update_PUT:
      rule: "PathPrefix(`/v1.0/rmpasien/surat_masuk_rumah_sakit/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_surat_masuk_rumah_sakit_deletebyid_DELETE:
      rule: "PathPrefix(`/v1.0/rmpasien/surat_masuk_rumah_sakit/deletebyid/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
