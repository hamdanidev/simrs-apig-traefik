http:
  routers:

    v1_rmpasien_intake_output_getlist_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/intake_output/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_intake_output_create_POST:
      rule: "PathPrefix(`/v1.0/rmpasien/intake_output/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_intake_output_update_PUT:
      rule: "PathPrefix(`/v1.0/rmpasien/intake_output/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_intake_output_deletebyid_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/intake_output/deletebyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
