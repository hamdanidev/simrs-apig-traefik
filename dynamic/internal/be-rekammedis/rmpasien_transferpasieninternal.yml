http:
  routers:

    v1_rmpasien_transferpasieninternal_getlist_GET:
      rule: "PathPrefix(`/v1.0/rmpasien/transferpasieninternal/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_transferpasieninternal_create_POST:
      rule: "PathPrefix(`/v1.0/rmpasien/transferpasieninternal/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_transferpasieninternal_update_PUT:
      rule: "PathPrefix(`/v1.0/rmpasien/transferpasieninternal/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rmpasien_transferpasieninternal_deletebyid_DELETE:
      rule: "PathPrefix(`/v1.0/rmpasien/transferpasieninternal/deletebyid/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
