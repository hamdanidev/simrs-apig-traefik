http:
  routers:

    v1_assessmentAwalMedisRawatJalan_getlist_GET:
      rule: "PathPrefix(`/v1.0/assessmentAwalMedisRawatJalan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentAwalMedisRawatJalan_create_POST:
      rule: "PathPrefix(`/v1.0/assessmentAwalMedisRawatJalan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentAwalMedisRawatJalan_update_PUT:
      rule: "PathPrefix(`/v1.0/assessmentAwalMedisRawatJalan/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_assessmentAwalMedisRawatJalan_delete_GET:
      rule: "PathPrefix(`/v1.0/assessmentAwalMedisRawatJalan/delete/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
