http:
  routers:

    v1_checklistPulang_getList_GET:
      rule: "PathPrefix(`/v1.0/checklistPulang/getList`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_checklistPulang_create_POST:
      rule: "PathPrefix(`/v1.0/checklistPulang/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_checklistPulang_update_PUT:
      rule: "PathPrefix(`/v1.0/checklistPulang/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_checklistPulang_deletebyid_GET:
      rule: "PathPrefix(`/v1.0/checklistPulang/deletebyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
