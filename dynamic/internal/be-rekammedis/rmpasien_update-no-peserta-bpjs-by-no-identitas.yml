http:
  routers:

    v1_rmpasien_update-no-peserta-bpjs-by-no-identitas_PUT:
      rule: "PathPrefix(`/v1.0/rmpasien/update-no-peserta-bpjs-by-no-identitas/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-rekam-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-rekam-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REKAM_MEDIS_URL" }}'
