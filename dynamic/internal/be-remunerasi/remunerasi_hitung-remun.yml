http:
  routers:

    v1_remunerasi_hitung-remun_proses-nats_POST:
      rule: "PathPrefix(`/v1.0/remunerasi/hitung-remun/proses-nats`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_hitung-remun_proses-looping_POST:
      rule: "PathPrefix(`/v1.0/remunerasi/hitung-remun/proses-looping`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_hitung-remun_sync-index-remun_PUT:
      rule: "PathPrefix(`/v1.0/remunerasi/hitung-remun/sync-index-remun`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_hitung-remun_get-list-index_GET:
      rule: "PathPrefix(`/v1.0/remunerasi/hitung-remun/get-list-index`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_hitung-remun_get-list-jasa-jtl_GET:
      rule: "PathPrefix(`/v1.0/remunerasi/hitung-remun/get-list-jasa-jtl`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_hitung-remun_get-list-jasa-jl_GET:
      rule: "PathPrefix(`/v1.0/remunerasi/hitung-remun/get-list-jasa-jl`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_hitung-remun_response-hitung_GET:
      rule: "PathPrefix(`/v1.0/remunerasi/hitung-remun/response-hitung`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-remunerasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REMUNERASI_URL" }}'
