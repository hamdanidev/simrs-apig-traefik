http:
  routers:

    v1_remunerasi_spj_get-list_GET:
      rule: "PathPrefix(`/v1.0/remunerasi/spj/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_spj_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/remunerasi/spj/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_spj_create_POST:
      rule: "PathPrefix(`/v1.0/remunerasi/spj/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_spj_update_PUT:
      rule: "PathPrefix(`/v1.0/remunerasi/spj/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_spj_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/remunerasi/spj/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_spj_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/remunerasi/spj/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_spj_hitung-perhitungan-remun_POST:
      rule: "PathPrefix(`/v1.0/remunerasi/spj/hitung-perhitungan-remun`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-remunerasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REMUNERASI_URL" }}'
