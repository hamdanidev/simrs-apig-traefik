http:
  routers:

    v1_remunerasi_remun-farmasi_GET:
      rule: "PathPrefix(`/v1.0/remunerasi/remun-farmasi`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-remunerasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REMUNERASI_URL" }}'
