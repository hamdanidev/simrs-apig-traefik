http:
  routers:

    v1_remunerasi_remunerasi_get-list_GET:
      rule: "PathPrefix(`/v1.0/remunerasi/remunerasi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_remunerasi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/remunerasi/remunerasi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_remunerasi_create_POST:
      rule: "PathPrefix(`/v1.0/remunerasi/remunerasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_remunerasi_update_PUT:
      rule: "PathPrefix(`/v1.0/remunerasi/remunerasi/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_remunerasi_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/remunerasi/remunerasi/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-remunerasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REMUNERASI_URL" }}'
