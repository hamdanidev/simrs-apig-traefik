http:
  routers:

    v1_remunerasi_data-umbal_get-list_GET:
      rule: "PathPrefix(`/v1.0/remunerasi/data-umbal/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_data-umbal_finalisasi-hitungan_PUT:
      rule: "PathPrefix(`/v1.0/remunerasi/data-umbal/finalisasi-hitungan`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-remunerasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REMUNERASI_URL" }}'
