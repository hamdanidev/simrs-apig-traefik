http:
  routers:

    v1_remunerasi_index-remun_getlist_GET:
      rule: "PathPrefix(`/v1.0/remunerasi/index-remun/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_index-remun_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/remunerasi/index-remun/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_index-remun_create_POST:
      rule: "PathPrefix(`/v1.0/remunerasi/index-remun/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_index-remun_replikasi_POST:
      rule: "PathPrefix(`/v1.0/remunerasi/index-remun/replikasi`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_index-remun_update_PUT:
      rule: "PathPrefix(`/v1.0/remunerasi/index-remun/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_remunerasi_index-remun_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/remunerasi/index-remun/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-remunerasi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-remunerasi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REMUNERASI_URL" }}'
