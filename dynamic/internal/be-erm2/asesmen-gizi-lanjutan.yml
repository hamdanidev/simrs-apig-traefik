http:
  routers:
    v1_erm_asesmen-gizi-lanjutan_create_POST:
      rule: "PathPrefix(`/v1.0/erm/asesmen-gizi-lanjutan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-gizi-lanjutan_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/asesmen-gizi-lanjutan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-gizi-lanjutan_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-gizi-lanjutan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-gizi-lanjutan_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-gizi-lanjutan/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-gizi-lanjutan_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-gizi-lanjutan/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-gizi-lanjutan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/asesmen-gizi-lanjutan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
