http:
  routers:

    v1_erm_asesmen-kefarmasian_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-kefarmasian/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-kefarmasian_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-kefarmasian/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-kefarmasian_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-kefarmasian/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-kefarmasian_create_POST:
      rule: "PathPrefix(`/v1.0/erm/asesmen-kefarmasian/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-kefarmasian_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/asesmen-kefarmasian/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-kefarmasian_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/asesmen-kefarmasian/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
