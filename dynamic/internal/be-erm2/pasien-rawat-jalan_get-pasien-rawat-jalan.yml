http:
  routers:

    v1_pasien-rawat-jalan_get-pasien-rawat-jalan_GET:
      rule: "PathPrefix(`/v1.0/pasien-rawat-jalan/get-pasien-rawat-jalan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
