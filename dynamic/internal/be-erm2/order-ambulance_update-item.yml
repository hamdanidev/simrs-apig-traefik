http:
  routers:

    v1_order-ambulance_update-item_PUT:
      rule: "PathPrefix(`/v1.0/order-ambulance/update-item`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
