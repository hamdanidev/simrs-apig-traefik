http:
  routers:

    v1_order-obat_send-order-obat-billing-by-nomor-resep_POST:
      rule: "PathPrefix(`/v1.0/order-obat/send-order-obat-billing-by-nomor-resep/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
