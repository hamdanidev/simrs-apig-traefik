http:
  routers:

    v1_peresepan-hd_getlist_GET:
      rule: "PathPrefix(`/v1.0/peresepan-hd/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_peresepan-hd_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/peresepan-hd/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_peresepan-hd_create_POST:
      rule: "PathPrefix(`/v1.0/peresepan-hd/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_peresepan-hd_update_PUT:
      rule: "PathPrefix(`/v1.0/peresepan-hd/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_peresepan-hd_delete_DELETE:
      rule: "PathPrefix(`/v1.0/peresepan-hd/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
