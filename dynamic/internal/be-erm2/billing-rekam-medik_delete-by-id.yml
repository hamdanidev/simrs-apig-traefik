http:
  routers:

    v1_billing-rekam-medik_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/billing-rekam-medik/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
