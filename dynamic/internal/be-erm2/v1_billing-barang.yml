http:
  routers:

    v1_billing-barang_getlist_GET:
      rule: "PathPrefix(`/v1.0/billing-barang/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_billing-barang_getlist-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/billing-barang/getlist-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_billing-barang_create_POST:
      rule: "PathPrefix(`/v1.0/billing-barang/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_billing-barang_update_PUT:
      rule: "PathPrefix(`/v1.0/billing-barang/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_billing-barang_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/billing-barang/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
