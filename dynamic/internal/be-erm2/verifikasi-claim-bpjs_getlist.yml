http:
  routers:

    v1_verifikasi-claim-bpjs_getlist_GET:
      rule: "PathPrefix(`/v1.0/verifikasi-claim-bpjs/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
