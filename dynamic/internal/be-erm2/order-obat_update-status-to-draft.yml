http:
  routers:

    v1_order-obat_update-status-to-draft_PUT:
      rule: "PathPrefix(`/v1.0/order-obat/update-status-to-draft/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
