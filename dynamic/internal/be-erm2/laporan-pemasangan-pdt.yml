http:
  routers:
    v1_laporan-pemasangan-pdt_get-list_GET:
      rule: "PathPrefix(`/v1.0/laporan-pemasangan-pdt/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laporan-pemasangan-pdt_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/laporan-pemasangan-pdt/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laporan-pemasangan-pdt_create_POST:
      rule: "PathPrefix(`/v1.0/laporan-pemasangan-pdt/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laporan-pemasangan-pdt_update_PUT:
      rule: "PathPrefix(`/v1.0/laporan-pemasangan-pdt/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_laporan-pemasangan-pdt_delete_DELETE:
      rule: "PathPrefix(`/v1.0/laporan-pemasangan-pdt/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
