http:
  routers:

    v1_pasien-rawat-inap_get-by-kd-ruangan_GET:
      rule: "PathPrefix(`/v1.0/pasien-rawat-inap/get-by-kd-ruangan/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
