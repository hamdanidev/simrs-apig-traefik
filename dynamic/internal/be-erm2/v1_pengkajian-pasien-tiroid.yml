http:
  routers:

    v1_pengkajian-pasien-tiroid_get-list_GET:
      rule: "PathPrefix(`/v1.0/pengkajian-pasien-tiroid/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-pasien-tiroid_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pengkajian-pasien-tiroid/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-pasien-tiroid_create_POST:
      rule: "PathPrefix(`/v1.0/pengkajian-pasien-tiroid/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-pasien-tiroid_update_PUT:
      rule: "PathPrefix(`/v1.0/pengkajian-pasien-tiroid/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-pasien-tiroid_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pengkajian-pasien-tiroid/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
