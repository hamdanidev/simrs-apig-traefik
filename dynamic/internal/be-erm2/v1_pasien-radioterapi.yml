      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-radioterapi_count_GET:
      rule: "PathPrefix(`/v1.0/pasien-radioterapi/count`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-radioterapi_getlist-all-group-by-sep_GET:
      rule: "PathPrefix(`/v1.0/pasien-radioterapi/getlist-all-group-by-sep`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
