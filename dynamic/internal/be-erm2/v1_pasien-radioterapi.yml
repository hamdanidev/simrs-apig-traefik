http:
  routers:

    v1_pasien-radioterapi_getlist_GET:
      rule: "PathPrefix(`/v1.0/pasien-radioterapi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-radioterapi_getlist_selesai-layanan_GET:
      rule: "PathPrefix(`/v1.0/pasien-radioterapi/getlist/selesai-layanan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-radioterapi_getlist_by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pasien-radioterapi/getlist/by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-radioterapi_update_status_PUT:
      rule: "PathPrefix(`/v1.0/pasien-radioterapi/update/status/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-radioterapi_getlist-all_GET:
      rule: "PathPrefix(`/v1.0/pasien-radioterapi/getlist-all`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
