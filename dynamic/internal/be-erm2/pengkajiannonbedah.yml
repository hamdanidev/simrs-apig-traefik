http:
  routers:

    v1_pengkajiannonbedah_create_POST:
      rule: "PathPrefix(`/v1.0/pengkajiannonbedah/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajiannonbedah_update_PUT:
      rule: "PathPrefix(`/v1.0/pengkajiannonbedah/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajiannonbedah_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pengkajiannonbedah/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
