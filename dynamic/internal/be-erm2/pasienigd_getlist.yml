http:
  routers:

    v1_pasienigd_getlist_pasienigd_GET:
      rule: "PathPrefix(`/v1.0/pasienigd/getlist/pasienigd`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasienigd_getlist_pasientriase_GET:
      rule: "PathPrefix(`/v1.0/pasienigd/getlist/pasientriase`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasienigd_getlist_pasienselesai_GET:
      rule: "PathPrefix(`/v1.0/pasienigd/getlist/pasienselesai`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasienigd_getlist_by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pasienigd/getlist/by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
