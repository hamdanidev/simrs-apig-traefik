http:
  routers:

    v1_tindakan_get-list-by-id-tindakan-bersama_GET:
      rule: "PathPrefix(`/v1.0/tindakan/get-list-by-id-tindakan-bersama/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
