http:
  routers:

    v1_erm_pemeriksaan-fungsi-faal-paru_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/pemeriksaan-fungsi-faal-paru/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pemeriksaan-fungsi-faal-paru_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/pemeriksaan-fungsi-faal-paru/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pemeriksaan-fungsi-faal-paru_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/pemeriksaan-fungsi-faal-paru/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pemeriksaan-fungsi-faal-paru_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/pemeriksaan-fungsi-faal-paru/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pemeriksaan-fungsi-faal-paru_create_POST:
      rule: "PathPrefix(`/v1.0/erm/pemeriksaan-fungsi-faal-paru/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pemeriksaan-fungsi-faal-paru_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/pemeriksaan-fungsi-faal-paru/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pemeriksaan-fungsi-faal-paru_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/pemeriksaan-fungsi-faal-paru/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
