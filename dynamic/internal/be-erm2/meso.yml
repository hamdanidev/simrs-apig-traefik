    v1_erm_meso_create_POST:
      rule: "PathPrefix(`/v1.0/erm/meso/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_meso_update_PUT:
