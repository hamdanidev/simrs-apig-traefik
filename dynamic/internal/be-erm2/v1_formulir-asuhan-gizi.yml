http:
  routers:

    v1_formulir-asuhan-gizi_create_POST:
      rule: "PathPrefix(`/v1.0/formulir-asuhan-gizi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_formulir-asuhan-gizi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/formulir-asuhan-gizi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_formulir-asuhan-gizi_get-list_GET:
      rule: "PathPrefix(`/v1.0/formulir-asuhan-gizi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_formulir-asuhan-gizi_update_PUT:
      rule: "PathPrefix(`/v1.0/formulir-asuhan-gizi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_formulir-asuhan-gizi_delete_DELETE:
      rule: "PathPrefix(`/v1.0/formulir-asuhan-gizi/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
