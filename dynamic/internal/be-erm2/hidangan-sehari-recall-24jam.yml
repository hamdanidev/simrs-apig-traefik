http:
  routers:

    v1_hidangan-sehari-recall-24jam_create_POST:
      rule: "PathPrefix(`/v1.0/hidangan-sehari-recall-24jam/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_hidangan-sehari-recall-24jam_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/hidangan-sehari-recall-24jam/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_hidangan-sehari-recall-24jam_get-list_GET:
      rule: "PathPrefix(`/v1.0/hidangan-sehari-recall-24jam/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_hidangan-sehari-recall-24jam_update_PUT:
      rule: "PathPrefix(`/v1.0/hidangan-sehari-recall-24jam/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_hidangan-sehari-recall-24jam_delete_DELETE:
      rule: "PathPrefix(`/v1.0/hidangan-sehari-recall-24jam/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
