http:
  routers:
    v1_suratketeranganpasienpulang_create_POST:
      rule: "PathPrefix(`/v1.0/suratketeranganpasienpulang/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_suratketeranganpasienpulang_update_PUT:
      rule: "PathPrefix(`/v1.0/suratketeranganpasienpulang/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_suratketeranganpasienpulang_delete_DELETE:
      rule: "PathPrefix(`/v1.0/suratketeranganpasienpulang/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_suratketeranganpasienpulang_getlist_GET:
      rule: "PathPrefix(`/v1.0/suratketeranganpasienpulang/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_suratketeranganpasienpulang_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/suratketeranganpasienpulang/get-by-id`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
