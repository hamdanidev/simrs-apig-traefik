http:
  routers:

    v1_asesmen-awal-igd_getlist_GET:
      rule: "PathPrefix(`/v1.0/asesmen-awal-igd/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-awal-igd_create_POST:
      rule: "PathPrefix(`/v1.0/asesmen-awal-igd/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-awal-igd_update_PUT:
      rule: "PathPrefix(`/v1.0/asesmen-awal-igd/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-awal-igd_delete_DELETE:
      rule: "PathPrefix(`/v1.0/asesmen-awal-igd/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
