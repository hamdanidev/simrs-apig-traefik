http:
  routers:

    v1_erm_tindakan-perawat_get-list-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/tindakan-perawat/get-list-rm`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
