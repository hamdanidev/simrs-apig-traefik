http:
  routers:

    v1_asesmen-populasi-khusus-gangguan-emosional_get-list_GET:
      rule: "PathPrefix(`/v1.0/asesmen-populasi-khusus-gangguan-emosional/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-populasi-khusus-gangguan-emosional_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/asesmen-populasi-khusus-gangguan-emosional/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-populasi-khusus-gangguan-emosional_create_POST:
      rule: "PathPrefix(`/v1.0/asesmen-populasi-khusus-gangguan-emosional/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-populasi-khusus-gangguan-emosional_update_PUT:
      rule: "PathPrefix(`/v1.0/asesmen-populasi-khusus-gangguan-emosional/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-populasi-khusus-gangguan-emosional_delete_DELETE:
      rule: "PathPrefix(`/v1.0/asesmen-populasi-khusus-gangguan-emosional/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
