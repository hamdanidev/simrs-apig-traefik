http:
  routers:

    v1_pasien-operasi_getlist_GET:
      rule: "PathPrefix(`/v1.0/pasien-operasi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

