http:
  routers:

    v1_pengkajian-obgin_get-list_GET:
      rule: "PathPrefix(`/v1.0/pengkajian-obgin/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-obgin_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pengkajian-obgin/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-obgin_create_POST:
      rule: "PathPrefix(`/v1.0/pengkajian-obgin/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-obgin_update_PUT:
      rule: "PathPrefix(`/v1.0/pengkajian-obgin/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-obgin_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pengkajian-obgin/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
