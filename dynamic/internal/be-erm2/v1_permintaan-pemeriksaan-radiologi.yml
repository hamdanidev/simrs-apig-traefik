http:
  routers:

    v1_permintaan-pemeriksaan-radiologi_get-list_GET:
      rule: "PathPrefix(`/v1.0/permintaan-pemeriksaan-radiologi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_permintaan-pemeriksaan-radiologi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/permintaan-pemeriksaan-radiologi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_permintaan-pemeriksaan-radiologi_create_POST:
      rule: "PathPrefix(`/v1.0/permintaan-pemeriksaan-radiologi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_permintaan-pemeriksaan-radiologi_update_PUT:
      rule: "PathPrefix(`/v1.0/permintaan-pemeriksaan-radiologi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_permintaan-pemeriksaan-radiologi_delete_DELETE:
      rule: "PathPrefix(`/v1.0/permintaan-pemeriksaan-radiologi/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
