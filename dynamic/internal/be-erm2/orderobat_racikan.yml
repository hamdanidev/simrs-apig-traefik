http:
  routers:

    v1_orderobat_racikan_getlist_GET:
      rule: "PathPrefix(`/v1.0/orderobat/racikan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_orderobat_racikan_create_POST:
      rule: "PathPrefix(`/v1.0/orderobat/racikan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_orderobat_racikan_send_POST:
      rule: "PathPrefix(`/v1.0/orderobat/racikan/send/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_orderobat_racikan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/orderobat/racikan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_orderobat_racikan_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/orderobat/racikan/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
