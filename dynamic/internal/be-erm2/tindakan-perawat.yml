http:
  routers:

    v1_tindakan-perawat_get-list_GET:
      rule: "PathPrefix(`/v1.0/tindakan-perawat/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan-perawat_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/tindakan-perawat/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan-perawat_create_POST:
      rule: "PathPrefix(`/v1.0/tindakan-perawat/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan-perawat_update_PUT:
      rule: "PathPrefix(`/v1.0/tindakan-perawat/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan-perawat_delete_DELETE:
      rule: "PathPrefix(`/v1.0/tindakan-perawat/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
