http:
  routers:

    v1_order-lab-pk_create-order-lab-items_POST:
      rule: "PathPrefix(`/v1.0/order-lab-pk/create-order-lab-items`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pk_create-order_POST:
      rule: "PathPrefix(`/v1.0/order-lab-pk/create-order`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pk_create-tindakan-lab_POST:
      rule: "PathPrefix(`/v1.0/order-lab-pk/create-tindakan-lab`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pk_send_POST:
      rule: "PathPrefix(`/v1.0/order-lab-pk/send/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pk_getlist-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/order-lab-pk/getlist-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pk_getlist-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/order-lab-pk/getlist-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pk_update-order_PUT:
      rule: "PathPrefix(`/v1.0/order-lab-pk/update-order`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pk_delete_DELETE:
      rule: "PathPrefix(`/v1.0/order-lab-pk/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pk_create-sub-items_POST:
      rule: "PathPrefix(`/v1.0/order-lab-pk/create-sub-items`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pk_delete-sub-items_PUT:
      rule: "PathPrefix(`/v1.0/order-lab-pk/delete-sub-items/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pk_get-list-sub-items_GET:
      rule: "PathPrefix(`/v1.0/order-lab-pk/get-list-sub-items/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
