http:
  routers:

    v1_erm_mini-nutritional-assessment_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/mini-nutritional-assessment/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_mini-nutritional-assessment_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/mini-nutritional-assessment/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_mini-nutritional-assessment_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/mini-nutritional-assessment/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_mini-nutritional-assessment_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/mini-nutritional-assessment/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_mini-nutritional-assessment_create_POST:
      rule: "PathPrefix(`/v1.0/erm/mini-nutritional-assessment/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_mini-nutritional-assessment_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/mini-nutritional-assessment/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_mini-nutritional-assessment_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/mini-nutritional-assessment/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
