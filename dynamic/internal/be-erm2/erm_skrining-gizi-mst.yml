http:
  routers:

    v1_erm_skrining-gizi-mst_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/skrining-gizi-mst/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_skrining-gizi-mst_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/skrining-gizi-mst/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_skrining-gizi-mst_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/skrining-gizi-mst/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_skrining-gizi-mst_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/skrining-gizi-mst/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_skrining-gizi-mst_create_POST:
      rule: "PathPrefix(`/v1.0/erm/skrining-gizi-mst/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_skrining-gizi-mst_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/skrining-gizi-mst/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_skrining-gizi-mst_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/skrining-gizi-mst/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
