http:
  routers:

    v1_form-penanda-lokasi-operasi-pria_get-list_GET:
      rule: "PathPrefix(`/v1.0/form-penanda-lokasi-operasi-pria/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_form-penanda-lokasi-operasi-pria_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/form-penanda-lokasi-operasi-pria/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_form-penanda-lokasi-operasi-pria_create_POST:
      rule: "PathPrefix(`/v1.0/form-penanda-lokasi-operasi-pria/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_form-penanda-lokasi-operasi-pria_update_PUT:
      rule: "PathPrefix(`/v1.0/form-penanda-lokasi-operasi-pria/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_form-penanda-lokasi-operasi-pria_delete_DELETE:
      rule: "PathPrefix(`/v1.0/form-penanda-lokasi-operasi-pria/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
