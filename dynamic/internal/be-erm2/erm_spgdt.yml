http:
  routers:

    v1_erm_spgdt_get-list_GET:
      rule: "PathPrefix(`/v1.0/erm/spgdt/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_spgdt_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/spgdt/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_spgdt_create_POST:
      rule: "PathPrefix(`/v1.0/erm/spgdt/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_spgdt_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/spgdt/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_spgdt_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/spgdt/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
