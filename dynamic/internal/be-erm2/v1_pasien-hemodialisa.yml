    v1_pasien-hemodialisa_batal-layanan_PUT:
      rule: "PathPrefix(`/v1.0/pasien-hemodialisa/batal-layanan/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-hemodialisa_selesai-layanan_PUT:
