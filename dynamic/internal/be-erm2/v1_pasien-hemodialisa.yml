http:
  routers:

    v1_pasien-hemodialisa_getlist_GET:
      rule: "PathPrefix(`/v1.0/pasien-hemodialisa/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-hemodialisa_getlist_selesai-layanan_GET:
      rule: "PathPrefix(`/v1.0/pasien-hemodialisa/getlist/selesai-layanan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-hemodialisa_getlist_by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pasien-hemodialisa/getlist/by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-hemodialisa_update_status_PUT:
      rule: "PathPrefix(`/v1.0/pasien-hemodialisa/update/status/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-hemodialisa_getlist-all_GET:
      rule: "PathPrefix(`/v1.0/pasien-hemodialisa/getlist-all`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
