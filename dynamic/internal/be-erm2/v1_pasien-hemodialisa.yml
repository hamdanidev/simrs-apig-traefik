      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-hemodialisa_count_GET:
      rule: "PathPrefix(`/v1.0/pasien-hemodialisa/count`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-hemodialisa_getlist-all-group-by-sep_GET:
      rule: "PathPrefix(`/v1.0/pasien-hemodialisa/getlist-all-group-by-sep`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-hemodialisa_update-status-billing_PUT:
      rule: "PathPrefix(`/v1.0/pasien-hemodialisa/update-status-billing`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
