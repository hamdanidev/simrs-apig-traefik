http:
  routers:
    erm_pelayanan_informasi_obat_create:
      rule: "PathPrefix(`/v1.0/erm/pelayanan-informasi-obat/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_pelayanan_informasi_obat_update:
      rule: "PathPrefix(`/v1.0/erm/pelayanan-informasi-obat/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_pelayanan_informasi_obat_get_by_id:
      rule: "PathPrefix(`/v1.0/erm/pelayanan-informasi-obat/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_pelayanan_informasi_obat_get-list:
      rule: "PathPrefix(`/v1.0/erm/pelayanan-informasi-obat/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_pelayanan_informasi_obat_delete:
      rule: "PathPrefix(`/v1.0/erm/pelayanan-informasi-obat/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
