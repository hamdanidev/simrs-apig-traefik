http:
  routers:

    v1_berkas-lama_get-by-no-registrasi_GET:  #ini akan dihapus nantinya
      rule: "PathPrefix(`/v1.0/berkas-lama/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
