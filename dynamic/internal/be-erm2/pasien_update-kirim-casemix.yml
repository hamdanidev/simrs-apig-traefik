http:
  routers:

    v1_pasien_update-kirim-casemix_PUT:
      rule: "PathPrefix(`/v1.0/pasien/update-kirim-casemix/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
