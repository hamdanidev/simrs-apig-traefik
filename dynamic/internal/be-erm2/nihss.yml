http:
  routers:
    erm_nihss_create:
      rule: "PathPrefix(`/v1.0/erm/nihss/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_nihss_update:
      rule: "PathPrefix(`/v1.0/erm/nihss/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_nihss_delete:
      rule: "PathPrefix(`/v1.0/erm/nihss/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_nihss_get_by_no_rm:
      rule: "PathPrefix(`/v1.0/erm/nihss/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_nihss_get_by_no_registrasi:
      rule: "PathPrefix(`/v1.0/erm/nihss/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_nihss_getlist:
      rule: "PathPrefix(`/v1.0/erm/nihss/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_nihss_get_by_id:
      rule: "PathPrefix(`/v1.0/erm/nihss/get-by-id`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
