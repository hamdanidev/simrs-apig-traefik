http:
  routers:

    v1_berkas-digital_create_POST:
      rule: "PathPrefix(`/v1.0/berkas-digital/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_berkas-digital_update_PUT:
      rule: "PathPrefix(`/v1.0/berkas-digital/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_berkas-digital_delete_DELETE:
      rule: "PathPrefix(`/v1.0/berkas-digital/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
