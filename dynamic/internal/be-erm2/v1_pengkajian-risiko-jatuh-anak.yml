http:
  routers:

    v1_pengkajian-risiko-jatuh-anak_create_POST:
      rule: "PathPrefix(`/v1.0/pengkajian-risiko-jatuh-anak/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-risiko-jatuh-anak_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pengkajian-risiko-jatuh-anak/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-risiko-jatuh-anak_get-list_GET:
      rule: "PathPrefix(`/v1.0/pengkajian-risiko-jatuh-anak/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-risiko-jatuh-anak_update_PUT:
      rule: "PathPrefix(`/v1.0/pengkajian-risiko-jatuh-anak/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-risiko-jatuh-anak_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pengkajian-risiko-jatuh-anak/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
