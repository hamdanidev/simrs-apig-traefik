http:
  routers:

    v1_order-radiologi_get-list-tindakan-bersama_GET:
      rule: "PathPrefix(`/v1.0/order-radiologi/get-list-tindakan-bersama/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
