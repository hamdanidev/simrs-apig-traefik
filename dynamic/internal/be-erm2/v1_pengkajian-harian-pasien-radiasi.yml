http:
  routers:

    v1_pengkajian-harian-pasien-radiasi_get-list_GET:
      rule: "PathPrefix(`/v1.0/pengkajian-harian-pasien-radiasi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-harian-pasien-radiasi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pengkajian-harian-pasien-radiasi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-harian-pasien-radiasi_create_POST:
      rule: "PathPrefix(`/v1.0/pengkajian-harian-pasien-radiasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-harian-pasien-radiasi_update_PUT:
      rule: "PathPrefix(`/v1.0/pengkajian-harian-pasien-radiasi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-harian-pasien-radiasi_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pengkajian-harian-pasien-radiasi/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
