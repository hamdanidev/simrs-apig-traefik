http:
  routers:

    v1_erm_pemeriksaan-bronkoskopi_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/pemeriksaan-bronkoskopi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pemeriksaan-bronkoskopi_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/pemeriksaan-bronkoskopi/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pemeriksaan-bronkoskopi_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/pemeriksaan-bronkoskopi/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pemeriksaan-bronkoskopi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/pemeriksaan-bronkoskopi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pemeriksaan-bronkoskopi_create_POST:
      rule: "PathPrefix(`/v1.0/erm/pemeriksaan-bronkoskopi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pemeriksaan-bronkoskopi_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/pemeriksaan-bronkoskopi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pemeriksaan-bronkoskopi_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/pemeriksaan-bronkoskopi/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
