http:
  routers:

    v1_order-lab-pa_create-order-lab-items_POST:
      rule: "PathPrefix(`/v1.0/order-lab-pa/create-order-lab-items`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pa_create-order_POST:
      rule: "PathPrefix(`/v1.0/order-lab-pa/create-order`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pa_create-tindakan-lab_POST:
      rule: "PathPrefix(`/v1.0/order-lab-pa/create-tindakan-lab`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pa_send_POST:
      rule: "PathPrefix(`/v1.0/order-lab-pa/send/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pa_getlist-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/order-lab-pa/getlist-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pa_getlist-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/order-lab-pa/getlist-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pa_update-order_PUT:
      rule: "PathPrefix(`/v1.0/order-lab-pa/update-order`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-lab-pa_delete_DELETE:
      rule: "PathPrefix(`/v1.0/order-lab-pa/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
