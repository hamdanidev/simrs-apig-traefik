http:
  routers:

    v1_erm_laporan-10-besar-penyakit-rehab-medis_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/laporan-10-besar-penyakit-rehab-medis/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
