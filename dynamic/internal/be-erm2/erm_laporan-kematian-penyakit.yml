http:
  routers:

    v1_erm_laporan-kematian-penyakit_10-besar_GET:
      rule: "PathPrefix(`/v1.0/erm/laporan-kematian-penyakit/10-besar`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
