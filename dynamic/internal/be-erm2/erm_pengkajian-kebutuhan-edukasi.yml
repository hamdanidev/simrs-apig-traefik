http:
  routers:

    v1_erm_pengkajian-kebutuhan-edukasi_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/pengkajian-kebutuhan-edukasi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pengkajian-kebutuhan-edukasi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/pengkajian-kebutuhan-edukasi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pengkajian-kebutuhan-edukasi_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/pengkajian-kebutuhan-edukasi/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pengkajian-kebutuhan-edukasi_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/pengkajian-kebutuhan-edukasi/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pengkajian-kebutuhan-edukasi_create_POST:
      rule: "PathPrefix(`/v1.0/erm/pengkajian-kebutuhan-edukasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pengkajian-kebutuhan-edukasi_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/pengkajian-kebutuhan-edukasi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pengkajian-kebutuhan-edukasi_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/pengkajian-kebutuhan-edukasi/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
