http:
  routers:

    v1_pengkajiananak_update-status_PUT:
      rule: "PathPrefix(`/v1.0/pengkajiananak/update-status`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
