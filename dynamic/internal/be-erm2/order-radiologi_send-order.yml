http:
  routers:

    v1_order-radiologi_send-order_POST:
      rule: "PathPrefix(`/v1.0/order-radiologi/send-order/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
