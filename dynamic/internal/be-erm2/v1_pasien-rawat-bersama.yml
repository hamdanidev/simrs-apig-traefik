http:
  routers:

    v1_pasien-rawat-bersama_create_POST:
      rule: "PathPrefix(`/v1.0/pasien-rawat-bersama/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-rawat-bersama_update-data-rawat-bersama_PUT:
      rule: "PathPrefix(`/v1.0/pasien-rawat-bersama/update-data-rawat-bersama`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-rawat-bersama_getlist-dokter-pengirim_GET:
      rule: "PathPrefix(`/v1.0/pasien-rawat-bersama/getlist-dokter-pengirim`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-rawat-bersama_getlist-dokter-penerima_GET:
      rule: "PathPrefix(`/v1.0/pasien-rawat-bersama/getlist-dokter-penerima`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-rawat-bersama_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pasien-rawat-bersama/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-rawat-bersama_delete-pasien-rawat-bersama_DELETE:
      rule: "PathPrefix(`/v1.0/pasien-rawat-bersama/delete-pasien-rawat-bersama/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-rawat-bersama_send_POST:
      rule: "PathPrefix(`/v1.0/pasien-rawat-bersama/send/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-rawat-bersama_batal-rawat-bersama_PUT:
      rule: "PathPrefix(`/v1.0/pasien-rawat-bersama/batal-rawat-bersama`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
