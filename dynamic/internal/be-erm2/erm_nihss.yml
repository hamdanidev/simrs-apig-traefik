http:
  routers:

    v1_erm_nihss_create_POST:
      rule: "PathPrefix(`/v1.0/erm/nihss/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_nihss_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/nihss/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_nihss_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/nihss/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_nihss_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/nihss/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_nihss_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/nihss/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_nihss_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/nihss/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_nihss_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/nihss/get-by-id`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
