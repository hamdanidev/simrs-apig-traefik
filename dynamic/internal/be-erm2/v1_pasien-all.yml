http:
  routers:

    v1_pasien-all_batal-layanan_PUT:
      rule: "PathPrefix(`/v1.0/pasien-all/batal-layanan/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-all_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pasien-all/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-all_buka-layanan_PUT:
      rule: "PathPrefix(`/v1.0/pasien-all/buka-layanan/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
