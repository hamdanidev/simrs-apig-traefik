http:
  routers:

    v1_pasien-konsul_create-konsul_POST:
      rule: "PathPrefix(`/v1.0/pasien-konsul/create-konsul`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
