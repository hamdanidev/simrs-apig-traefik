http:
  routers:

    v1_rencana-kontrol_create-mjkn-ulang_POST:
      rule: "PathPrefix(`/v1.0/rencana-kontrol/create-mjkn-ulang`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
