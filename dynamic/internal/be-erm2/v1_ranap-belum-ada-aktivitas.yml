http:
  routers:

    v1_ranap-belum-ada-aktivitas_get-list_GET:
      rule: "PathPrefix(`/v1.0/ranap-belum-ada-aktivitas/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
