http:
  routers:

    v1_catatan-edukasi-terintegrasi-pasien-keluarga_create_POST:
      rule: "PathPrefix(`/v1.0/catatan-edukasi-terintegrasi-pasien-keluarga/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_catatan-edukasi-terintegrasi-pasien-keluarga_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/catatan-edukasi-terintegrasi-pasien-keluarga/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_catatan-edukasi-terintegrasi-pasien-keluarga_get-list_GET:
      rule: "PathPrefix(`/v1.0/catatan-edukasi-terintegrasi-pasien-keluarga/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_catatan-edukasi-terintegrasi-pasien-keluarga_update_PUT:
      rule: "PathPrefix(`/v1.0/catatan-edukasi-terintegrasi-pasien-keluarga/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_catatan-edukasi-terintegrasi-pasien-keluarga_delete_DELETE:
      rule: "PathPrefix(`/v1.0/catatan-edukasi-terintegrasi-pasien-keluarga/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
