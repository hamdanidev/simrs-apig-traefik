http:
  routers:

    v1_erm_resume-medis-hemodialisa_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/resume-medis-hemodialisa/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_resume-medis-hemodialisa_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/resume-medis-hemodialisa/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_resume-medis-hemodialisa_create_POST:
      rule: "PathPrefix(`/v1.0/erm/resume-medis-hemodialisa/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_resume-medis-hemodialisa_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/resume-medis-hemodialisa/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_resume-medis-hemodialisa_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/resume-medis-hemodialisa/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_resume-medis-hemodialisa_get-by-no-registrasi-verifikator_GET:
      rule: "PathPrefix(`/v1.0/erm/resume-medis-hemodialisa/get-by-no-registrasi-verifikator/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
