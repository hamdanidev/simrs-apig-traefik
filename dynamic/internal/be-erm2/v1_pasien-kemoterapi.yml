http:
  routers:

    v1_pasien-kemoterapi_getlist_GET:
      rule: "PathPrefix(`/v1.0/pasien-kemoterapi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-kemoterapi_getlist_selesai-layanan_GET:
      rule: "PathPrefix(`/v1.0/pasien-kemoterapi/getlist/selesai-layanan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-kemoterapi_getlist_by-no-registrasi_GET:
