      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-kemoterapi_update_status_PUT:
      rule: "PathPrefix(`/v1.0/pasien-kemoterapi/update/status/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
