        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-kemoterapi_count_GET:
      rule: "PathPrefix(`/v1.0/pasien-kemoterapi/count`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
