http:
  routers:

    v1_cppt_deskripsi-tindakan_create_POST:
      rule: "PathPrefix(`/v1.0/cppt/deskripsi-tindakan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_cppt_deskripsi-tindakan_update_PUT:
      rule: "PathPrefix(`/v1.0/cppt/deskripsi-tindakan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_cppt_deskripsi-tindakan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/cppt/deskripsi-tindakan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_cppt_deskripsi-tindakan_getlist_GET:
      rule: "PathPrefix(`/v1.0/cppt/deskripsi-tindakan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_cppt_deskripsi-tindakan_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/cppt/deskripsi-tindakan/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_cppt_deskripsi-tindakan_get-by-id-tindakan_GET:
      rule: "PathPrefix(`/v1.0/cppt/deskripsi-tindakan/get-by-id-tindakan/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
