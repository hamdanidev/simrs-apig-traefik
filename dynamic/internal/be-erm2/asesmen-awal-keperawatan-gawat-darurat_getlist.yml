http:
  routers:

    v1_asesmen-awal-keperawatan-gawat-darurat_getlist_GET:
      rule: "PathPrefix(`/v1.0/asesmen-awal-keperawatan-gawat-darurat/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
