http:
  routers:

    v1_surat-masuk-keperawatan_get-list_GET:
      rule: "PathPrefix(`/v1.0/surat-masuk-keperawatan/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_surat-masuk-keperawatan_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/surat-masuk-keperawatan/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_surat-masuk-keperawatan_create_POST:
      rule: "PathPrefix(`/v1.0/surat-masuk-keperawatan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_surat-masuk-keperawatan_update_PUT:
      rule: "PathPrefix(`/v1.0/surat-masuk-keperawatan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_surat-masuk-keperawatan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/surat-masuk-keperawatan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
