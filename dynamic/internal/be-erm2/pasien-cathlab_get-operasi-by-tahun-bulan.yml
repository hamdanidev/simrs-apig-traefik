http:
  routers:

    v1_pasien-cathlab_get-operasi-by-tahun-bulan_GET:
      rule: "PathPrefix(`/v1.0/pasien-cathlab/get-operasi-by-tahun-bulan/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
