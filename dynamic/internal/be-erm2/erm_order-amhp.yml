http:
  routers:

    v1_erm_order-amhp_getlist-order-amhp-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/order-amhp/getlist-order-amhp-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-amhp_getlist-order-barang-amhp-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/erm/order-amhp/getlist-order-barang-amhp-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-amhp_create_POST:
      rule: "PathPrefix(`/v1.0/erm/order-amhp/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-amhp_create-order-barang-amhp_POST:
      rule: "PathPrefix(`/v1.0/erm/order-amhp/create-order-barang-amhp`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-amhp_send-order-amhp_POST:
      rule: "PathPrefix(`/v1.0/erm/order-amhp/send-order-amhp/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-amhp_delete-order-amhp-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/erm/order-amhp/delete-order-amhp-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-amhp_send-billing-amhp_POST:
      rule: "PathPrefix(`/v1.0/erm/order-amhp/send-billing-amhp/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-amhp_delete-order-amhp_DELETE:
      rule: "PathPrefix(`/v1.0/erm/order-amhp/delete-order-amhp/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-amhp_update-order-barang-amhp_PUT:
      rule: "PathPrefix(`/v1.0/erm/order-amhp/update-order-barang-amhp`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-amhp_getlist-order-amhp-barang-amhp_GET:
      rule: "PathPrefix(`/v1.0/erm/order-amhp/getlist-order-amhp-barang-amhp/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
