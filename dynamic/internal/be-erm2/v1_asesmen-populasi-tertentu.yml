http:
  routers:

    v1_asesmen-populasi-tertentu_get-list_GET:
      rule: "PathPrefix(`/v1.0/asesmen-populasi-tertentu/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-populasi-tertentu_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/asesmen-populasi-tertentu/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-populasi-tertentu_create_POST:
      rule: "PathPrefix(`/v1.0/asesmen-populasi-tertentu/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-populasi-tertentu_update_PUT:
      rule: "PathPrefix(`/v1.0/asesmen-populasi-tertentu/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-populasi-tertentu_delete_DELETE:
      rule: "PathPrefix(`/v1.0/asesmen-populasi-tertentu/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
