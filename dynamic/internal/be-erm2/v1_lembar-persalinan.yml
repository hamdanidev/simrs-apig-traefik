http:
  routers:

    v1_lembar-persalinan_create_POST:
      rule: "PathPrefix(`/v1.0/lembar-persalinan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lembar-persalinan_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/lembar-persalinan/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lembar-persalinan_get-list_GET:
      rule: "PathPrefix(`/v1.0/lembar-persalinan/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lembar-persalinan_update_PUT:
      rule: "PathPrefix(`/v1.0/lembar-persalinan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lembar-persalinan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/lembar-persalinan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
