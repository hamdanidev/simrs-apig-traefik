http:
  routers:

    v1_pengkajian-rawat-jalan-mata_get-list_GET:
      rule: "PathPrefix(`/v1.0/pengkajian-rawat-jalan-mata/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-rawat-jalan-mata_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pengkajian-rawat-jalan-mata/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-rawat-jalan-mata_create_POST:
      rule: "PathPrefix(`/v1.0/pengkajian-rawat-jalan-mata/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-rawat-jalan-mata_update_PUT:
      rule: "PathPrefix(`/v1.0/pengkajian-rawat-jalan-mata/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-rawat-jalan-mata_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pengkajian-rawat-jalan-mata/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
