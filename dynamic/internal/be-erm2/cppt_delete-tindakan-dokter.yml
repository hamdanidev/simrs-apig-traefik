http:
  routers:

    v1_cppt_delete-tindakan-dokter_DELETE:
      rule: "PathPrefix(`/v1.0/cppt/delete-tindakan-dokter/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
