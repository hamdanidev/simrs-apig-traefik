http:
  routers:

    v1_erm_laporan-bor-los-toi_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/laporan-bor-los-toi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_laporan-bor-los-toi_getlist_per-ruangan_GET:
      rule: "PathPrefix(`/v1.0/erm/laporan-bor-los-toi/getlist/per-ruangan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_laporan-bor-los-toi_get-all_per-ruangan_GET:
      rule: "PathPrefix(`/v1.0/erm/laporan-bor-los-toi/get-all/per-ruangan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_laporan-bor-los-toi_getlist_per-ruangan_pertahun_GET:
      rule: "PathPrefix(`/v1.0/erm/laporan-bor-los-toi/getlist/per-ruangan/pertahun`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_laporan-bor-los-toi_get-all_per-ruangan_pertahun_GET:
      rule: "PathPrefix(`/v1.0/erm/laporan-bor-los-toi/get-all/per-ruangan/pertahun`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
