http:
  routers:
    v1_pasien-erm-all_update-status-kedatangan_PUT:
      rule: "PathPrefix(`/v1.0/pasien-erm-all/update-status-kedatangan/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_pasien-erm-all_update-status-koding_PUT:
      rule: "PathPrefix(`/v1.0/pasien-erm-all/update-status-koding`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_pasien-erm-all_count-status-koding_GET:
      rule: "PathPrefix(`/v1.0/pasien-erm-all/count-status-koding`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_pasien-erm-all_update-no-sep_PUT:
      rule: "PathPrefix(`/v1.0/pasien-erm-all/update-no-sep`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
