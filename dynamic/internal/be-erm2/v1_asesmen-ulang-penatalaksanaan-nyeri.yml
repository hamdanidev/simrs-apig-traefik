http:
  routers:

    v1_asesmen-ulang-penatalaksanaan-nyeri_get-list_GET:
      rule: "PathPrefix(`/v1.0/asesmen-ulang-penatalaksanaan-nyeri/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-ulang-penatalaksanaan-nyeri_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/asesmen-ulang-penatalaksanaan-nyeri/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-ulang-penatalaksanaan-nyeri_create_POST:
      rule: "PathPrefix(`/v1.0/asesmen-ulang-penatalaksanaan-nyeri/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-ulang-penatalaksanaan-nyeri_update_PUT:
      rule: "PathPrefix(`/v1.0/asesmen-ulang-penatalaksanaan-nyeri/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-ulang-penatalaksanaan-nyeri_delete_DELETE:
      rule: "PathPrefix(`/v1.0/asesmen-ulang-penatalaksanaan-nyeri/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
