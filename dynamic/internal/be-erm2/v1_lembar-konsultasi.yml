http:
  routers:

    v1_lembar-konsultasi_get-list_GET:
      rule: "PathPrefix(`/v1.0/lembar-konsultasi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lembar-konsultasi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/lembar-konsultasi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lembar-konsultasi_create_POST:
      rule: "PathPrefix(`/v1.0/lembar-konsultasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lembar-konsultasi_update_PUT:
      rule: "PathPrefix(`/v1.0/lembar-konsultasi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lembar-konsultasi_delete_DELETE:
      rule: "PathPrefix(`/v1.0/lembar-konsultasi/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
