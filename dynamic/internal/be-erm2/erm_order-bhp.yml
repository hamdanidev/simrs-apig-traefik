http:
  routers:

    v1_erm_order-bhp_getlist-order-bhp-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/order-bhp/getlist-order-bhp-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-bhp_getlist-order-barang-bhp-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/erm/order-bhp/getlist-order-barang-bhp-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-bhp_create_POST:
      rule: "PathPrefix(`/v1.0/erm/order-bhp/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-bhp_create-order-barang-bhp_POST:
      rule: "PathPrefix(`/v1.0/erm/order-bhp/create-order-barang-bhp`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-bhp_send-order-bhp_POST:
      rule: "PathPrefix(`/v1.0/erm/order-bhp/send-order-bhp/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-bhp_delete-order-bhp-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/erm/order-bhp/delete-order-bhp-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-bhp_send-billing-bhp_POST:
      rule: "PathPrefix(`/v1.0/erm/order-bhp/send-billing-bhp/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-bhp_delete-order-bhp_DELETE:
      rule: "PathPrefix(`/v1.0/erm/order-bhp/delete-order-bhp/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-bhp_update-order-barang-bhp_PUT:
      rule: "PathPrefix(`/v1.0/erm/order-bhp/update-order-barang-bhp`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-bhp_getlist-order-bhp-barang-bhp_GET:
      rule: "PathPrefix(`/v1.0/erm/order-bhp/getlist-order-bhp-barang-bhp/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
