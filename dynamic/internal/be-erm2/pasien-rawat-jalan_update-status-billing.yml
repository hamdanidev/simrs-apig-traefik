http:
  routers:

    v1_pasien-rawat-jalan_update-status-billing_PUT:
      rule: "PathPrefix(`/v1.0/pasien-rawat-jalan/update-status-billing`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
