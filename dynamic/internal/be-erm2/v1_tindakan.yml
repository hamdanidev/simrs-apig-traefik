http:
  routers:

    v1_tindakan_get-list-all_GET:
      rule: "PathPrefix(`/v1.0/tindakan/get-list-all`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan_laporan_GET:
      rule: "PathPrefix(`/v1.0/tindakan/laporan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan_get-list-by_GET:
      rule: "PathPrefix(`/v1.0/tindakan/get-list-by`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan_create_POST:
      rule: "PathPrefix(`/v1.0/tindakan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan_update_PUT:
      rule: "PathPrefix(`/v1.0/tindakan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan_deletebyid_DELETE:
      rule: "PathPrefix(`/v1.0/tindakan/deletebyid/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan_sendtormbyid_POST:
      rule: "PathPrefix(`/v1.0/tindakan/sendtormbyid/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan_get-list-by-tipe-petugas_GET:
      rule: "PathPrefix(`/v1.0/tindakan/get-list-by-tipe-petugas`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan_send-to-kasir_POST:
      rule: "PathPrefix(`/v1.0/tindakan/send-to-kasir/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan_create-asuhan-keperawatan_POST:
      rule: "PathPrefix(`/v1.0/tindakan/create-asuhan-keperawatan`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan_create-tindakan-bersama_POST:
      rule: "PathPrefix(`/v1.0/tindakan/create-tindakan-bersama`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan_delete-tindakan-bersama_DELETE:
      rule: "PathPrefix(`/v1.0/tindakan/delete-tindakan-bersama/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_tindakan_get-list-by-id-tindakan-bersama_GET:
      rule: "PathPrefix(`/v1.0/tindakan/get-list-by-id-tindakan-bersama/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
