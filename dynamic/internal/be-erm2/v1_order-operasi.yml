http:
  routers:

    v1_order-operasi_getlist-order-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/order-operasi/getlist-order-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-operasi_getlist-tindakan-by-no-order_GET:
      rule: "PathPrefix(`/v1.0/order-operasi/getlist-tindakan-by-no-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-operasi_create-order_POST:
      rule: "PathPrefix(`/v1.0/order-operasi/create-order`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-operasi_create-tindakan_POST:
      rule: "PathPrefix(`/v1.0/order-operasi/create-tindakan`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-operasi_send-order_POST:
      rule: "PathPrefix(`/v1.0/order-operasi/send-order/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-operasi_update-order_PUT:
      rule: "PathPrefix(`/v1.0/order-operasi/update-order`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-operasi_delete-tindakan_DELETE:
      rule: "PathPrefix(`/v1.0/order-operasi/delete-tindakan/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    # erm_order_operasi_update_odc:
    #   rule: "PathPrefix(`/v1.0/order-operasi/update-odc/`) && (Method(`PUT`) || Method(`OPTIONS`))"
    #   service: service-erm
    #   entryPoints:
    #     - web
    #   middlewares:
    #     - "simrs-cors"
    #     - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
