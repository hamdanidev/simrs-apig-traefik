http:
  routers:

    v1_order-obat_update-non-racikan-by-id-non-racikan_PUT:
      rule: "PathPrefix(`/v1.0/order-obat/update-non-racikan-by-id-non-racikan`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
