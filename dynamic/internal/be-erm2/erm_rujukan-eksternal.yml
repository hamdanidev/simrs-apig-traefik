http:
  routers:

    v1_erm_rujukan-eksternal_create_POST:
      rule: "PathPrefix(`/v1.0/erm/rujukan-eksternal/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_rujukan-eksternal_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/rujukan-eksternal/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_rujukan-eksternal_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/rujukan-eksternal/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_rujukan-eksternal_get-by-no-rujukan_GET:
      rule: "PathPrefix(`/v1.0/erm/rujukan-eksternal/get-by-no-rujukan/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_rujukan-eksternal_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/rujukan-eksternal/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_rujukan-eksternal_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/rujukan-eksternal/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
