http:
  routers:

    v1_order-radiologi_getlist-order-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/order-radiologi/getlist-order-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-radiologi_create-order_POST:
      rule: "PathPrefix(`/v1.0/order-radiologi/create-order`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-radiologi_send-order_POST:
      rule: "PathPrefix(`/v1.0/order-radiologi/send-order/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-radiologi_update-order_PUT:
      rule: "PathPrefix(`/v1.0/order-radiologi/update-order`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-radiologi_getlist-order-radiologi-items-by-no-order_GET:
