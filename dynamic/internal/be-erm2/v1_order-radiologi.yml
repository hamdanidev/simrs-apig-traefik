        - "simrs-cors"
        - "simrs-auth"

    v1_order-radiologi_get-list-tindakan_GET:
      rule: "PathPrefix(`/v1.0/order-radiologi/get-list-tindakan/`) && (Method(`GET`) || Method(`OPTIONS`))"
