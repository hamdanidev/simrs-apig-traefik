http:
  routers:

    v1_erm_edukasi-pasien_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/edukasi-pasien/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_edukasi-pasien_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/edukasi-pasien/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_edukasi-pasien_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/edukasi-pasien/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_edukasi-pasien_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/edukasi-pasien/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_edukasi-pasien_create_POST:
      rule: "PathPrefix(`/v1.0/erm/edukasi-pasien/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_edukasi-pasien_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/edukasi-pasien/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_edukasi-pasien_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/edukasi-pasien/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
