http:
  routers:

    v1_rencana-kontrol_getlist_GET:
      rule: "PathPrefix(`/v1.0/rencana-kontrol/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rencana-kontrol_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/rencana-kontrol/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rencana-kontrol_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/rencana-kontrol/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rencana-kontrol_create_POST:
      rule: "PathPrefix(`/v1.0/rencana-kontrol/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rencana-kontrol_update_PUT:
      rule: "PathPrefix(`/v1.0/rencana-kontrol/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rencana-kontrol_delete_DELETE:
      rule: "PathPrefix(`/v1.0/rencana-kontrol/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rencana-kontrol_sync-no-kontrol_POST:
      rule: "PathPrefix(`/v1.0/rencana-kontrol/sync-no-kontrol`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rencana-kontrol_create-mjkn-ulang_POST:
      rule: "PathPrefix(`/v1.0/rencana-kontrol/create-mjkn-ulang`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rencana-kontrol_get-by-no-kontrol_GET:
      rule: "PathPrefix(`/v1.0/rencana-kontrol/get-by-no-kontrol/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
