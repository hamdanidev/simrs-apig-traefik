http:
  routers:

    v1_erm_screening-tb-anak_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/screening-tb-anak/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_screening-tb-anak_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/screening-tb-anak/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_screening-tb-anak_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/screening-tb-anak/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_screening-tb-anak_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/screening-tb-anak/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_screening-tb-anak_create_POST:
      rule: "PathPrefix(`/v1.0/erm/screening-tb-anak/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_screening-tb-anak_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/screening-tb-anak/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_screening-tb-anak_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/screening-tb-anak/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
