http:
  routers:

    v1_resume-medis-rawat-inap_pasien_cek-verifikator_GET:
      rule: "PathPrefix(`/v1.0/resume-medis-rawat-inap/pasien/cek-verifikator/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_resume-medis-rawat-inap_pasien_update-selesai-verifikator_PUT:
      rule: "PathPrefix(`/v1.0/resume-medis-rawat-inap/pasien/update-selesai-verifikator/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_resume-medis-rawat-inap_pasien_update-khusus-status-verifikator_PUT:
      rule: "PathPrefix(`/v1.0/resume-medis-rawat-inap/pasien/update-khusus-status-verifikator/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
