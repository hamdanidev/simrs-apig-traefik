http:
  routers:

    v1_pasien-operasi_update-dokter-operator-tiga_PUT:
      rule: "PathPrefix(`/v1.0/pasien-operasi/update-dokter-operator-tiga`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
