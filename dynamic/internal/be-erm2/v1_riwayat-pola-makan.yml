http:
  routers:

    v1_riwayat-pola-makan_create_POST:
      rule: "PathPrefix(`/v1.0/riwayat-pola-makan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_riwayat-pola-makan_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/riwayat-pola-makan/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_riwayat-pola-makan_get-list_GET:
      rule: "PathPrefix(`/v1.0/riwayat-pola-makan/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_riwayat-pola-makan_update_PUT:
      rule: "PathPrefix(`/v1.0/riwayat-pola-makan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_riwayat-pola-makan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/riwayat-pola-makan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
