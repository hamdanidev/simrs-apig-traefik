http:
  routers:

    v1_rehab-medis_update-asesmen-awal_PUT:
      rule: "PathPrefix(`/v1.0/rehab-medis/update-asesmen-awal`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
