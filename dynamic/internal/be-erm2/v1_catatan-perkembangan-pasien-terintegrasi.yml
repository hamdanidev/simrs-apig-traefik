http:
  routers:

    v1_catatan-perkembangan-pasien-terintegrasi_get-list_GET:
      rule: "PathPrefix(`/v1.0/catatan-perkembangan-pasien-terintegrasi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_catatan-perkembangan-pasien-terintegrasi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/catatan-perkembangan-pasien-terintegrasi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_catatan-perkembangan-pasien-terintegrasi_create_POST:
      rule: "PathPrefix(`/v1.0/catatan-perkembangan-pasien-terintegrasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_catatan-perkembangan-pasien-terintegrasi_update_PUT:
      rule: "PathPrefix(`/v1.0/catatan-perkembangan-pasien-terintegrasi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_catatan-perkembangan-pasien-terintegrasi_delete_DELETE:
      rule: "PathPrefix(`/v1.0/catatan-perkembangan-pasien-terintegrasi/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
