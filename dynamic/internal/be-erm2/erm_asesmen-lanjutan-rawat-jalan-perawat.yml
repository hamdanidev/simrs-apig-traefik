http:
  routers:

    v1_erm_asesmen-lanjutan-rawat-jalan-perawat_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rawat-jalan-perawat/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-lanjutan-rawat-jalan-perawat_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rawat-jalan-perawat/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-lanjutan-rawat-jalan-perawat_get-by-id-asesmen-lanjutan-dokter_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rawat-jalan-perawat/get-by-id-asesmen-lanjutan-dokter/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-lanjutan-rawat-jalan-perawat_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rawat-jalan-perawat/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-lanjutan-rawat-jalan-perawat_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rawat-jalan-perawat/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-lanjutan-rawat-jalan-perawat_create_POST:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rawat-jalan-perawat/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-lanjutan-rawat-jalan-perawat_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rawat-jalan-perawat/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-lanjutan-rawat-jalan-perawat_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rawat-jalan-perawat/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
