http:
  routers:

    v1_pengkajian-risiko-jatuh-dewasa_get-list_GET:
      rule: "PathPrefix(`/v1.0/pengkajian-risiko-jatuh-dewasa/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-risiko-jatuh-dewasa_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pengkajian-risiko-jatuh-dewasa/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-risiko-jatuh-dewasa_create_POST:
      rule: "PathPrefix(`/v1.0/pengkajian-risiko-jatuh-dewasa/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-risiko-jatuh-dewasa_update_PUT:
      rule: "PathPrefix(`/v1.0/pengkajian-risiko-jatuh-dewasa/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-risiko-jatuh-dewasa_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pengkajian-risiko-jatuh-dewasa/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
