http:
  routers:

    v1_billing-sarana_getlist_GET:
      rule: "PathPrefix(`/v1.0/billing-sarana/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_billing-sarana_getlist-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/billing-sarana/getlist-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_billing-sarana_create_POST:
      rule: "PathPrefix(`/v1.0/billing-sarana/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_billing-sarana_update_PUT:
      rule: "PathPrefix(`/v1.0/billing-sarana/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_billing-sarana_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/billing-sarana/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_billing-sarana_getlist-by-id-billing_GET:
      rule: "PathPrefix(`/v1.0/billing-sarana/getlist-by-id-billing/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
