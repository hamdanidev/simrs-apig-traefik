http:
  routers:

    v1_erm_riwayat-kunjungan_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/riwayat-kunjungan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_riwayat-kunjungan_create_POST:
      rule: "PathPrefix(`/v1.0/erm/riwayat-kunjungan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_riwayat-kunjungan_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/riwayat-kunjungan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_riwayat-kunjungan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/riwayat-kunjungan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_riwayat-kunjungan_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/riwayat-kunjungan/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_riwayat-kunjungan_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/riwayat-kunjungan/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_riwayat-kunjungan_get-by-no-registrasi-satu_GET:
      rule: "PathPrefix(`/v1.0/erm/riwayat-kunjungan/get-by-no-registrasi-satu/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_riwayat-kunjungan_get-by-no-registrasi-dua_GET:
      rule: "PathPrefix(`/v1.0/erm/riwayat-kunjungan/get-by-no-registrasi-dua/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
