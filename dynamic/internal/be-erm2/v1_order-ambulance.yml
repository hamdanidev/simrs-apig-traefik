http:
  routers:

    v1_order-ambulance_getlist-order-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/order-ambulance/getlist-order-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-ambulance_create-order_POST:
      rule: "PathPrefix(`/v1.0/order-ambulance/create-order`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-ambulance_send-order_POST:
