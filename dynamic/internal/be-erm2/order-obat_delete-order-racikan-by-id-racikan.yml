http:
  routers:

    v1_order-obat_delete-order-racikan-by-id-racikan_DELETE:
      rule: "PathPrefix(`/v1.0/order-obat/delete-order-racikan-by-id-racikan/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
