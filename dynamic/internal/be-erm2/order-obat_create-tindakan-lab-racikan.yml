http:
  routers:

    v1_order-obat_create-tindakan-lab-racikan_POST:
      rule: "PathPrefix(`/v1.0/order-obat/create-tindakan-lab-racikan`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
