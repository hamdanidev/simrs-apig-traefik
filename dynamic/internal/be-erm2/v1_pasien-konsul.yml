http:
  routers:

    v1_pasien-konsul_update-status-pelaksanaan_PUT:
      rule: "PathPrefix(`/v1.0/pasien-konsul/update-status-pelaksanaan`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-konsul_create-konsul_POST:
      rule: "PathPrefix(`/v1.0/pasien-konsul/create-konsul`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-konsul_update-data-konsul_PUT:
