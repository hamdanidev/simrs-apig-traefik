http:
  routers:

    v1_pengkajian-nyeri-komprehensif_get-list_GET:
      rule: "PathPrefix(`/v1.0/pengkajian-nyeri-komprehensif/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-nyeri-komprehensif_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pengkajian-nyeri-komprehensif/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-nyeri-komprehensif_create_POST:
      rule: "PathPrefix(`/v1.0/pengkajian-nyeri-komprehensif/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-nyeri-komprehensif_update_PUT:
      rule: "PathPrefix(`/v1.0/pengkajian-nyeri-komprehensif/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pengkajian-nyeri-komprehensif_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pengkajian-nyeri-komprehensif/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
