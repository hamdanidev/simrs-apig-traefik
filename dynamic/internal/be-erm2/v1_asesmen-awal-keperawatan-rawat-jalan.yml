http:
  routers:

    v1_asesmen-awal-keperawatan-rawat-jalan_get-list_GET:
      rule: "PathPrefix(`/v1.0/asesmen-awal-keperawatan-rawat-jalan/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-awal-keperawatan-rawat-jalan_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/asesmen-awal-keperawatan-rawat-jalan/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-awal-keperawatan-rawat-jalan_create_POST:
      rule: "PathPrefix(`/v1.0/asesmen-awal-keperawatan-rawat-jalan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-awal-keperawatan-rawat-jalan_update_PUT:
      rule: "PathPrefix(`/v1.0/asesmen-awal-keperawatan-rawat-jalan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-awal-keperawatan-rawat-jalan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/asesmen-awal-keperawatan-rawat-jalan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
