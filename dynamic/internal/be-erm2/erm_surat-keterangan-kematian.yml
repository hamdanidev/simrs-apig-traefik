http:
  routers:

    v1_erm_surat-keterangan-kematian_create_POST:
      rule: "PathPrefix(`/v1.0/erm/surat-keterangan-kematian/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_surat-keterangan-kematian_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/surat-keterangan-kematian/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_surat-keterangan-kematian_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/surat-keterangan-kematian/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_surat-keterangan-kematian_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/surat-keterangan-kematian/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_surat-keterangan-kematian_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/surat-keterangan-kematian/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_surat-keterangan-kematian_update-status-final_PUT:
      rule: "PathPrefix(`/v1.0/erm/surat-keterangan-kematian/update-status-final`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_surat-keterangan-kematian_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/surat-keterangan-kematian/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
