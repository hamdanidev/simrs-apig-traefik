http:
  routers:

    v1_pasien-mutasi_delete-pasien-mutasi_DELETE:
      rule: "PathPrefix(`/v1.0/pasien-mutasi/delete-pasien-mutasi/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
