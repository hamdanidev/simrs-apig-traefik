http:
  routers:

    v1_erm_pengkajian-awal-hemodialisa_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/pengkajian-awal-hemodialisa/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pengkajian-awal-hemodialisa_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/pengkajian-awal-hemodialisa/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pengkajian-awal-hemodialisa_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/pengkajian-awal-hemodialisa/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pengkajian-awal-hemodialisa_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/pengkajian-awal-hemodialisa/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pengkajian-awal-hemodialisa_create_POST:
      rule: "PathPrefix(`/v1.0/erm/pengkajian-awal-hemodialisa/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_pengkajian-awal-hemodialisa_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/pengkajian-awal-hemodialisa/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
