http:
  routers:

    v1_erm_skrining-risiko-malnutrisi_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/skrining-risiko-malnutrisi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_skrining-risiko-malnutrisi_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/skrining-risiko-malnutrisi/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_skrining-risiko-malnutrisi_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/skrining-risiko-malnutrisi/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_skrining-risiko-malnutrisi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/skrining-risiko-malnutrisi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_skrining-risiko-malnutrisi_create_POST:
      rule: "PathPrefix(`/v1.0/erm/skrining-risiko-malnutrisi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_skrining-risiko-malnutrisi_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/skrining-risiko-malnutrisi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_skrining-risiko-malnutrisi_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/skrining-risiko-malnutrisi/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
