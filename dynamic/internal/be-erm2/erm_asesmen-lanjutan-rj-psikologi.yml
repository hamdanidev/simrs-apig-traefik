http:
  routers:

    v1_erm_asesmen-lanjutan-rj-psikologi_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rj-psikologi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-lanjutan-rj-psikologi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rj-psikologi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-lanjutan-rj-psikologi_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rj-psikologi/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-lanjutan-rj-psikologi_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rj-psikologi/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-lanjutan-rj-psikologi_create_POST:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rj-psikologi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-lanjutan-rj-psikologi_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rj-psikologi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-lanjutan-rj-psikologi_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/asesmen-lanjutan-rj-psikologi/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
