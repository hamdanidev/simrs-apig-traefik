http:
  routers:

    v1_count-catatan-medis_by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/count-catatan-medis/by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_count-catatan-medis_by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/count-catatan-medis/by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
