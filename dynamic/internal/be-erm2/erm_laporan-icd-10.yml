http:
  routers:

    v1_erm_laporan-icd-10_rawat-inap_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/laporan-icd-10/rawat-inap/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_laporan-icd-10_rawat-jalan_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/laporan-icd-10/rawat-jalan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
