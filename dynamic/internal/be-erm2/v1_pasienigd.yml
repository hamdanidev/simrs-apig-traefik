http:
  routers:

    v1_pasienigd_getlist_pasienigd_GET:
      rule: "PathPrefix(`/v1.0/pasienigd/getlist/pasienigd`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasienigd_update_status_PUT:
      rule: "PathPrefix(`/v1.0/pasienigd/update/status/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

