http:
  routers:

    v1_cppt_update-diagnosa-sekunder_PUT:
      rule: "PathPrefix(`/v1.0/cppt/update-diagnosa-sekunder`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
