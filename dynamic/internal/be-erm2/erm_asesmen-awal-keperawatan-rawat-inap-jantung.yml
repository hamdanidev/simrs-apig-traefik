http:
  routers:

    v1_erm_asesmen-awal-keperawatan-rawat-inap-jantung_get-list_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-awal-keperawatan-rawat-inap-jantung/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-awal-keperawatan-rawat-inap-jantung_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/asesmen-awal-keperawatan-rawat-inap-jantung/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-awal-keperawatan-rawat-inap-jantung_create_POST:
      rule: "PathPrefix(`/v1.0/erm/asesmen-awal-keperawatan-rawat-inap-jantung/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-awal-keperawatan-rawat-inap-jantung_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/asesmen-awal-keperawatan-rawat-inap-jantung/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_asesmen-awal-keperawatan-rawat-inap-jantung_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/asesmen-awal-keperawatan-rawat-inap-jantung/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
