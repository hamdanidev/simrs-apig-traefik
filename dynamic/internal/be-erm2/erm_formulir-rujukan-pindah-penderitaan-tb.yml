http:
  routers:

    v1_erm_formulir-rujukan-pindah-penderitaan-tb_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/formulir-rujukan-pindah-penderitaan-tb/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_formulir-rujukan-pindah-penderitaan-tb_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/formulir-rujukan-pindah-penderitaan-tb/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_formulir-rujukan-pindah-penderitaan-tb_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/formulir-rujukan-pindah-penderitaan-tb/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_formulir-rujukan-pindah-penderitaan-tb_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/formulir-rujukan-pindah-penderitaan-tb/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_formulir-rujukan-pindah-penderitaan-tb_create_POST:
      rule: "PathPrefix(`/v1.0/erm/formulir-rujukan-pindah-penderitaan-tb/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_formulir-rujukan-pindah-penderitaan-tb_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/formulir-rujukan-pindah-penderitaan-tb/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_formulir-rujukan-pindah-penderitaan-tb_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/formulir-rujukan-pindah-penderitaan-tb/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
