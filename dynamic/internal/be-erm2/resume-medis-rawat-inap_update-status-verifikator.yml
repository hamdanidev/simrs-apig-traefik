http:
  routers:

    v1_resume-medis-rawat-inap_update-status-verifikator_PUT:
      rule: "PathPrefix(`/v1.0/resume-medis-rawat-inap/update-status-verifikator/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
