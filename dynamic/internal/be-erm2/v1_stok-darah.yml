http:
  routers:

    v1_stok-darah_getlist_GET:
      rule: "PathPrefix(`/v1.0/stok-darah/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-transfusi-darah
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-basic-auth"

  services:
    service-transfusi-darah:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_TRANSFUSI_DARAH_URL" }}'
