http:
  routers:

    v1_resume-kemoterapi_create_POST:
      rule: "PathPrefix(`/v1.0/resume-kemoterapi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_resume-kemoterapi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/resume-kemoterapi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_resume-kemoterapi_get-list_GET:
      rule: "PathPrefix(`/v1.0/resume-kemoterapi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_resume-kemoterapi_update_PUT:
      rule: "PathPrefix(`/v1.0/resume-kemoterapi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_resume-kemoterapi_delete_DELETE:
      rule: "PathPrefix(`/v1.0/resume-kemoterapi/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
