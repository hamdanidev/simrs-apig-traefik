http:
  routers:

    v1_barthel-indeks-mcu_get-list_GET:
      rule: "PathPrefix(`/v1.0/barthel-indeks-mcu/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_barthel-indeks-mcu_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/barthel-indeks-mcu/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_barthel-indeks-mcu_create_POST:
      rule: "PathPrefix(`/v1.0/barthel-indeks-mcu/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_barthel-indeks-mcu_update_PUT:
      rule: "PathPrefix(`/v1.0/barthel-indeks-mcu/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_barthel-indeks-mcu_delete_DELETE:
      rule: "PathPrefix(`/v1.0/barthel-indeks-mcu/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
