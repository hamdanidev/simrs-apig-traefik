http:
  routers:

    v1_pasien-mcu_getlist_GET:
      rule: "PathPrefix(`/v1.0/pasien-mcu/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-mcu_getlist_selesai-layanan_GET:
      rule: "PathPrefix(`/v1.0/pasien-mcu/getlist/selesai-layanan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-mcu_getlist_by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pasien-mcu/getlist/by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-mcu_getlist_by-no-registrasi-khusus_GET:
      rule: "PathPrefix(`/v1.0/pasien-mcu/getlist/by-no-registrasi-khusus/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    # duplicat_v1_pasien-mcu_getlist_by-no-registrasi-khusus_GET:
    #   rule: "PathPrefix(`/v1.0/pasien-mcu/getlist/by-no-registrasi-khusus/`) && (Method(`GET`) || Method(`OPTIONS`))"
    #   service: service-erm
    #   entryPoints:
    #     - web
    #   middlewares:
    #     - "simrs-cors"
    #     - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
