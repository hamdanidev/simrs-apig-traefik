http:
  routers:

    v1_formulir-general-consent_create_POST:
      rule: "PathPrefix(`/v1.0/formulir-general-consent/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_formulir-general-consent_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/formulir-general-consent/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_formulir-general-consent_get-list_GET:
      rule: "PathPrefix(`/v1.0/formulir-general-consent/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_formulir-general-consent_update_PUT:
      rule: "PathPrefix(`/v1.0/formulir-general-consent/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_formulir-general-consent_delete_DELETE:
      rule: "PathPrefix(`/v1.0/formulir-general-consent/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

