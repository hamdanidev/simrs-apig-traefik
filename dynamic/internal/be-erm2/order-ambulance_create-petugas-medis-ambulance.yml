http:
  routers:

    v1_order-ambulance_create-petugas-medis-ambulance_POST:
      rule: "PathPrefix(`/v1.0/order-ambulance/create-petugas-medis-ambulance`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
