http:
  routers:

    v1_erm_hasil-pemeriksaan-laboratorium_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/hasil-pemeriksaan-laboratorium/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_hasil-pemeriksaan-laboratorium_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/hasil-pemeriksaan-laboratorium/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_hasil-pemeriksaan-laboratorium_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/erm/hasil-pemeriksaan-laboratorium/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_hasil-pemeriksaan-laboratorium_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/hasil-pemeriksaan-laboratorium/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_hasil-pemeriksaan-laboratorium_create_POST:
      rule: "PathPrefix(`/v1.0/erm/hasil-pemeriksaan-laboratorium/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_hasil-pemeriksaan-laboratorium_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/hasil-pemeriksaan-laboratorium/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_hasil-pemeriksaan-laboratorium_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/hasil-pemeriksaan-laboratorium/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
