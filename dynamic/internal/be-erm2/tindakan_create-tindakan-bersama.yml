http:
  routers:

    v1_tindakan_create-tindakan-bersama_POST:
      rule: "PathPrefix(`/v1.0/tindakan/create-tindakan-bersama`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
