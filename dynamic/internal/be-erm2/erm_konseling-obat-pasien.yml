http:
  routers:

    v1_erm_konseling-obat-pasien_create_POST:
      rule: "PathPrefix(`/v1.0/erm/konseling-obat-pasien/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_konseling-obat-pasien_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/konseling-obat-pasien/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_konseling-obat-pasien_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/konseling-obat-pasien/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_konseling-obat-pasien_get-list_GET:
      rule: "PathPrefix(`/v1.0/erm/konseling-obat-pasien/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_konseling-obat-pasien_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/konseling-obat-pasien/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
