http:
  routers:

    v1_pasien-konsul_delete-pasien-konsul_DELETE:
      rule: "PathPrefix(`/v1.0/pasien-konsul/delete-pasien-konsul/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
