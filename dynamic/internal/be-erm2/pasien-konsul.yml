http:
  routers:
    pasien-konsul_update_status_pelaksanaan_1:
      rule: "PathPrefix(`/v1.0/pasien-konsul/update-status-pelaksanaan`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
