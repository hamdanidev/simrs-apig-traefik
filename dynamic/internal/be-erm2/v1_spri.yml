http:
  routers:

    v1_spri_getlist_GET:
      rule: "PathPrefix(`/v1.0/spri/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spri_get-by-no-spri_GET:
      rule: "PathPrefix(`/v1.0/spri/get-by-no-spri/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spri_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/spri/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spri_create_POST:
      rule: "PathPrefix(`/v1.0/spri/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spri_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/spri/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spri_update_PUT:
      rule: "PathPrefix(`/v1.0/spri/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spri_delete_DELETE:
      rule: "PathPrefix(`/v1.0/spri/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spri_getlist-all_GET:
      rule: "PathPrefix(`/v1.0/spri/getlist-all`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spri_getlist-paging_GET:
      rule: "PathPrefix(`/v1.0/spri/getlist-paging`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spri_update-status-registrasi_PUT:
      rule: "PathPrefix(`/v1.0/spri/update-status-registrasi`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_spri_get-by-use-reg_GET:
      rule: "PathPrefix(`/v1.0/spri/get-by-use-reg/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
