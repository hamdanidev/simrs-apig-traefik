http:
  routers:

    v1_orderobat_nonracikan_getlist_GET:
      rule: "PathPrefix(`/v1.0/orderobat/nonracikan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_orderobat_nonracikan_create_POST:
      rule: "PathPrefix(`/v1.0/orderobat/nonracikan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_orderobat_nonracikan_send_POST:
      rule: "PathPrefix(`/v1.0/orderobat/nonracikan/send/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_orderobat_nonracikan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/orderobat/nonracikan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_orderobat_nonracikan_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/orderobat/nonracikan/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
