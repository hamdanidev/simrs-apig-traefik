http:
  routers:

    v1_pasien-rawat-bersama_getlist-dokter-pengirim_GET:
      rule: "PathPrefix(`/v1.0/pasien-rawat-bersama/getlist-dokter-pengirim`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
