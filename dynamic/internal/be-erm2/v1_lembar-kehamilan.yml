http:
  routers:

    v1_lembar-kehamilan_create_POST:
      rule: "PathPrefix(`/v1.0/lembar-kehamilan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lembar-kehamilan_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/lembar-kehamilan/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lembar-kehamilan_get-list_GET:
      rule: "PathPrefix(`/v1.0/lembar-kehamilan/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lembar-kehamilan_update_PUT:
      rule: "PathPrefix(`/v1.0/lembar-kehamilan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lembar-kehamilan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/lembar-kehamilan/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
