http:
  routers:

    v1_order-cathlab_getlist-order-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/order-cathlab/getlist-order-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-cathlab_create-order_POST:
      rule: "PathPrefix(`/v1.0/order-cathlab/create-order`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-cathlab_send-order_POST:
      rule: "PathPrefix(`/v1.0/order-cathlab/send-order/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_order-cathlab_update-order_PUT:
      rule: "PathPrefix(`/v1.0/order-cathlab/update-order`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
