http:
  routers:
    v1_erm_tindakan-hemodialisa_create_POST:
      rule: "PathPrefix(`/v1.0/erm/tindakan-hemodialisa/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_tindakan-hemodialisa_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/tindakan-hemodialisa/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_tindakan-hemodialisa_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/tindakan-hemodialisa/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_tindakan-hemodialisa_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/erm/tindakan-hemodialisa/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_tindakan-hemodialisa_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/tindakan-hemodialisa/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_tindakan-hemodialisa_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/tindakan-hemodialisa/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"


  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
