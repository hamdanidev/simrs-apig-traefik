http:
  routers:

    v1_catatan-kegiatan-pasien-instalasi-radioterapi_get-list_GET:
      rule: "PathPrefix(`/v1.0/catatan-kegiatan-pasien-instalasi-radioterapi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_catatan-kegiatan-pasien-instalasi-radioterapi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/catatan-kegiatan-pasien-instalasi-radioterapi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_catatan-kegiatan-pasien-instalasi-radioterapi_create_POST:
      rule: "PathPrefix(`/v1.0/catatan-kegiatan-pasien-instalasi-radioterapi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_catatan-kegiatan-pasien-instalasi-radioterapi_update_PUT:
      rule: "PathPrefix(`/v1.0/catatan-kegiatan-pasien-instalasi-radioterapi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_catatan-kegiatan-pasien-instalasi-radioterapi_delete_DELETE:
      rule: "PathPrefix(`/v1.0/catatan-kegiatan-pasien-instalasi-radioterapi/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
