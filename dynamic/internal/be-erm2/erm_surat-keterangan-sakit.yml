http:
  routers:

    v1_erm_surat-keterangan-sakit_create_POST:
      rule: "PathPrefix(`/v1.0/erm/surat-keterangan-sakit/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_surat-keterangan-sakit_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/surat-keterangan-sakit/update/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_surat-keterangan-sakit_delete_DELETE:
      rule: "PathPrefix(`/v1.0/erm/surat-keterangan-sakit/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_surat-keterangan-sakit_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/surat-keterangan-sakit/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
