http:
  routers:

    v1_rencana-kontrol-pasien-umum_get-by-no-kontrol_GET:
      rule: "PathPrefix(`/v1.0/rencana-kontrol-pasien-umum/get-by-no-kontrol/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rencana-kontrol-pasien-umum_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/rencana-kontrol-pasien-umum/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rencana-kontrol-pasien-umum_create_POST:
      rule: "PathPrefix(`/v1.0/rencana-kontrol-pasien-umum/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rencana-kontrol-pasien-umum_update_PUT:
      rule: "PathPrefix(`/v1.0/rencana-kontrol-pasien-umum/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rencana-kontrol-pasien-umum_getlist_GET:
      rule: "PathPrefix(`/v1.0/rencana-kontrol-pasien-umum/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rencana-kontrol-pasien-umum_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/rencana-kontrol-pasien-umum/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rencana-kontrol-pasien-umum_delete_DELETE:
      rule: "PathPrefix(`/v1.0/rencana-kontrol-pasien-umum/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
