http:
  routers:

    v1_rehab-medis_create-terapi-fisioterapi_POST:
      rule: "PathPrefix(`/v1.0/rehab-medis/create-terapi-fisioterapi`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
