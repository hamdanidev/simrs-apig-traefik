http:
  routers:

    v1_order-lab_get-list-tindakan-bersama-lab_GET:
      rule: "PathPrefix(`/v1.0/order-lab/get-list-tindakan-bersama-lab/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
