http:
  routers:

    v1_ringkasan-masuk-keluar-pasien-rawat-inap_get-list_GET:
      rule: "PathPrefix(`/v1.0/ringkasan-masuk-keluar-pasien-rawat-inap/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ringkasan-masuk-keluar-pasien-rawat-inap_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/ringkasan-masuk-keluar-pasien-rawat-inap/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ringkasan-masuk-keluar-pasien-rawat-inap_create_POST:
      rule: "PathPrefix(`/v1.0/ringkasan-masuk-keluar-pasien-rawat-inap/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ringkasan-masuk-keluar-pasien-rawat-inap_update_PUT:
      rule: "PathPrefix(`/v1.0/ringkasan-masuk-keluar-pasien-rawat-inap/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_ringkasan-masuk-keluar-pasien-rawat-inap_delete_DELETE:
      rule: "PathPrefix(`/v1.0/ringkasan-masuk-keluar-pasien-rawat-inap/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
