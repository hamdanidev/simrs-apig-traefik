http:
  routers:

    v1_pasien-operasi_laporan_GET:
      rule: "PathPrefix(`/v1.0/pasien-operasi/laporan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
