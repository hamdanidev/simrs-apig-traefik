http:
  routers:

    v1_asesmen-keperawatan-instalasi-gawat-darurat_get-list_GET:
      rule: "PathPrefix(`/v1.0/asesmen-keperawatan-instalasi-gawat-darurat/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-keperawatan-instalasi-gawat-darurat_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/asesmen-keperawatan-instalasi-gawat-darurat/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-keperawatan-instalasi-gawat-darurat_create_POST:
      rule: "PathPrefix(`/v1.0/asesmen-keperawatan-instalasi-gawat-darurat/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-keperawatan-instalasi-gawat-darurat_update_PUT:
      rule: "PathPrefix(`/v1.0/asesmen-keperawatan-instalasi-gawat-darurat/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-keperawatan-instalasi-gawat-darurat_delete_DELETE:
      rule: "PathPrefix(`/v1.0/asesmen-keperawatan-instalasi-gawat-darurat/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
