http:
  routers:
    v1_pasien-mutasi_create-mutasi_POST:
      rule: "PathPrefix(`/v1.0/pasien-mutasi/create-mutasi`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_pasien-mutasi_update-data-mutasi_PUT:
      rule: "PathPrefix(`/v1.0/pasien-mutasi/update-data-mutasi`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_pasien-mutasi_aktifkan-mutasi_PUT:
      rule: "PathPrefix(`/v1.0/pasien-mutasi/aktifkan-mutasi/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_pasien-mutasi_getlist-dokter-pengirim_GET:
      rule: "PathPrefix(`/v1.0/pasien-mutasi/getlist-dokter-pengirim`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_pasien-mutasi_getlist-dokter-penerima_GET:
      rule: "PathPrefix(`/v1.0/pasien-mutasi/getlist-dokter-penerima`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_pasien-mutasi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pasien-mutasi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"
    v1_pasien-mutasi_delete-pasien-mutasi_DELETE:
      rule: "PathPrefix(`/v1.0/pasien-mutasi/delete-pasien-mutasi/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
