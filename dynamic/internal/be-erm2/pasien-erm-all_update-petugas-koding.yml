http:
  routers:

    v1_pasien-erm-all_update-petugas-koding_PUT:
      rule: "PathPrefix(`/v1.0/pasien-erm-all/update-petugas-koding`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
