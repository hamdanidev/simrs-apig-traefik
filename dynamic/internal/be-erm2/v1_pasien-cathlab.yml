http:
  routers:

    v1_pasien-cathlab_getlist_GET:
      rule: "PathPrefix(`/v1.0/pasien-cathlab/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-cathlab_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pasien-cathlab/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-cathlab_getlist-pasien-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pasien-cathlab/getlist-pasien-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasien-cathlab_get-range_POST:
