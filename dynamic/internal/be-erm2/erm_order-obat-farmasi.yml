http:
  routers:

    v1_erm_order-obat-farmasi_getlist_GET:
      rule: "PathPrefix(`/v1.0/erm/order-obat-farmasi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-obat-farmasi_create_POST:
      rule: "PathPrefix(`/v1.0/erm/order-obat-farmasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-obat-farmasi_update_PUT:
      rule: "PathPrefix(`/v1.0/erm/order-obat-farmasi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-obat-farmasi_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/erm/order-obat-farmasi/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-obat-farmasi_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/erm/order-obat-farmasi/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-obat-farmasi_get-by-nomor-resep_GET:
      rule: "PathPrefix(`/v1.0/erm/order-obat-farmasi/get-by-nomor-resep/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_erm_order-obat-farmasi_sendto_POST:
      rule: "PathPrefix(`/v1.0/erm/order-obat-farmasi/sendto/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
