http:
  routers:
    erm_rujukan_eksternal_create:
      rule: "PathPrefix(`/v1.0/erm/rujukan-eksternal/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_rujukan_eksternal_update:
      rule: "PathPrefix(`/v1.0/erm/rujukan-eksternal/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_rujukan_eksternal_get_by_no_registrasi:
      rule: "PathPrefix(`/v1.0/erm/rujukan-eksternal/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_rujukan_eksternal_get_by_no_rujukan:
      rule: "PathPrefix(`/v1.0/erm/rujukan-eksternal/get-by-no-rujukan/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_rujukan_eksternal_get_by_no_rm:
      rule: "PathPrefix(`/v1.0/erm/rujukan-eksternal/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    erm_rujukan_eksternal_delete:
      rule: "PathPrefix(`/v1.0/erm/rujukan-eksternal/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"


  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
