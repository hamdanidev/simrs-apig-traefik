http:
  routers:

    v1_asesmen-dokter-poli-tht_get-list_GET:
      rule: "PathPrefix(`/v1.0/asesmen-dokter-poli-tht/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-dokter-poli-tht_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/asesmen-dokter-poli-tht/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-dokter-poli-tht_create_POST:
      rule: "PathPrefix(`/v1.0/asesmen-dokter-poli-tht/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-dokter-poli-tht_update_PUT:
      rule: "PathPrefix(`/v1.0/asesmen-dokter-poli-tht/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-dokter-poli-tht_delete_DELETE:
      rule: "PathPrefix(`/v1.0/asesmen-dokter-poli-tht/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
