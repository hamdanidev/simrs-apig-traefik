http:
  routers:

    v1_asesmen-awal-medis_getlist_GET:
      rule: "PathPrefix(`/v1.0/asesmen-awal-medis/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-awal-medis_create_POST:
      rule: "PathPrefix(`/v1.0/asesmen-awal-medis/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-awal-medis_update_PUT:
      rule: "PathPrefix(`/v1.0/asesmen-awal-medis/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-awal-medis_delete_DELETE:
      rule: "PathPrefix(`/v1.0/asesmen-awal-medis/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-awal-medis_update-photos_PUT:
      rule: "PathPrefix(`/v1.0/asesmen-awal-medis/update-photos/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-awal-medis_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/asesmen-awal-medis/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-awal-medis_update-step-dua_PUT:
      rule: "PathPrefix(`/v1.0/asesmen-awal-medis/update-step-dua`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_asesmen-awal-medis_get-by-no-rm_GET:
      rule: "PathPrefix(`/v1.0/asesmen-awal-medis/get-by-no-rm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-erm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-erm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ERM_URL" }}'
