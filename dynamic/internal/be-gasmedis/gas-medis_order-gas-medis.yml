http:
  routers:

    v1_gas-medis_order-gas-medis_create_POST:
      rule: "PathPrefix(`/v1.0/gas-medis/order-gas-medis/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_order-gas-medis_getlist_GET:
      rule: "PathPrefix(`/v1.0/gas-medis/order-gas-medis/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_order-gas-medis_update_PUT:
      rule: "PathPrefix(`/v1.0/gas-medis/order-gas-medis/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_order-gas-medis_terima-order_PUT:
      rule: "PathPrefix(`/v1.0/gas-medis/order-gas-medis/terima-order`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_order-gas-medis_delete_DELETE:
      rule: "PathPrefix(`/v1.0/gas-medis/order-gas-medis/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_order-gas-medis_send-order_POST:
      rule: "PathPrefix(`/v1.0/gas-medis/order-gas-medis/send-order/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-gas-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_GAS_MEDIS_URL" }}'
