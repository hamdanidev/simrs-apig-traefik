http:
  routers:

    v1_gas-medis_laporan_stok-gas_GET:
      rule: "PathPrefix(`/v1.0/gas-medis/laporan/stok-gas`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_laporan_konsumsi-gas-per-unit_GET:
      rule: "PathPrefix(`/v1.0/gas-medis/laporan/konsumsi-gas-per-unit`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_laporan_rekapitulasi-order-unit_GET:
      rule: "PathPrefix(`/v1.0/gas-medis/laporan/rekapitulasi-order-unit`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_laporan_rekapitulasi-order-supplier_GET:
      rule: "PathPrefix(`/v1.0/gas-medis/laporan/rekapitulasi-order-supplier`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-gas-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_GAS_MEDIS_URL" }}'
