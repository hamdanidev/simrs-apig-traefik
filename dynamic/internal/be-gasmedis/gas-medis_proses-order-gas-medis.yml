http:
  routers:

    v1_gas-medis_proses-order-gas-medis_getlist_GET:
      rule: "PathPrefix(`/v1.0/gas-medis/proses-order-gas-medis/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_proses-order-gas-medis_order-disetujui_PUT:
      rule: "PathPrefix(`/v1.0/gas-medis/proses-order-gas-medis/order-disetujui`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_proses-order-gas-medis_order-ditolak_PUT:
      rule: "PathPrefix(`/v1.0/gas-medis/proses-order-gas-medis/order-ditolak`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_proses-order-gas-medis_kirim-ke-ruangan_PUT:
      rule: "PathPrefix(`/v1.0/gas-medis/proses-order-gas-medis/kirim-ke-ruangan`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-gas-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_GAS_MEDIS_URL" }}'
