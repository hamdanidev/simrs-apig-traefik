http:
  routers:

    v1_gas-medis_detail-order_create_POST:
      rule: "PathPrefix(`/v1.0/gas-medis/detail-order/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_detail-order_get-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/gas-medis/detail-order/get-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_detail-order_get-by-kode_GET:
      rule: "PathPrefix(`/v1.0/gas-medis/detail-order/get-by-kode/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_detail-order_generate-kode_GET:
      rule: "PathPrefix(`/v1.0/gas-medis/detail-order/generate-kode`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_detail-order_update_PUT:
      rule: "PathPrefix(`/v1.0/gas-medis/detail-order/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_detail-order_delete_DELETE:
      rule: "PathPrefix(`/v1.0/gas-medis/detail-order/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-gas-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_GAS_MEDIS_URL" }}'
