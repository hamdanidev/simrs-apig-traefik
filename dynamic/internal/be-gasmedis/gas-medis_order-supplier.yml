http:
  routers:

    v1_gas-medis_order-supplier_create_POST:
      rule: "PathPrefix(`/v1.0/gas-medis/order-supplier/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_order-supplier_getlist_GET:
      rule: "PathPrefix(`/v1.0/gas-medis/order-supplier/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_order-supplier_update_PUT:
      rule: "PathPrefix(`/v1.0/gas-medis/order-supplier/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_order-supplier_terima-order_PUT:
      rule: "PathPrefix(`/v1.0/gas-medis/order-supplier/terima-order`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_order-supplier_delete_DELETE:
      rule: "PathPrefix(`/v1.0/gas-medis/order-supplier/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_gas-medis_order-supplier_send-order_POST:
      rule: "PathPrefix(`/v1.0/gas-medis/order-supplier/send-order/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-gas-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_GAS_MEDIS_URL" }}'
