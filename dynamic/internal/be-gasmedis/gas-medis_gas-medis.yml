http:
  routers:

    v1_gas-medis_gas-medis_getlist_GET:
      rule: "PathPrefix(`/v1.0/gas-medis/gas-medis/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-gas-medis
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-gas-medis:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_GAS_MEDIS_URL" }}'
