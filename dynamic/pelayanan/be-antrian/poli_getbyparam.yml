    #   service: service-antrian
    #   entryPoints:
    #     - web
    #   middlewares:
    #     - "simrs-cors"
    #     - "simrs-auth"

  services:
    service-antrian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ANTRIAN_URL" }}' # IP Server Prod
