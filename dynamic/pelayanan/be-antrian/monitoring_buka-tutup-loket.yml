http:
  routers:

    v1_monitoring_buka-tutup-loket_POST:
      rule: "PathPrefix(`/v1.0/monitoring/buka-tutup-loket`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-antrian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ANTRIAN_URL" }}' # IP Server Prod
