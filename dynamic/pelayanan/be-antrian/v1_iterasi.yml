http:
  routers:

    v1_iterasi_getbytglantrian_GET:
      rule: "PathPrefix(`/v1.0/iterasi/getbytglantrian/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_iterasi_next-number_GET:
      rule: "PathPrefix(`/v1.0/iterasi/next-number`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_iterasi_panggilanke_PUT:
      rule: "PathPrefix(`/v1.0/iterasi/panggilanke/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_iterasi_status_PUT:
      rule: "PathPrefix(`/v1.0/iterasi/status/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_iterasi_total-antrian_GET:
      rule: "PathPrefix(`/v1.0/iterasi/total-antrian`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-antrian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ANTRIAN_URL" }}' # IP Server Prod
