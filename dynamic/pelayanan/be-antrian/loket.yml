http:
  routers:

    v1_loket_delete_DELETE:
      rule: "PathPrefix(`/v1.0/loket/delete/`) &&  (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-antrian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ANTRIAN_URL" }}' # IP Server Prod
