http:
  routers:

    v1_lab_getbytglantrian_GET:
      rule: "PathPrefix(`/v1.0/lab/getbytglantrian/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lab_panggilanke_PUT:
      rule: "PathPrefix(`/v1.0/lab/panggilanke/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lab_status_PUT:
      rule: "PathPrefix(`/v1.0/lab/status/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lab_next-number_GET:
      rule: "PathPrefix(`/v1.0/lab/next-number/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_lab_total-antrian_GET:
      rule: "PathPrefix(`/v1.0/lab/total-antrian/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-antrian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ANTRIAN_URL" }}' # IP Server Prod
