http:
  routers:

    v1_monitoring_getlist_GET:
      rule: "PathPrefix(`/v1.0/monitoring/getlist/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_monitoring_getall_GET:
      rule: "PathPrefix(`/v1.0/monitoring/getall`) && (Method(`GET`) || Method(`OPTIONS`))"
