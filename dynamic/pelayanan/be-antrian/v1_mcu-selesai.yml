http:
  routers:

    v1_mcu-selesai_getbytglantrian_GET:
      rule: "PathPrefix(`/v1.0/mcu-selesai/getbytglantrian/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_mcu-selesai_panggilanke_PUT:
      rule: "PathPrefix(`/v1.0/mcu-selesai/panggilanke/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_mcu-selesai_status_PUT:
      rule: "PathPrefix(`/v1.0/mcu-selesai/status/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_mcu-selesai_next-number_GET:
      rule: "PathPrefix(`/v1.0/mcu-selesai/next-number/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_mcu-selesai_total-antrian_GET:
      rule: "PathPrefix(`/v1.0/mcu-selesai/total-antrian/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-antrian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ANTRIAN_URL" }}' # IP Server Prod
