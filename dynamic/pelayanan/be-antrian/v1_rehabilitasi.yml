http:
  routers:

    v1_rehabilitasi_getbytglantrian_GET:
      rule: "PathPrefix(`/v1.0/rehabilitasi/getbytglantrian/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rehabilitasi_panggilanke_PUT:
      rule: "PathPrefix(`/v1.0/rehabilitasi/panggilanke/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rehabilitasi_status_PUT:
      rule: "PathPrefix(`/v1.0/rehabilitasi/status/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rehabilitasi_next-number_GET:
      rule: "PathPrefix(`/v1.0/rehabilitasi/next-number`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_rehabilitasi_total-antrian_GET:
      rule: "PathPrefix(`/v1.0/rehabilitasi/total-antrian`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-antrian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ANTRIAN_URL" }}' # IP Server Prod
