http:
  routers:

    v1_poli_getbyparam_GET:
      rule: "PathPrefix(`/v1.0/poli/getbyparam/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_poli_panggilanke_PUT:
      rule: "PathPrefix(`/v1.0/poli/panggilanke/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_poli_status_PUT:
