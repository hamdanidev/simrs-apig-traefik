http:
  routers:

    v1_kemoterapi_getbytglantrian_GET:
      rule: "PathPrefix(`/v1.0/kemoterapi/getbytglantrian/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kemoterapi_panggilanke_PUT:
      rule: "PathPrefix(`/v1.0/kemoterapi/panggilanke/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kemoterapi_status_PUT:
      rule: "PathPrefix(`/v1.0/kemoterapi/status/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kemoterapi_next-number_GET:
      rule: "PathPrefix(`/v1.0/kemoterapi/next-number`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kemoterapi_total-antrian_GET:
      rule: "PathPrefix(`/v1.0/kemoterapi/total-antrian`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-antrian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ANTRIAN_URL" }}' # IP Server Prod
