http:
  routers:

    v1_hemodialisa_getbytglantrian_GET:
      rule: "PathPrefix(`/v1.0/hemodialisa/getbytglantrian/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_hemodialisa_panggilanke_PUT:
      rule: "PathPrefix(`/v1.0/hemodialisa/panggilanke/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_hemodialisa_status_PUT:
      rule: "PathPrefix(`/v1.0/hemodialisa/status/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_hemodialisa_next-number_GET:
      rule: "PathPrefix(`/v1.0/hemodialisa/next-number`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_hemodialisa_total-antrian_GET:
      rule: "PathPrefix(`/v1.0/hemodialisa/total-antrian`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-antrian
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-antrian:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ANTRIAN_URL" }}' # IP Server Prod
