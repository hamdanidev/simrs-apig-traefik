    v1_pendaftaran_antrian-poli_batalkan-booking-khusus-rs_PUT:
      rule: "PathPrefix(`/v1.0/pendaftaran/antrian-poli/batalkan-booking-khusus-rs/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
