http:
  routers:

    v1_pendaftaran_antrian-poli_getlist_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/antrian-poli/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_antrian-poli_getlist-batal-hari-pelayanan_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/antrian-poli/getlist-batal-hari-pelayanan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_antrian-poli_get-by-id_GET:
