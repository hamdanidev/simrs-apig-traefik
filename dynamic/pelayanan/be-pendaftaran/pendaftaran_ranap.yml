http:
  routers:

    v1_pendaftaran_ranap_get-list_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/ranap/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_ranap_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/ranap/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
