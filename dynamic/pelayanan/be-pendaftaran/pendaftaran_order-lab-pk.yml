http:
  routers:

    v1_pendaftaran_order-lab-pk_getlist-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/order-lab-pk/getlist-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_order-lab-pk_create-order_POST:
      rule: "PathPrefix(`/v1.0/pendaftaran/order-lab-pk/create-order`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_order-lab-pk_send_POST:
