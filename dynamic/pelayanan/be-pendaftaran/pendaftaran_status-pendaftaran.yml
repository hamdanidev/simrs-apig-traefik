http:
  routers:

    v1_pendaftaran_status-pendaftaran_get-list_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/status-pendaftaran/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_status-pendaftaran_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/status-pendaftaran/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_status-pendaftaran_create_POST:
      rule: "PathPrefix(`/v1.0/pendaftaran/status-pendaftaran/create`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_status-pendaftaran_update_PUT:
      rule: "PathPrefix(`/v1.0/pendaftaran/status-pendaftaran/update`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_status-pendaftaran_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pendaftaran/status-pendaftaran/delete/`) &&  (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-pendaftaran:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_PENDAFTARAN_URL" }}'
