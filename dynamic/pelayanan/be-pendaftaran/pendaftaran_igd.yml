http:
  routers:

    v1_pendaftaran_igd_getlist_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/igd/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_igd_getbynoregistrasi_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/igd/getbynoregistrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
