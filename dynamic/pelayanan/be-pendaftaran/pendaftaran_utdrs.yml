http:
  routers:

    v1_pendaftaran_utdrs_get-list_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/utdrs/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_utdrs_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/utdrs/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_utdrs_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/utdrs/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_utdrs_get-list-utdrs-apm_GET:
