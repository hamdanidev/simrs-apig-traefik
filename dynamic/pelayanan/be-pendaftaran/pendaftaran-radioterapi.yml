http:
  routers:
    v1_pendaftaran_radioterapi_create-by-apm_POST:
      rule: "PathPrefix(`/v1.0/pendaftaran/radioterapi/create-by-apm`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-pendaftaran:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_PENDAFTARAN_URL" }}'
