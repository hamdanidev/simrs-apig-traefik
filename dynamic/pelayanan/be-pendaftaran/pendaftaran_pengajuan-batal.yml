http:
  routers:

    v1_pendaftaran_pengajuan-batal_getlist_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/pengajuan-batal/getlist`) &&  (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_pengajuan-batal_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/pengajuan-batal/get-by-no-registrasi/`) &&  (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_pengajuan-batal_create_POST:
      rule: "PathPrefix(`/v1.0/pendaftaran/pengajuan-batal/create`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_pengajuan-batal_update-status-pengajuan-batal_PUT:
      rule: "PathPrefix(`/v1.0/pendaftaran/pengajuan-batal/update-status-pengajuan-batal/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_pengajuan-batal_update_PUT:
      rule: "PathPrefix(`/v1.0/pendaftaran/pengajuan-batal/update/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_pengajuan-batal_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pendaftaran/pengajuan-batal/delete/`) &&  (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-pendaftaran:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_PENDAFTARAN_URL" }}'
