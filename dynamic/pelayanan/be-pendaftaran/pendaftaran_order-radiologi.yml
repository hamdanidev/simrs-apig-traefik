http:
  routers:

    v1_pendaftaran_order-radiologi_getlist-order-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/order-radiologi/getlist-order-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_order-radiologi_create-order_POST:
      rule: "PathPrefix(`/v1.0/pendaftaran/order-radiologi/create-order`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_order-radiologi_send-order_POST:
      rule: "PathPrefix(`/v1.0/pendaftaran/order-radiologi/send-order/`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_order-radiologi_update-order_PUT:
      rule: "PathPrefix(`/v1.0/pendaftaran/order-radiologi/update-order`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_order-radiologi_getlist-order-radiologi-items-by-no-order_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/order-radiologi/getlist-order-radiologi-items-by-no-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_order-radiologi_create-order-radiologi-items_POST:
      rule: "PathPrefix(`/v1.0/pendaftaran/order-radiologi/create-order-radiologi-items`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_order-radiologi_delete-order-radiologi-items_DELETE:
      rule: "PathPrefix(`/v1.0/pendaftaran/order-radiologi/delete-order-radiologi-items/`) &&  (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_order-radiologi_delete-tindakan_DELETE:
      rule: "PathPrefix(`/v1.0/pendaftaran/order-radiologi/delete-tindakan/`) &&  (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_order-radiologi_get-list-tindakan_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/order-radiologi/get-list-tindakan/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_order-radiologi_create-tindakan_POST:
      rule: "PathPrefix(`/v1.0/pendaftaran/order-radiologi/create-tindakan`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_order-radiologi_delete-order_DELETE:
      rule: "PathPrefix(`/v1.0/pendaftaran/order-radiologi/delete-order/`) &&  (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-pendaftaran:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_PENDAFTARAN_URL" }}'
