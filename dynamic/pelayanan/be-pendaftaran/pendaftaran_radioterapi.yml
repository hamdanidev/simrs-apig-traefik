http:
  routers:

    v1_pendaftaran_radioterapi_get-list_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/radioterapi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

