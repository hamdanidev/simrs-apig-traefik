http:
  routers:

    v1_pendaftaran_lab-pa_get-list_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/lab-pa/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_lab-pa_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/lab-pa/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_lab-pa_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/lab-pa/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_lab-pa_get-list-lab-pa-apm_GET:
