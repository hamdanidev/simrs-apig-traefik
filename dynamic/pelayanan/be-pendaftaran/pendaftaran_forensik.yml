http:
  routers:

    v1_pendaftaran_forensik_get-list_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/forensik/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_forensik_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/forensik/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_forensik_get-by-id_GET:
