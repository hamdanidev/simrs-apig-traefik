http:
  routers:

    v1_pendaftaran_rawatjalan_getlist_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatjalan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_rawatjalan_getbynoregistrasi_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatjalan/getbynoregistrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_rawatjalan_create_POST:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatjalan/create/`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_rawatjalan_update_PUT:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatjalan/update/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_rawatjalan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatjalan/delete/`) &&  (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_rawatjalan_generatenoregistrasi_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatjalan/generatenoregistrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_rawatjalan_generatenorm_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatjalan/generatenorm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_rawatjalan_update_step_PUT:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatjalan/update/step/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-pendaftaran:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_PENDAFTARAN_URL" }}'
