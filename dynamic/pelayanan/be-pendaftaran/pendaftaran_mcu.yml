http:
  routers:

    v1_pendaftaran_mcu_get-list_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/mcu/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_mcu_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/mcu/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_mcu_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/mcu/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_mcu_get-list-mcu-apm_GET:
