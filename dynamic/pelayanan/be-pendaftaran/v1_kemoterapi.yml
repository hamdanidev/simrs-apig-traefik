http:
  routers:

    v1_kemoterapi_jenispelayanan_getlist_GET:
      rule: "PathPrefix(`/v1.0/kemoterapi/jenispelayanan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kemoterapi_jenispelayanan_create_POST:
      rule: "PathPrefix(`/v1.0/kemoterapi/jenispelayanan/create`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kemoterapi_jenispelayanan_update_PUT:
      rule: "PathPrefix(`/v1.0/kemoterapi/jenispelayanan/update`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kemoterapi_jenispelayanan_delete_DELETE:
      rule: "PathPrefix(`/v1.0/kemoterapi/jenispelayanan/delete/`) &&  (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kemoterapi_jenispelayanan_getbyid_GET:
      rule: "PathPrefix(`/v1.0/kemoterapi/jenispelayanan/getbyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kemoterapi_jenispelayanan_getbykemoterapi_GET:
      rule: "PathPrefix(`/v1.0/kemoterapi/jenispelayanan/getbykemoterapi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-pendaftaran:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_PENDAFTARAN_URL" }}'
