http:
  routers:

    v1_pendaftaran_sep_getlist_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/sep/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_sep_get-by-no-sep_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/sep/get-by-no-sep/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_sep_create_POST:
      rule: "PathPrefix(`/v1.0/pendaftaran/sep/create`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_sep_update_PUT:
      rule: "PathPrefix(`/v1.0/pendaftaran/sep/update/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_sep_update-status-sep_PUT:
      rule: "PathPrefix(`/v1.0/pendaftaran/sep/update-status-sep/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_sep_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pendaftaran/sep/delete/`) &&  (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_sep_laporan-rl310_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/sep/laporan-rl310`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-pendaftaran:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_PENDAFTARAN_URL" }}'
