http:
  routers:

    v1_pendaftaran_rawatinap_getlist_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatinap/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_rawatinap_getbynoregistrasi_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatinap/getbynoregistrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_rawatinap_create_POST:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatinap/create`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_rawatinap_generatenoregistrasi_POST:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatinap/generatenoregistrasi/`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_rawatinap_update_PUT:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatinap/update/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_rawatinap_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatinap/delete/`) &&  (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_rawatinap_sendto_POST:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatinap/sendto/`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_rawatinap_getbynoantriandantanggalregistrasi_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/rawatinap/getbynoantriandantanggalregistrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-pendaftaran:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_PENDAFTARAN_URL" }}'
