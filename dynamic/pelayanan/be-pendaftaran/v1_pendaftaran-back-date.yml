http:
  routers:

    v1_pendaftaran-back-date_getlist_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran-back-date/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran-back-date_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran-back-date/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran-back-date_create_POST:
      rule: "PathPrefix(`/v1.0/pendaftaran-back-date/create`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran-back-date_update_PUT:
      rule: "PathPrefix(`/v1.0/pendaftaran-back-date/update/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran-back-date_delete_DELETE:
      rule: "PathPrefix(`/v1.0/pendaftaran-back-date/delete/`) &&  (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-pendaftaran:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_PENDAFTARAN_URL" }}'
