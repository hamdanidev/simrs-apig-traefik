http:
  routers:

    v1_pendaftaran_hemodialisa_get-list_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/hemodialisa/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_hemodialisa_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/hemodialisa/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
