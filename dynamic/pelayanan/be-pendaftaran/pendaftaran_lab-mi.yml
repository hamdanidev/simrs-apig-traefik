http:
  routers:

    v1_pendaftaran_lab-mi_get-list_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/lab-mi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_lab-mi_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/lab-mi/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_lab-mi_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/pendaftaran/lab-mi/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-pendaftaran
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pendaftaran_lab-mi_get-list-lab-mi-apm_GET:
