http:
  routers:

    v1_admlayanan_igd_getlist_GET:
      rule: "PathPrefix(`/v1.0/admlayanan/igd/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_admlayanan_igd_update_status-kedatangan_PUT:
      rule: "PathPrefix(`/v1.0/admlayanan/igd/update/status-kedatangan/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_admlayanan_igd_update_status_PUT:
      rule: "PathPrefix(`/v1.0/admlayanan/igd/update/status/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_admlayanan_igd_getlist_by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/admlayanan/igd/getlist/by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_admlayanan_igd_mutasi-layanan_PUT:
      rule: "PathPrefix(`/v1.0/admlayanan/igd/mutasi-layanan`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_admlayanan_igd_update-dokter-pengganti_PUT:
      rule: "PathPrefix(`/v1.0/admlayanan/igd/update-dokter-pengganti`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_admlayanan_igd_update_status-kedatangan-rest_PUT:
      rule: "PathPrefix(`/v1.0/admlayanan/igd/update/status-kedatangan-rest/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-admlayanan:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ADMLAYANAN_URL" }}' # IP Server Prod
          # - url: '{{ env "SERVICE_ADMLAYANAN_URL_2" }}' # IP Server Prod cadangan
