http:
  routers:

    v1_adm-layanan_pasien-insentive-care_getlist_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-insentive-care/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_pasien-insentive-care_getlist_selesai-layanan_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-insentive-care/getlist/selesai-layanan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_pasien-insentive-care_getlist_by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-insentive-care/getlist/by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-admlayanan:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ADMLAYANAN_URL" }}' # IP Server Prod
          # - url: '{{ env "SERVICE_ADMLAYANAN_URL_2" }}' # IP Server Prod cadangan
