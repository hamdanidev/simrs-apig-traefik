http:
  routers:

    v1_admlayanan_validasi-pre-pelayanan_POST:
      rule: "PathPrefix(`/v1.0/admlayanan/validasi-pre-pelayanan/`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-admlayanan:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ADMLAYANAN_URL" }}' # IP Server Prod
          # - url: '{{ env "SERVICE_ADMLAYANAN_URL_2" }}' # IP Server Prod cadangan
