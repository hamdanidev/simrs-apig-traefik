http:
  routers:

    v1_adm-layanan_pasien-konsul_getlist_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-konsul/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_pasien-konsul_getlist_by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-konsul/getlist/by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_pasien-konsul_update_status-kedatangan_PUT:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-konsul/update/status-kedatangan/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_pasien-konsul_update_PUT:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-konsul/update`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-admlayanan:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ADMLAYANAN_URL" }}' # IP Server Prod
          # - url: '{{ env "SERVICE_ADMLAYANAN_URL_2" }}' # IP Server Prod cadangan
