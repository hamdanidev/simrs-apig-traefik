http:
  routers:

    v1_adm-layanan_order-mcu_get-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/order-mcu/get-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_order-mcu_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/order-mcu/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_order-mcu_items_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/order-mcu/items/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_order-mcu_items_get-by-nomor-order_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/order-mcu/items/get-by-nomor-order/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_order-mcu_items_update_PUT:
      rule: "PathPrefix(`/v1.0/adm-layanan/order-mcu/items/update`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_order-mcu_update_PUT:
      rule: "PathPrefix(`/v1.0/adm-layanan/order-mcu/update`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_order-mcu_send-items-to-units_POST:
      rule: "PathPrefix(`/v1.0/adm-layanan/order-mcu/send-items-to-units/`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-admlayanan:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ADMLAYANAN_URL" }}' # IP Server Prod
          # - url: '{{ env "SERVICE_ADMLAYANAN_URL_2" }}' # IP Server Prod cadangan
