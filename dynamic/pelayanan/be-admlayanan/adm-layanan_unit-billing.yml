http:
  routers:

    v1_adm-layanan_unit-billing_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/unit-billing/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_unit-billing_create_POST:
      rule: "PathPrefix(`/v1.0/adm-layanan/unit-billing/create`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_unit-billing_cek-billing-pasien_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/unit-billing/cek-billing-pasien`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_unit-billing_delete_DELETE:
      rule: "PathPrefix(`/v1.0/adm-layanan/unit-billing/delete/`) &&  (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_unit-billing_update-kirim-kasir_PUT:
      rule: "PathPrefix(`/v1.0/adm-layanan/unit-billing/update-kirim-kasir/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-admlayanan:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ADMLAYANAN_URL" }}' # IP Server Prod
          # - url: '{{ env "SERVICE_ADMLAYANAN_URL_2" }}' # IP Server Prod cadangan
