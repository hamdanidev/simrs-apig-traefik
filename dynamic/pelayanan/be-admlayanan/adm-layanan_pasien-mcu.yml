http:
  routers:

    v1_adm-layanan_pasien-mcu_get-list-pasien_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-mcu/get-list-pasien`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_pasien-mcu_get-by-no-registrasi_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-mcu/get-by-no-registrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_pasien-mcu_get-list-mcu-layanan_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-mcu/get-list-mcu-layanan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_pasien-mcu_get-list-pasien-selesai_GET:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-mcu/get-list-pasien-selesai`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_pasien-mcu_create-mcu-layanan_POST:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-mcu/create-mcu-layanan`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_pasien-mcu_update-order_PUT:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-mcu/update-order/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_pasien-mcu_update-pasien-selesai_PUT:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-mcu/update-pasien-selesai/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_pasien-mcu_delete-mcu-layanan_DELETE:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-mcu/delete-mcu-layanan/`) &&  (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_adm-layanan_pasien-mcu_update_status-kedatangan_PUT:
      rule: "PathPrefix(`/v1.0/adm-layanan/pasien-mcu/update/status-kedatangan/`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-admlayanan:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_ADMLAYANAN_URL" }}' # IP Server Prod
          # - url: '{{ env "SERVICE_ADMLAYANAN_URL_2" }}' # IP Server Prod cadangan
