http:
  routers:

    v1_admlayanan_rawatjalan_create_POST:
      rule: "PathPrefix(`/v1.0/admlayanan/rawatjalan/create`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_admlayanan_rawatjalan_getlist_GET:
      rule: "PathPrefix(`/v1.0/admlayanan/rawatjalan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_admlayanan_rawatjalan_send_POST:
      rule: "PathPrefix(`/v1.0/admlayanan/rawatjalan/send/`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_admlayanan_rawatjalan_getlist_selesai-layanan_GET:
      rule: "PathPrefix(`/v1.0/admlayanan/rawatjalan/getlist/selesai-layanan`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-admlayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    # duplicat_v1_admlayanan_rawatjalan_getlist_selesai-layanan_GET:
