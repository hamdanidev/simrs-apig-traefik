http:
  routers:

    v1_antrianloket_getbynoantrian_GET:
      rule: "PathPrefix(`/v1.0/antrianloket/getbynoantrian/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-apm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_APM_URL" }}' # IP Server Prod
