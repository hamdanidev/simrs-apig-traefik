http:
  routers:

    v1_apm-pasien_create-antrian_POST:
      rule: "PathPrefix(`/v1.0/apm-pasien/create-antrian`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-apm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_APM_URL" }}' # IP Server Prod
