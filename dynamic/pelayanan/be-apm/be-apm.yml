http:

  routers:
    antrian_loket_1:
      rule: "PathPrefix(`/v1.0/antrianloket/create`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

