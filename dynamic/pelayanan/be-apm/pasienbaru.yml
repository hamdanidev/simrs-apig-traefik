http:
  routers:

    v1_pasienbaru_create_POST:
      rule: "PathPrefix(`/v1.0/pasienbaru/create`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasienbaru_update_GET:
      rule: "PathPrefix(`/v1.0/pasienbaru/update`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-apm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_APM_URL" }}' # IP Server Prod
