http:
  routers:

    v1_apm-pasien_create-antrian_POST:
      rule: "PathPrefix(`/v1.0/apm-pasien/create-antrian`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_apm-pasien_generate-otp_POST:
      rule: "PathPrefix(`/v1.0/apm-pasien/generate-otp`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_apm-pasien_upload_POST:
      rule: "PathPrefix(`/v1.0/apm-pasien/upload`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_apm-pasien_validate-otp_POST:
      rule: "PathPrefix(`/v1.0/apm-pasien/validate-otp`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_apm-pasien_create-antrian-backdate_POST:
      rule: "PathPrefix(`/v1.0/apm-pasien/create-antrian-backdate`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_apm-pasien_publish-bulk-to-pendaftaran_POST:
      rule: "PathPrefix(`/v1.0/apm-pasien/publish-bulk-to-pendaftaran`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_apm-pasien_publish-to-pendaftaran_POST:
      rule: "PathPrefix(`/v1.0/apm-pasien/publish-to-pendaftaran`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-apm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_APM_URL" }}' # IP Server Prod
