http:
  routers:

    v1_pasienlama_getbynoregistrasi_GET:
      rule: "PathPrefix(`/v1.0/pasienlama/getbynoregistrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasienlama_getbynorm_GET:
      rule: "PathPrefix(`/v1.0/pasienlama/getbynorm/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasienlama_checkregistrasi_GET:
      rule: "PathPrefix(`/v1.0/pasienlama/checkregistrasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasienlama_getbyid_GET:
      rule: "PathPrefix(`/v1.0/pasienlama/getbyid/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasienlama_create_POST:
      rule: "PathPrefix(`/v1.0/pasienlama/create`) &&  (Method(`POST`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasienlama_deletebyid_DELETE:
      rule: "PathPrefix(`/v1.0/pasienlama/deletebyid/`) &&  (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pasienlama_update_PUT:
      rule: "PathPrefix(`/v1.0/pasienlama/update`) &&  (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-apm
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-apm:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_APM_URL" }}' # IP Server Prod
