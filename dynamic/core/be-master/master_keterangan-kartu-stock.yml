http:
  routers:

    v1_master_keterangan-kartu-stock_get-list_GET:
      rule: "PathPrefix(`/v1.0/master/keterangan-kartu-stock/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_keterangan-kartu-stock_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/master/keterangan-kartu-stock/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_keterangan-kartu-stock_create_POST:
      rule: "PathPrefix(`/v1.0/master/keterangan-kartu-stock/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_keterangan-kartu-stock_update_PUT:
      rule: "PathPrefix(`/v1.0/master/keterangan-kartu-stock/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_keterangan-kartu-stock_delete-by-kd_DELETE:
      rule: "PathPrefix(`/v1.0/master/keterangan-kartu-stock/delete-by-kd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-master:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MASTER_URL" }}'
