http:
  routers:

    v1_master_paket-obat_get-list_GET:
      rule: "PathPrefix(`/v1.0/master/paket-obat/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_paket-obat_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/master/paket-obat/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_paket-obat_create_POST:
      rule: "PathPrefix(`/v1.0/master/paket-obat/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_paket-obat_update_PUT:
      rule: "PathPrefix(`/v1.0/master/paket-obat/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_paket-obat_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/master/paket-obat/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-master:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MASTER_URL" }}'
