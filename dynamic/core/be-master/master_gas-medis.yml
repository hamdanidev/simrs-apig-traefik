http:
  routers:

    v1_master_gas-medis_get-list_GET:
      rule: "PathPrefix(`/v1.0/master/gas-medis/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_gas-medis_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/master/gas-medis/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_gas-medis_create_POST:
      rule: "PathPrefix(`/v1.0/master/gas-medis/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_gas-medis_update_PUT:
      rule: "PathPrefix(`/v1.0/master/gas-medis/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_gas-medis_delete-by-kd_DELETE:
      rule: "PathPrefix(`/v1.0/master/gas-medis/delete-by-kd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-master:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MASTER_URL" }}'
