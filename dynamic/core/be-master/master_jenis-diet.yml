http:
  routers:

    v1_master_jenis-diet_get-list_GET:
      rule: "PathPrefix(`/v1.0/master/jenis-diet/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_jenis-diet_get-all_GET:
      rule: "PathPrefix(`/v1.0/master/jenis-diet/get-all`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_jenis-diet_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/master/jenis-diet/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_jenis-diet_create_POST:
      rule: "PathPrefix(`/v1.0/master/jenis-diet/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_jenis-diet_update_PUT:
      rule: "PathPrefix(`/v1.0/master/jenis-diet/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_jenis-diet_delete_DELETE:
      rule: "PathPrefix(`/v1.0/master/jenis-diet/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-master:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MASTER_URL" }}'
