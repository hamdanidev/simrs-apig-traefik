http:
  routers:

    v1_master_pabrik_getlist_GET:
      rule: "PathPrefix(`/v1.0/master/pabrik/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_pabrik_getbykd_GET:
      rule: "PathPrefix(`/v1.0/master/pabrik/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_pabrik_create_POST:
      rule: "PathPrefix(`/v1.0/master/pabrik/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_pabrik_update_PUT:
      rule: "PathPrefix(`/v1.0/master/pabrik/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_pabrik_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/master/pabrik/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_pabrik_getall_GET:
      rule: "PathPrefix(`/v1.0/master/pabrik/getall`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_pabrik_getbynama_GET:
      rule: "PathPrefix(`/v1.0/master/pabrik/getbynama/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-master:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MASTER_URL" }}'
