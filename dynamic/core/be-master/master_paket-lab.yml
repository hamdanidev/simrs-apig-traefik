http:
  routers:

    v1_master_paket-lab_getlist_GET:
      rule: "PathPrefix(`/v1.0/master/paket-lab/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_paket-lab_getall_GET:
      rule: "PathPrefix(`/v1.0/master/paket-lab/getall`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_paket-lab_get-by-id_GET:
      rule: "PathPrefix(`/v1.0/master/paket-lab/get-by-id/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_paket-lab_create_POST:
      rule: "PathPrefix(`/v1.0/master/paket-lab/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_paket-lab_update_PUT:
      rule: "PathPrefix(`/v1.0/master/paket-lab/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_paket-lab_delete-by-id_DELETE:
      rule: "PathPrefix(`/v1.0/master/paket-lab/delete-by-id/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-master:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MASTER_URL" }}'
