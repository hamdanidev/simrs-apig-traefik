http:
  routers:

    v1_master_item-rehabilitasi-medis_get-list_GET:
      rule: "PathPrefix(`/v1.0/master/item-rehabilitasi-medis/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_item-rehabilitasi-medis_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/master/item-rehabilitasi-medis/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_item-rehabilitasi-medis_create_POST:
      rule: "PathPrefix(`/v1.0/master/item-rehabilitasi-medis/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_item-rehabilitasi-medis_update_PUT:
      rule: "PathPrefix(`/v1.0/master/item-rehabilitasi-medis/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_item-rehabilitasi-medis_delete_DELETE:
      rule: "PathPrefix(`/v1.0/master/item-rehabilitasi-medis/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-master:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MASTER_URL" }}'
