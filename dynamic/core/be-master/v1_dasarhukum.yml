http:
  routers:

    v1_dasarhukum_getlist_GET:
      rule: "PathPrefix(`/v1.0/dasarhukum/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_dasarhukum_getbykd_GET:
      rule: "PathPrefix(`/v1.0/dasarhukum/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_dasarhukum_create_POST:
      rule: "PathPrefix(`/v1.0/dasarhukum/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_dasarhukum_update_PUT:
      rule: "PathPrefix(`/v1.0/dasarhukum/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_dasarhukum_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/dasarhukum/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_dasarhukum_getall_GET:
      rule: "PathPrefix(`/v1.0/dasarhukum/getall`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_dasarhukum_getbynama_GET:
      rule: "PathPrefix(`/v1.0/dasarhukum/getbynama/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-master:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MASTER_URL" }}'
