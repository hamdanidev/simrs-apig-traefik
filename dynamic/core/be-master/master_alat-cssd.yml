http:
  routers:

    v1_master_alat-cssd_get-list_GET:
      rule: "PathPrefix(`/v1.0/master/alat-cssd/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_alat-cssd_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/master/alat-cssd/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_alat-cssd_create_POST:
      rule: "PathPrefix(`/v1.0/master/alat-cssd/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_alat-cssd_update_PUT:
      rule: "PathPrefix(`/v1.0/master/alat-cssd/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_master_alat-cssd_delete_DELETE:
      rule: "PathPrefix(`/v1.0/master/alat-cssd/delete/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-master:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MASTER_URL" }}'
