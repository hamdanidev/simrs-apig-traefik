http:
  routers:

    v1_kelompok-barang_getlist_GET:
      rule: "PathPrefix(`/v1.0/kelompok-barang/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kelompok-barang_getbykd_GET:
      rule: "PathPrefix(`/v1.0/kelompok-barang/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kelompok-barang_create_POST:
      rule: "PathPrefix(`/v1.0/kelompok-barang/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kelompok-barang_update_PUT:
      rule: "PathPrefix(`/v1.0/kelompok-barang/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kelompok-barang_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/kelompok-barang/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kelompok-barang_getall_GET:
      rule: "PathPrefix(`/v1.0/kelompok-barang/getall`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kelompok-barang_getbynama_GET:
      rule: "PathPrefix(`/v1.0/kelompok-barang/getbynama/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-master:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MASTER_URL" }}'
