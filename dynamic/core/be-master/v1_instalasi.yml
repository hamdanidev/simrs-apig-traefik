http:
  routers:

    v1_instalasi_getlist_GET:
      rule: "PathPrefix(`/v1.0/instalasi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_instalasi_getbykd_GET:
      rule: "PathPrefix(`/v1.0/instalasi/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_instalasi_create_POST:
      rule: "PathPrefix(`/v1.0/instalasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_instalasi_update_PUT:
      rule: "PathPrefix(`/v1.0/instalasi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_instalasi_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/instalasi/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_instalasi_getall_GET:
      rule: "PathPrefix(`/v1.0/instalasi/getall`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_instalasi_getbynama_GET:
      rule: "PathPrefix(`/v1.0/instalasi/getbynama/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-master
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-master:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_MASTER_URL" }}'
