http:
  routers:

    v1_group_fitur_getlist_GET:
      rule: "PathPrefix(`/v1.0/group/fitur/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_fitur_getlistbykdgroup_GET:
      rule: "PathPrefix(`/v1.0/group/fitur/getlistbykdgroup/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_fitur_create_POST:
      rule: "PathPrefix(`/v1.0/group/fitur/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_fitur_deletebyid_DELETE:
      rule: "PathPrefix(`/v1.0/group/fitur/deletebyid/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_fitur_aktivasibyid_PUT:
      rule: "PathPrefix(`/v1.0/group/fitur/aktivasibyid/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_fitur_getallbykdgroupandkdmodul_GET:
      rule: "PathPrefix(`/v1.0/group/fitur/getallbykdgroupandkdmodul/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_fitur_getlistbykdgroupandkdmodul_GET:
      rule: "PathPrefix(`/v1.0/group/fitur/getlistbykdgroupandkdmodul/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-aksespengguna:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_AKSESPENGGUNA_URL" }}'
