http:
  routers:

    v1_group_aplikasi_getlist_GET:
      rule: "PathPrefix(`/v1.0/group/aplikasi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_aplikasi_getlistbykdgroup_GET:
      rule: "PathPrefix(`/v1.0/group/aplikasi/getlistbykdgroup/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_aplikasi_create_POST:
      rule: "PathPrefix(`/v1.0/group/aplikasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_aplikasi_deletebyid_DELETE:
      rule: "PathPrefix(`/v1.0/group/aplikasi/deletebyid/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_aplikasi_aktivasibyid_PUT:
      rule: "PathPrefix(`/v1.0/group/aplikasi/aktivasibyid/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_aplikasi_getallbykdgroup_GET:
      rule: "PathPrefix(`/v1.0/group/aplikasi/getallbykdgroup/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-aksespengguna:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_AKSESPENGGUNA_URL" }}'
