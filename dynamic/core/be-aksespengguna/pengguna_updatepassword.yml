http:
  routers:

    v1_pengguna_updatepassword_PUT:
      rule: "PathPrefix(`/v1.0/pengguna/updatepassword`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-aksespengguna:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_AKSESPENGGUNA_URL" }}'
