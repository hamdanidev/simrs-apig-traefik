http:
  routers:

    v1_aplikasi_modul_getlist_GET:
      rule: "PathPrefix(`/v1.0/aplikasi/modul/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_aplikasi_modul_getbykd_GET:
      rule: "PathPrefix(`/v1.0/aplikasi/modul/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_aplikasi_modul_getbykdaplikasi_GET:
      rule: "PathPrefix(`/v1.0/aplikasi/modul/getbykdaplikasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_aplikasi_modul_create_POST:
      rule: "PathPrefix(`/v1.0/aplikasi/modul/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_aplikasi_modul_update_PUT:
      rule: "PathPrefix(`/v1.0/aplikasi/modul/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_aplikasi_modul_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/aplikasi/modul/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-aksespengguna:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_AKSESPENGGUNA_URL" }}'
