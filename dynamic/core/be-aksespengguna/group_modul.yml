http:
  routers:

    v1_group_modul_getlist_GET:
      rule: "PathPrefix(`/v1.0/group/modul/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_modul_getlistbykdgroup_GET:
      rule: "PathPrefix(`/v1.0/group/modul/getlistbykdgroup/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_modul_create_POST:
      rule: "PathPrefix(`/v1.0/group/modul/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_modul_deletebyid_DELETE:
      rule: "PathPrefix(`/v1.0/group/modul/deletebyid/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_modul_aktivasibyid_PUT:
      rule: "PathPrefix(`/v1.0/group/modul/aktivasibyid/`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_modul_getlistbykdgroupandkdaplikasi_GET:
      rule: "PathPrefix(`/v1.0/group/modul/getlistbykdgroupandkdaplikasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_group_modul_getallbykdgroupandkdaplikasi_GET:
      rule: "PathPrefix(`/v1.0/group/modul/getallbykdgroupandkdaplikasi/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-aksespengguna
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-aksespengguna:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_AKSESPENGGUNA_URL" }}'
