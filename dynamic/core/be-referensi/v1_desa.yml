http:
  routers:

    v1_desa_getlist_GET:
      rule: "PathPrefix(`/v1.0/desa/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_desa_getbykd_GET:
      rule: "PathPrefix(`/v1.0/desa/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_desa_getbykdkec_GET:
      rule: "PathPrefix(`/v1.0/desa/getbykdkec/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_desa_create_POST:
      rule: "PathPrefix(`/v1.0/desa/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_desa_update_PUT:
      rule: "PathPrefix(`/v1.0/desa/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_desa_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/desa/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-referensi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REFERENSI_URL" }}'
