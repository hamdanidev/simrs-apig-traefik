http:
  routers:

    v1_statuspernikahan_getlist_GET:
      rule: "PathPrefix(`/v1.0/statuspernikahan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_statuspernikahan_getbykd_GET:
      rule: "PathPrefix(`/v1.0/statuspernikahan/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_statuspernikahan_create_POST:
      rule: "PathPrefix(`/v1.0/statuspernikahan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_statuspernikahan_update_PUT:
      rule: "PathPrefix(`/v1.0/statuspernikahan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_statuspernikahan_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/statuspernikahan/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-referensi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REFERENSI_URL" }}'
