http:
  routers:

    v1_rumah-sakit_activate_PUT:
      rule: "PathPrefix(`/v1.0/rumah-sakit/activate`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-referensi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REFERENSI_URL" }}'
