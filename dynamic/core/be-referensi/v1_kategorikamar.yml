http:
  routers:

    v1_kategorikamar_getlist_GET:
      rule: "PathPrefix(`/v1.0/kategorikamar/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kategorikamar_getbykd_GET:
      rule: "PathPrefix(`/v1.0/kategorikamar/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kategorikamar_create_POST:
      rule: "PathPrefix(`/v1.0/kategorikamar/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kategorikamar_update_PUT:
      rule: "PathPrefix(`/v1.0/kategorikamar/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kategorikamar_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/kategorikamar/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-referensi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REFERENSI_URL" }}'
