http:
  routers:

    v1_golonganpegawai_getlist_GET:
      rule: "PathPrefix(`/v1.0/golonganpegawai/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_golonganpegawai_getbykd_GET:
      rule: "PathPrefix(`/v1.0/golonganpegawai/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_golonganpegawai_create_POST:
      rule: "PathPrefix(`/v1.0/golonganpegawai/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_golonganpegawai_update_PUT:
      rule: "PathPrefix(`/v1.0/golonganpegawai/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_golonganpegawai_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/golonganpegawai/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-referensi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REFERENSI_URL" }}'
