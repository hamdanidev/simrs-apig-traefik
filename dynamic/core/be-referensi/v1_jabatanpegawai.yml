http:
  routers:

    v1_jabatanpegawai_getlist_GET:
      rule: "PathPrefix(`/v1.0/jabatanpegawai/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_jabatanpegawai_getbykd_GET:
      rule: "PathPrefix(`/v1.0/jabatanpegawai/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_jabatanpegawai_create_POST:
      rule: "PathPrefix(`/v1.0/jabatanpegawai/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_jabatanpegawai_update_PUT:
      rule: "PathPrefix(`/v1.0/jabatanpegawai/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_jabatanpegawai_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/jabatanpegawai/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-referensi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REFERENSI_URL" }}'
