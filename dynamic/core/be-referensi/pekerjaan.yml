http:
  routers:

    v1_pekerjaan_create_POST:
      rule: "PathPrefix(`/v1.0/pekerjaan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_pekerjaan_update_PUT:
      rule: "PathPrefix(`/v1.0/pekerjaan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-referensi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REFERENSI_URL" }}'
