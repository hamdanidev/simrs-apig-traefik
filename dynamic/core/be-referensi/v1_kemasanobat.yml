http:
  routers:

    v1_kemasanobat_getlist_GET:
      rule: "PathPrefix(`/v1.0/kemasanobat/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kemasanobat_getbykd_GET:
      rule: "PathPrefix(`/v1.0/kemasanobat/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kemasanobat_create_POST:
      rule: "PathPrefix(`/v1.0/kemasanobat/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kemasanobat_update_PUT:
      rule: "PathPrefix(`/v1.0/kemasanobat/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kemasanobat_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/kemasanobat/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-referensi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REFERENSI_URL" }}'
