http:
  routers:

    v1_referensi_organisasi_get-list_GET:
      rule: "PathPrefix(`/v1.0/referensi/organisasi/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_referensi_organisasi_get-by-kd_GET:
      rule: "PathPrefix(`/v1.0/referensi/organisasi/get-by-kd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_referensi_organisasi_create_POST:
      rule: "PathPrefix(`/v1.0/referensi/organisasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_referensi_organisasi_update_PUT:
      rule: "PathPrefix(`/v1.0/referensi/organisasi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_referensi_organisasi_delete-by-kd_DELETE:
      rule: "PathPrefix(`/v1.0/referensi/organisasi/delete-by-kd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-referensi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REFERENSI_URL" }}'
