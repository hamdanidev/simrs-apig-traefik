http:
  routers:

    v1_referensi_keterangan-aset_get-list_GET:
      rule: "PathPrefix(`/v1.0/referensi/keterangan-aset/get-list`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_referensi_keterangan-aset_get-by-kd_GET:
