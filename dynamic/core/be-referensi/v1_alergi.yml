http:
  routers:

    v1_alergi_getlist_GET:
      rule: "PathPrefix(`/v1.0/alergi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_alergi_getbykd_GET:
      rule: "PathPrefix(`/v1.0/alergi/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_alergi_create_POST:
      rule: "PathPrefix(`/v1.0/alergi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_alergi_update_PUT:
      rule: "PathPrefix(`/v1.0/alergi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_alergi_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/alergi/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-referensi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REFERENSI_URL" }}'
