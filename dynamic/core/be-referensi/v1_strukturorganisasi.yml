http:
  routers:

    v1_strukturorganisasi_getlist_GET:
      rule: "PathPrefix(`/v1.0/strukturorganisasi/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_strukturorganisasi_getbykd_GET:
      rule: "PathPrefix(`/v1.0/strukturorganisasi/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_strukturorganisasi_create_POST:
      rule: "PathPrefix(`/v1.0/strukturorganisasi/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_strukturorganisasi_update_PUT:
      rule: "PathPrefix(`/v1.0/strukturorganisasi/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_strukturorganisasi_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/strukturorganisasi/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-referensi
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-referensi:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_REFERENSI_URL" }}'
