http:
  routers:

    v1_paketmcu_pelayanan_getlist_GET:
      rule: "PathPrefix(`/v1.0/paketmcu/pelayanan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-jasa-pelayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_paketmcu_pelayanan_getlistbykdpaketmcu_GET:
      rule: "PathPrefix(`/v1.0/paketmcu/pelayanan/getlistbykdpaketmcu/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-jasa-pelayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_paketmcu_pelayanan_create_POST:
      rule: "PathPrefix(`/v1.0/paketmcu/pelayanan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-jasa-pelayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_paketmcu_pelayanan_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/paketmcu/pelayanan/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-jasa-pelayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-jasa-pelayanan:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_JASA_PELAYANAN_URL" }}'
