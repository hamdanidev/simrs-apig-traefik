http:
  routers:

    v1_kategoripelayanan_getlist_GET:
      rule: "PathPrefix(`/v1.0/kategoripelayanan/getlist`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-jasa-pelayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kategoripelayanan_getbykd_GET:
      rule: "PathPrefix(`/v1.0/kategoripelayanan/getbykd/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-jasa-pelayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kategoripelayanan_create_POST:
      rule: "PathPrefix(`/v1.0/kategoripelayanan/create`) && (Method(`POST`) || Method(`OPTIONS`))"
      service: service-jasa-pelayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kategoripelayanan_update_PUT:
      rule: "PathPrefix(`/v1.0/kategoripelayanan/update`) && (Method(`PUT`) || Method(`OPTIONS`))"
      service: service-jasa-pelayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kategoripelayanan_deletebykd_DELETE:
      rule: "PathPrefix(`/v1.0/kategoripelayanan/deletebykd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-jasa-pelayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kategoripelayanan_getall_GET:
      rule: "PathPrefix(`/v1.0/kategoripelayanan/getall`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-jasa-pelayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

    v1_kategoripelayanan_getbystandarlayanan_GET:
      rule: "PathPrefix(`/v1.0/kategoripelayanan/getbystandarlayanan/`) && (Method(`GET`) || Method(`OPTIONS`))"
      service: service-jasa-pelayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-jasa-pelayanan:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_JASA_PELAYANAN_URL" }}'
