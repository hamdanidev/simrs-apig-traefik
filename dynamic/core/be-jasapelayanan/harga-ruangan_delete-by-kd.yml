http:
  routers:

    v1_harga-ruangan_delete-by-kd_DELETE:
      rule: "PathPrefix(`/v1.0/harga-ruangan/delete-by-kd/`) && (Method(`DELETE`) || Method(`OPTIONS`))"
      service: service-jasa-pelayanan
      entryPoints:
        - web
      middlewares:
        - "simrs-cors"
        - "simrs-auth"

  services:
    service-jasa-pelayanan:
      loadBalancer:
        servers:
          - url: '{{ env "SERVICE_JASA_PELAYANAN_URL" }}'
