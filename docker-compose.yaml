services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: always
    ports:
      - "9090:9080" # Port trafik utama (pengganti APISIX)
      - "18080:8080" # Port Dashboard Traefik
    volumes:
      # Agar Traefik bisa membaca container Docker lain
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # File konfigurasi utama
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      # Folder untuk file routing (perawat, dokter, dev, prod)
      - ./dynamic/${ENV_TYPE}:/etc/traefik/dynamic:ro
    environment:
      - ENV_TYPE=${ENV_TYPE:-dev}
    networks:
      - traefik-net

networks:
  traefik-net:
    driver: bridge # Docker akan otomatis membuat network ini jika belum ada
