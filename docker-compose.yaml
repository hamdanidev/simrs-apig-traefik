services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: always
    ports:
      - "9090:9080" # Port trafik utama (pengganti APISIX)
      - "18080:8080" # Port Dashboard Traefik
    volumes:
      # Agar Traefik bisa membaca container Docker lain
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # File konfigurasi utama
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      # Folder untuk file routing (perawat, dokter, dev, prod)
      - ./dynamic:/etc/traefik/dynamic:ro
      #- ./access_logs:/var/log/traefik
    env_file:
      - .env
    networks:
      - traefik-net
    logging: # ← tambah ini
      driver: json-file
      options:
        max-size: "20m" # Traefik bisa lebih besar, banyak request
        max-file: "5"
  promtail:
    image: grafana/promtail:latest
    networks:
      - traefik-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    logging: # ← tambah ini juga
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
networks:
  traefik-net:
    driver: bridge # Docker akan otomatis membuat network ini jika belum ada
